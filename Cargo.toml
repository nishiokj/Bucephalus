[workspace]
members = [
  "rust/crates/lab-analysis",
  "rust/crates/lab-cli",
  "rust/crates/lab-core",
  "rust/crates/lab-provenance",
  "rust/crates/lab-runner",
  "rust/crates/lab-schemas",
]
resolver = "2"

[workspace.package]
version = "0.3.33"
edition = "2021"
license = "MIT"
repository = "https://github.com/nishiokj/Bucephalus"

[workspace.dependencies]
anyhow = "1"
base64 = "0.21.7"
bytes = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
hyper = { version = "0.14", features = ["client", "http1", "stream"] }
include_dir = "0.7"
jsonschema = { version = "0.17", default-features = false, features = ["resolve-file"] }
lab-analysis = { path = "rust/crates/lab-analysis", version = "0.3.0" }
lab-core = { path = "rust/crates/lab-core", version = "0.3.0" }
lab-provenance = { path = "rust/crates/lab-provenance", version = "0.3.0" }
lab-runner = { path = "rust/crates/lab-runner", version = "0.3.0" }
lab-schemas = { path = "rust/crates/lab-schemas", version = "0.3.0" }
libc = "0.2"
percent-encoding = "2"
postgres = "0.19"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.33", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
walkdir = "2"
zip = "0.6"
