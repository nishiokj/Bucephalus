services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bucephalus_cloud
      POSTGRES_USER: bucephalus
      POSTGRES_PASSWORD: bucephalus_dev
    ports:
      - "127.0.0.1:55432:5432"
      - "${BUCEPHALUS_POSTGRES_TAILSCALE_BIND_ADDR:-127.0.0.1}:55433:5432"
    volumes:
      - bucephalus-cloud-postgres:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bucephalus -d bucephalus_cloud"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bucephalus-cloud-postgres:
