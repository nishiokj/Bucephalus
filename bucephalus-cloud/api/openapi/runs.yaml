  /v1/worker/run-attempts/{attempt_id}/runtime/event-rows:
    post:
      operationId: ingestRunAttemptRuntimeEventRows
      summary: Land a batch of live trial event rows for a run attempt.
      security:
        - workerAttemptBearerAuth: []
      description: >
        Worker live-evidence ingestion. Batches are idempotent: rows are keyed
        by (core_run_id, trial_id, schedule_idx, attempt, row_seq) and a replay
        upserts in place, so at-least-once delivery from the worker pump is
        safe. Requires the attempt token.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - runner_instance_id
                - rows
              properties:
                runner_instance_id:
                  type: string
                  format: uuid
                  minLength: 1
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - core_run_id
                      - trial_id
                      - schedule_idx
                      - attempt
                      - row_seq
                      - event_type
                    properties:
                      core_run_id:
                        type: string
                        pattern: '^run_[A-Za-z0-9_.-]+$'
                      trial_id:
                        type: string
                        minLength: 1
                      schedule_idx:
                        type: integer
                        minimum: 0
                      attempt:
                        type: integer
                        minimum: 0
                      row_seq:
                        type: integer
                        minimum: 0
                      slot_commit_id:
                        type: string
                      variant_id:
                        type: string
                      task_id:
                        type: string
                      repl_idx:
                        type: integer
                        minimum: 0
                      seq:
                        type: integer
                        minimum: 0
                      event_type:
                        type: string
                        minLength: 1
                      ts:
                        type:
                          - string
                          - 'null'
                      payload:
                        $ref: './common.yaml#/components/schemas/AnyJsonObject'
      responses:
        '200':
          description: Batch landed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - received
                  - upserted
                properties:
                  received:
                    type: integer
                  upserted:
                    type: integer
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/worker/run-attempts/{attempt_id}/runtime/artifacts:
    post:
      operationId: uploadRunAttemptRuntimeArtifact
      summary: Upload a first-class runtime artifact for a run attempt.
      security:
        - workerAttemptBearerAuth: []
      description: >
        Worker artifact ingestion. The request body is the raw artifact bytes.
        The API verifies the attempt token, stores bytes in the configured object
        backend, and upserts runtime attempt-object metadata so result payloads
        can resolve content later.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AttemptId'
        - name: X-Bucephalus-Runner-Instance-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Bucephalus-Core-Run-Id
          in: header
          required: true
          schema:
            type: string
            pattern: '^run_[A-Za-z0-9_.-]+$'
        - name: X-Bucephalus-Trial-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Bucephalus-Schedule-Idx
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
        - name: X-Bucephalus-Trial-Attempt
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
        - name: X-Bucephalus-Artifact-Role
          in: header
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,63}$'
        - name: X-Bucephalus-Artifact-Relative-Path
          in: header
          required: false
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: binary
          application/x-ndjson:
            schema:
              type: string
              format: binary
          text/plain:
            schema:
              type: string
              format: binary
          text/x-diff:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Runtime artifact stored.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - artifact
                properties:
                  artifact:
                    $ref: './common.yaml#/components/schemas/AnyJsonObject'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
