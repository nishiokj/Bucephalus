        related lifecycle/audit events, similar to `kubectl describe` or
        `oc describe`. Pass `view=resource` to fetch the raw runtime resource
        manifest object, matching Kubernetes-style `get` semantics.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/RunId'
        - name: kind
