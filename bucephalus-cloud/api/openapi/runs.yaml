          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: view
          in: query
          required: false
          description: >
            Response shape. `describe` returns the describe bundle; `resource`
            returns the raw RuntimeResource object.
          schema:
            type: string
            enum:
              - describe
              - resource
            default: describe
        - name: event_limit
