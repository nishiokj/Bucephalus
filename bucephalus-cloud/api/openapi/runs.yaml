    RunAttempt:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - run_id
        - worker_id
        - runner_instance_id
        - status
        - lease_expires_at
        - heartbeat_at
        - started_at
        - created_at
        - updated_at
      properties:
        attempt_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        worker_id:
          type: string
        runner_instance_id:
          type:
            - string
            - 'null'
          format: uuid
        status:
          type: string
          enum:
            - running
            - completed
            - failed
            - expired
        lease_expires_at:
          type: string
          format: date-time
        heartbeat_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        ended_at:
          type:
            - string
            - 'null'
          format: date-time
        error_message:
          type:
            - string
            - 'null'
    WorkerCapabilities:
      type: object
      additionalProperties: false
      required:
        - executors
        - resources
      properties:
        executors:
          type: array
          items:
            type: string
            enum:
              - runner-docker
              - modal
        resources:
          type: array
          items:
            type: string
          description: >
            VM runner resources available to satisfy run requirements, for
            example core_runner, docker_daemon, registry_pull, modal.
        arch:
          type: string
          enum:
            - x86_64
            - arm64
        cpu_count:
          type: integer
          minimum: 1
        memory_mb:
          type: integer
          minimum: 1
        disk_mb:
          type: integer
          minimum: 1
        isolation:
          type: array
          items:
            type: string
            enum:
              - reusable_vm
              - single_use_vm
    RunRequirements:
      type: object
      additionalProperties: false
      required:
        - executor
        - requires
        - image_refs
        - secret_ids
        - network_perimeter
        - sidecars
        - accelerators
        - arch
        - cpu_count
        - memory_mb
        - disk_mb
        - isolation
        - timeout_ms
        - max_parallel_trials
      properties:
        executor:
          type: string
          enum:
            - runner-docker
            - modal
        requires:
          type: array
          items:
            type: string
        image_refs:
          type: array
          items:
            type: string
        secret_ids:
          type: array
          items:
            type: string
          description: Secret ids declared for this run. Values are ids only, never secret plaintext.
        network_perimeter:
          type: object
          additionalProperties: false
          required:
            - default
            - task_sandbox
            - agent
            - egress_hosts
          properties:
            default:
              type: string
              enum:
                - none
            task_sandbox:
              type: string
              enum:
                - none
            agent:
              type: string
              enum:
                - none
            egress_hosts:
              type: array
              items:
                type: string
          description: >
            Declared Cloud runtime network perimeter. Cloud runs reject ambient
            network modes; external egress must be listed by hostname.
        sidecars:
          type: array
          items:
            type: string
          description: >
            Declared sidecar ids or services required by the run. Each sidecar
            also becomes a required runner resource named sidecar:<id>.
        accelerators:
          type: array
          items:
            type: string
          description: >
            Declared accelerator requirements such as gpu classes. Each
            accelerator also becomes a required runner resource named
            accelerator:<id>.
        arch:
          type: string
          enum:
            - x86_64
            - arm64
        cpu_count:
          type: integer
          minimum: 1
        memory_mb:
          type: integer
          minimum: 1
        disk_mb:
          type: integer
          minimum: 1
        isolation:
          type: string
          enum:
            - reusable_vm
            - single_use_vm
        timeout_ms:
          type:
            - integer
            - 'null'
          minimum: 1
        max_parallel_trials:
          type: integer
          minimum: 1
