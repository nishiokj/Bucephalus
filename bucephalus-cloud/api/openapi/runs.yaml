openapi: 3.1.0
info:
  title: Bucephalus Cloud Runs API
  version: 0.1.0
  description: >
    Cloud run request primitives. A run references an accepted sealed package
    artifact and supplies only the environment values or secret references that
    are not already provided by the target runtime environment.
servers:
  - url: https://api.bucephalus.dev
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/packages:
    get:
      operationId: listPackageArtifacts
      summary: List recent package artifacts.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: './common.yaml#/components/parameters/Limit'
        - name: include_config
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Include full manifest, resolved experiment, diagnostics, provenance, and image metadata.
      responses:
        '200':
          description: Package artifacts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - packages
                properties:
                  packages:
                    type: array
                    items:
                      $ref: '#/components/schemas/PackageArtifact'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
  /v1/packages/{package_digest}:
    get:
      operationId: getPackageArtifact
      summary: Fetch an accepted sealed package artifact by digest.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - name: package_digest
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Digest'
      responses:
        '200':
          description: Package artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageArtifact'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/packages/{package_digest}/content:
    get:
      operationId: downloadPackageArtifact
      summary: Download sealed package artifact bytes by digest.
      security:
        - workerAttemptBearerAuth: []
      description: >
        Workers use this endpoint to materialize package content. The request
        must present the worker attempt bearer token and X-Bucephalus-Attempt-Id
        for a running attempt whose run uses this package digest. The API
        resolves package storage metadata through the run owner's package association
        so same-digest uploads from another owner cannot redirect a
        worker onto another storage object. Workers must not read API-local
        storage paths from the database.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - name: package_digest
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Digest'
        - name: X-Bucephalus-Attempt-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Running attempt id bound to the bearer attempt token.
      responses:
        '200':
          description: Package archive bytes.
          headers:
            X-Bucephalus-Package-Digest:
              schema:
                $ref: './common.yaml#/components/schemas/Digest'
          content:
            application/gzip:
              schema:
                type: string
                format: binary
            application/x-tar:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
  /v1/runs:
    get:
      operationId: listRuns
      summary: List recent Cloud run records.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: './common.yaml#/components/parameters/Limit'
        - name: package_digest
          in: query
          required: false
          schema:
            $ref: './common.yaml#/components/schemas/Digest'
          description: Restrict results to runs created from a specific package artifact.
        - name: include_runtime
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Include runtime progress and queued pending-reason enrichment.
        - name: include_config
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Include run config blobs such as runtime options, requirements, provenance, and env/secret key summaries.
      responses:
        '200':
          description: Run records.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - runs
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudRun'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
    post:
      operationId: createRun
      summary: Create a Cloud run request for an accepted sealed package.
      description: >
        This creates a run record. It does not build, rewrite, register, or
        launch a different artifact. Runtime execution can be attached later by
        a managed runner.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - package_digest
              properties:
                package_digest:
                  $ref: './common.yaml#/components/schemas/Digest'
                run_label:
                  type:
                    - string
                    - 'null'
                env:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 32768
                  description: >
                    Plain non-secret environment values supplied for this run.
                    Keys must be uppercase shell identifiers matching
                    [A-Z_][A-Z0-9_]*, must not collide with secret_refs keys,
                    and must not use reserved Cloud runtime/control-plane names
                    such as DATABASE_URL, BUCEPHALUS_CLOUD_WORKER_TOKEN, or
                    provider credential variables. Values must not contain NUL
                    bytes and are limited to 32768 UTF-8 bytes.
                secret_refs:
                  type: object
                  additionalProperties:
                    type: string
                  description: >
                    Environment variable names mapped to secret references.
                    bucephalus://<name> references a hosted secret previously
                    uploaded via PUT /v1/secrets/<name> and is translated to a
                    backing provider ref at run creation. Direct provider refs
                    are also accepted:
                    gcp-secret-manager://projects/<project>/secrets/<secret>/versions/<version>
                    and aws-secrets-manager://<secret-id>.
                runtime_options:
                  $ref: '#/components/schemas/CloudRuntimeOptions'
                  description: >
                    Run-time execution options. Cloud backends use `backend`
                    values such as `runner-docker` or `modal`; `runner-docker`
                    is executed by a VM runner daemon and maps to Core's Docker
                    executor inside that VM.
      responses:
        '201':
          description: Run record created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudRun'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
  /v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Fetch a Cloud run record.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Run record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudRun'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/runtime:
    get:
      operationId: getRunRuntime
      summary: Fetch live Core runtime state for a Cloud run.
      description: >
        Reads API-owned worker runtime snapshots plus any legacy normalized
        Core runtime rows. Runner VMs report runtime state through the Cloud API
        and do not need direct database credentials.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Live runtime summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSummary'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/runtime/events:
    get:
      operationId: listRunRuntimeEvents
      summary: List live trace events for a Cloud run.
      description: >
        One chronological stream combining trial trajectory rows (live-ingested
        during the run, repaired from worker runtime snapshots after it) and
        worker harness lifecycle events, distinguished by source.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: after_row_seq
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Live runtime event rows.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - cloud_run_id
                  - events
                properties:
                  cloud_run_id:
                    type: string
                    format: uuid
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/RuntimeEvent'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/runtime/results:
    get:
      operationId: getRunRuntimeResults
      summary: Fetch runtime result rows for a Cloud run.
      description: >
        Returns normalized legacy runtime rows plus trial, metric, and contract
        stage rows derived from API-owned worker runtime snapshots.
        Snapshot-derived rows include row.source=worker_runtime_snapshot.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        '200':
          description: Runtime results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResults'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/runtime/kv/{key}:
    get:
      operationId: getRunRuntimeKv
      summary: Fetch live runtime values by key for a Cloud run.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Runtime values for the requested key.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - cloud_run_id
                  - key
                  - values
                properties:
                  cloud_run_id:
                    type: string
                    format: uuid
                  key:
                    type: string
                  values:
                    type: array
                    items:
                      $ref: './common.yaml#/components/schemas/AnyJsonObject'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/worker/runs/claim:
    post:
      operationId: claimRun
      summary: Claim the next queued Cloud run for a registered runner instance.
      security:
        - workerBearerAuth: []
        - workerTokenHeader: []
      description: >
        Uses the Cloud API durable run queue. The API owns database access and
        creates a leased run attempt transactionally; runner VMs do not need
        direct Postgres credentials to claim work. Requires the Cloud worker
        service token, either as a bearer token or X-Bucephalus-Worker-Token.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerLeaseRequest'
      responses:
        '200':
          description: Claimed run or empty claim result.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RunClaim'
                  - type: object
                    additionalProperties: false
                    required:
                      - claimed
                    properties:
                      claimed:
                        const: false
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/worker/run-attempts/{attempt_id}/heartbeat:
    post:
      operationId: heartbeatRunAttempt
      summary: Extend a worker lease for a run attempt.
      security:
        - workerAttemptBearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerLeaseRequest'
      responses:
        '200':
          description: Updated attempt.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - attempt
                properties:
                  attempt:
                    $ref: '#/components/schemas/RunAttempt'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/worker/run-attempts/{attempt_id}/events:
    post:
      operationId: appendRunAttemptEvent
      summary: Append an event for a run attempt.
      security:
        - workerAttemptBearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - runner_instance_id
                - event_type
              properties:
                runner_instance_id:
                  type: string
                  format: uuid
                  minLength: 1
                event_type:
                  type: string
                  minLength: 1
                payload:
                  $ref: './common.yaml#/components/schemas/AnyJsonObject'
      responses:
        '201':
          description: Event appended.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - event
                properties:
                  event:
                    $ref: '#/components/schemas/RunEvent'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/worker/run-attempts/{attempt_id}/runtime/event-rows:
    post:
      operationId: ingestRunAttemptRuntimeEventRows
      summary: Land a batch of live trial event rows for a run attempt.
      security:
        - workerAttemptBearerAuth: []
      description: >
        Worker live-evidence ingestion. Batches are idempotent: rows are keyed
        by (core_run_id, trial_id, schedule_idx, attempt, row_seq) and a replay
        upserts in place, so at-least-once delivery from the worker pump is
        safe. Requires the attempt token.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - runner_instance_id
                - rows
              properties:
                runner_instance_id:
                  type: string
                  format: uuid
                  minLength: 1
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - core_run_id
                      - trial_id
                      - schedule_idx
                      - attempt
                      - row_seq
                      - event_type
                    properties:
                      core_run_id:
                        type: string
                        pattern: '^run_[A-Za-z0-9_.-]+$'
                      trial_id:
                        type: string
                        minLength: 1
                      schedule_idx:
                        type: integer
                        minimum: 0
                      attempt:
                        type: integer
                        minimum: 0
                      row_seq:
                        type: integer
                        minimum: 0
                      slot_commit_id:
                        type: string
                      variant_id:
                        type: string
                      task_id:
                        type: string
                      repl_idx:
                        type: integer
                        minimum: 0
                      seq:
                        type: integer
                        minimum: 0
                      event_type:
                        type: string
                        minLength: 1
                      ts:
                        type:
                          - string
                          - 'null'
                      payload:
                        $ref: './common.yaml#/components/schemas/AnyJsonObject'
      responses:
        '200':
          description: Batch landed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - received
                  - upserted
                properties:
                  received:
                    type: integer
                  upserted:
                    type: integer
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/worker/run-attempts/{attempt_id}/complete:
    post:
      operationId: completeRunAttempt
      summary: Mark a run attempt and run completed.
      security:
        - workerAttemptBearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - runner_instance_id
              properties:
                runner_instance_id:
                  type: string
                  format: uuid
                  minLength: 1
      responses:
        '200':
          description: Completed run claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunClaim'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/worker/run-attempts/{attempt_id}/fail:
    post:
      operationId: failRunAttempt
      summary: Mark a run attempt and run failed.
      security:
        - workerAttemptBearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - runner_instance_id
                - message
              properties:
                runner_instance_id:
                  type: string
                  format: uuid
                  minLength: 1
                message:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Failed run claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunClaim'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/worker/runs/expire-leases:
    post:
      operationId: expireRunLeases
      summary: Expire stale worker leases and requeue their runs.
      security:
        - workerBearerAuth: []
        - workerTokenHeader: []
      description: >
        Timer-driven queue maintenance owned by the Cloud API. Runners call this
        endpoint as a worker maintenance action; they do not connect to Postgres
        for queue wakeups. Requires the Cloud worker service token, either as a
        bearer token or X-Bucephalus-Worker-Token.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
      responses:
        '200':
          description: Expired attempts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - expired
                properties:
                  expired:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunClaim'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-pools:
    post:
      operationId: createRunnerPool
      summary: Create a runner pool.
      security:
        - runnerAdminBearerAuth: []
        - runnerAdminTokenHeader: []
      description: Requires the runner admin token, either as a bearer token or X-Bucephalus-Runner-Admin-Token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunnerPoolRequest'
      responses:
        '201':
          description: Runner pool created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerPool'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
    get:
      operationId: listRunnerPools
      summary: List runner pools.
      security:
        - runnerAdminBearerAuth: []
        - runnerAdminTokenHeader: []
      description: Requires the runner admin token, either as a bearer token or X-Bucephalus-Runner-Admin-Token.
      responses:
        '200':
          description: Runner pools.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - runner_pools
                properties:
                  runner_pools:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunnerPool'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-pools/{runner_pool_id}:
    get:
      operationId: getRunnerPool
      summary: Fetch a runner pool.
      security:
        - runnerAdminBearerAuth: []
        - runnerAdminTokenHeader: []
      description: Requires the runner admin token, either as a bearer token or X-Bucephalus-Runner-Admin-Token.
      parameters:
        - $ref: '#/components/parameters/RunnerPoolId'
      responses:
        '200':
          description: Runner pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerPool'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-pools/{runner_pool_id}/drain:
    post:
      operationId: drainRunnerPool
      summary: Mark a runner pool draining.
      security:
        - runnerAdminBearerAuth: []
        - runnerAdminTokenHeader: []
      description: Requires the runner admin token, either as a bearer token or X-Bucephalus-Runner-Admin-Token.
      parameters:
        - $ref: '#/components/parameters/RunnerPoolId'
      responses:
        '200':
          description: Updated runner pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerPool'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-pools/{runner_pool_id}/disable:
    post:
      operationId: disableRunnerPool
      summary: Disable an internal runner pool.
      security:
        - runnerAdminBearerAuth: []
        - runnerAdminTokenHeader: []
      description: Requires the runner admin token, either as a bearer token or X-Bucephalus-Runner-Admin-Token.
      parameters:
        - $ref: '#/components/parameters/RunnerPoolId'
      responses:
        '200':
          description: Updated runner pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerPool'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-instances/register:
    post:
      operationId: registerRunnerInstance
      summary: Register a runner VM daemon instance.
      security:
        - workerBearerAuth: []
        - workerTokenHeader: []
      description: Requires the Cloud worker service token, either as a bearer token or X-Bucephalus-Worker-Token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRunnerInstanceRequest'
      responses:
        '201':
          description: Runner instance registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerInstance'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-instances:
    get:
      operationId: listRunnerInstances
      summary: List runner VM daemon instances.
      security:
        - runnerAdminBearerAuth: []
        - runnerAdminTokenHeader: []
      description: Requires the runner admin token, either as a bearer token or X-Bucephalus-Runner-Admin-Token.
      parameters:
        - name: runner_pool_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Runner instances.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - runner_instances
                properties:
                  runner_instances:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunnerInstance'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-instances/expire-stale:
    post:
      operationId: expireStaleRunnerInstances
      summary: Mark stale runner instances offline.
      security:
        - runnerAdminBearerAuth: []
        - runnerAdminTokenHeader: []
      description: Requires the runner admin token, either as a bearer token or X-Bucephalus-Runner-Admin-Token.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                runner_pool_id:
                  type: string
                  format: uuid
                stale_after_seconds:
                  type: integer
                  minimum: 1
                  default: 90
      responses:
        '200':
          description: Runner instances marked offline.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - runner_instances
                properties:
                  runner_instances:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunnerInstance'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-provision-requests:
    get:
      operationId: listRunnerProvisionRequests
      summary: List runner VM provision requests.
      security:
        - runnerAdminBearerAuth: []
        - runnerAdminTokenHeader: []
      description: Requires the runner admin token, either as a bearer token or X-Bucephalus-Runner-Admin-Token.
      parameters:
        - name: runner_pool_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Runner provision requests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - provision_requests
                properties:
                  provision_requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunnerProvisionRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-instances/{runner_instance_id}/heartbeat:
    post:
      operationId: heartbeatRunnerInstance
      summary: Heartbeat a runner VM daemon instance.
      security:
        - workerBearerAuth: []
        - workerTokenHeader: []
      description: Requires the Cloud worker service token, either as a bearer token or X-Bucephalus-Worker-Token.
      parameters:
        - $ref: '#/components/parameters/RunnerInstanceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                capabilities:
                  $ref: '#/components/schemas/WorkerCapabilities'
                metadata:
                  $ref: './common.yaml#/components/schemas/AnyJsonObject'
      responses:
        '200':
          description: Updated runner instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerInstance'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-instances/{runner_instance_id}/drain:
    post:
      operationId: drainRunnerInstance
      summary: Mark a runner instance draining.
      security:
        - runnerAdminBearerAuth: []
        - runnerAdminTokenHeader: []
      description: Requires the runner admin token, either as a bearer token or X-Bucephalus-Runner-Admin-Token.
      parameters:
        - $ref: '#/components/parameters/RunnerInstanceId'
      responses:
        '200':
          description: Updated runner instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerInstance'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-instances/{runner_instance_id}/unhealthy:
    post:
      operationId: markRunnerInstanceUnhealthy
      summary: Mark a runner instance unhealthy after a host or cleanup failure.
      security:
        - workerBearerAuth: []
        - workerTokenHeader: []
      description: Requires the Cloud worker service token, either as a bearer token or X-Bucephalus-Worker-Token.
      parameters:
        - $ref: '#/components/parameters/RunnerInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerInstanceUnhealthyRequest'
      responses:
        '200':
          description: Updated runner instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerInstance'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-instances/{runner_instance_id}/offline:
    post:
      operationId: markRunnerInstanceOffline
      summary: Mark a runner instance offline after daemon shutdown.
      security:
        - workerBearerAuth: []
        - workerTokenHeader: []
      description: Requires the Cloud worker service token, either as a bearer token or X-Bucephalus-Worker-Token.
      parameters:
        - $ref: '#/components/parameters/RunnerInstanceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerInstanceOfflineRequest'
      responses:
        '200':
          description: Updated runner instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerInstance'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
    workerAttemptBearerAuth:
      $ref: './common.yaml#/components/securitySchemes/workerAttemptBearerAuth'
    workerBearerAuth:
      $ref: './common.yaml#/components/securitySchemes/workerBearerAuth'
    workerTokenHeader:
      $ref: './common.yaml#/components/securitySchemes/workerTokenHeader'
    runnerAdminBearerAuth:
      $ref: './common.yaml#/components/securitySchemes/runnerAdminBearerAuth'
    runnerAdminTokenHeader:
      $ref: './common.yaml#/components/securitySchemes/runnerAdminTokenHeader'
  parameters:
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunnerPoolId:
      name: runner_pool_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunnerInstanceId:
      name: runner_instance_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    WorkerLeaseRequest:
      type: object
      additionalProperties: false
      required:
        - runner_instance_id
      properties:
        runner_instance_id:
          type: string
          format: uuid
          minLength: 1
        lease_seconds:
          type: integer
          minimum: 5
          maximum: 3600
          default: 30
    RunClaim:
      type: object
      additionalProperties: false
      required:
        - claimed
        - run
        - attempt
      properties:
        claimed:
          const: true
        run:
          $ref: '#/components/schemas/CloudRun'
        attempt:
          $ref: '#/components/schemas/RunAttempt'
    PackageArtifact:
      type: object
      additionalProperties: false
      required:
        - package_digest
        - status
        - created_at
        - updated_at
      properties:
        package_digest:
          $ref: './common.yaml#/components/schemas/Digest'
        name:
          type:
            - string
            - 'null'
          description: >
            Human-readable package identity, taken from the resolved
            experiment's name sealed inside the package.
        description:
          type:
            - string
            - 'null'
          description: Short package summary when available.
        tags:
          type: array
          items:
            type: string
          description: Package tags from manifest or resolved experiment metadata.
        owner:
          type:
            - string
            - 'null'
          description: Owning principal or manifest-declared owner when available.
        upload_id:
          type:
            - string
            - 'null'
          format: uuid
        byte_size:
          type:
            - integer
            - 'null'
          minimum: 0
        media_type:
          type:
            - string
            - 'null'
        manifest_json:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        resolved_experiment_json:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        target:
          oneOf:
            - $ref: './common.yaml#/components/schemas/BuildTarget'
            - type: 'null'
        diagnostics:
          type: array
          items:
            $ref: './imports.yaml#/components/schemas/ImportDiagnostic'
        image_refs:
          type: array
          items:
            type: string
          description: Task/runtime container image references discovered in the sealed package.
        package_provenance:
          $ref: '#/components/schemas/CloudPackageProvenance'
        secret_requirements:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - target
              - required_for_variants
            properties:
              id:
                type: string
              target:
                type: string
              required_for_variants:
                type: array
                items:
                  type: string
        status:
          type: string
          enum:
            - accepted
            - rejected
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CloudRun:
      type: object
      additionalProperties: false
      required:
        - run_id
        - package_digest
        - experiment_name
        - variant
        - region
        - status
        - created_at
        - updated_at
      properties:
        run_id:
          type: string
          format: uuid
        package_digest:
          $ref: './common.yaml#/components/schemas/Digest'
        experiment_name:
          type:
            - string
            - 'null'
          description: >
            Stable human-readable experiment grouping key sealed in the
            package's resolved experiment. Null when the package artifact is no
            longer visible to the caller.
        run_label:
          type:
            - string
            - 'null'
        variant:
          type:
            - string
            - 'null'
          description: Lightweight display variant extracted from runtime options when available.
        region:
          type:
            - string
            - 'null'
          description: Lightweight display region or executor extracted from runtime options/requirements when available.
        status:
          type: string
          enum:
            - created
            - waiting_for_runner
            - running
            - completed
            - failed
            - cancelled
        pending_reason:
          type:
            - string
            - 'null'
          enum:
            - no_matching_runner
            - waiting_for_capacity
            - null
          description: >
            Queue diagnosis for created or waiting_for_runner runs. Null for
            non-queued runs. Omitted when include_runtime is false.
        trials_completed:
          type:
            - integer
            - 'null'
          minimum: 0
          description: >
            Count of completed trial schedule slots observed in runtime
            conclusion rows. Null when runtime progress is not yet known.
            Omitted when include_runtime is false.
        trials_total:
          type:
            - integer
            - 'null'
          minimum: 0
          description: >
            Total trial schedule slots observed from runtime
            schedule_progress_v2.total_slots. Null before the run emits its
            first schedule progress snapshot. Omitted when include_runtime is
            false.
        env_keys:
          type: array
          items:
            type: string
          description: >
            Plain non-secret environment keys supplied for this run. Present
            only when include_config is true; values are never exposed.
        secret_ids:
          type: array
          items:
            type: string
          description: >
            Attempt-scoped secret ids supplied for this run. Present only when
            include_config is true; provider refs are never exposed in public
            run responses.
        runtime_options:
          $ref: '#/components/schemas/CloudRuntimeOptions'
        run_requirements:
          $ref: '#/components/schemas/RunRequirements'
        package_provenance:
          $ref: '#/components/schemas/CloudPackageProvenance'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
        error_message:
          type:
            - string
            - 'null'
        attempts:
          type: array
          description: >
            Attempt history for the run, oldest first. Present on run detail
            responses; each failed attempt carries the worker's error message
            so failures are diagnosable without database access.
          items:
            $ref: '#/components/schemas/RunAttempt'
    CloudPackageProvenance:
      type: object
      additionalProperties: true
      required:
        - schema_version
        - status
        - source
        - message
      properties:
        schema_version:
          type: string
          enum:
            - cloud_package_provenance_v1
        status:
          type: string
          enum:
            - hosted_attested
            - external_unattested
            - unknown_legacy
        source:
          type: string
          enum:
            - hosted_core
            - sealed_package_manifest
            - sealed_package_import
            - pre_provenance_package_artifact
            - pre_provenance_package_owner
            - pre_provenance_run
        message:
          type: string
        input_kind:
          type: string
          enum:
            - authoring_context
            - sealed_package
        source_upload_id:
          type: string
        source_content_digest:
          $ref: './common.yaml#/components/schemas/Digest'
    RuntimeSummary:
      type: object
      additionalProperties: false
      required:
        - cloud_run_id
        - core_run_ids
        - runtime_snapshots
        - run_controls
        - schedule_progress
        - active_slots
        - recent_events
      properties:
        cloud_run_id:
          type: string
          format: uuid
        core_run_ids:
          type: array
          items:
            type: string
        runtime_snapshots:
          type: array
          description: >
            Worker-persisted Core runtime JSON mirrors, appended through the
            Cloud API before attempt cleanup.
          items:
            $ref: '#/components/schemas/RuntimeSnapshot'
        run_controls:
          type: array
          items:
            $ref: './common.yaml#/components/schemas/AnyJsonObject'
        schedule_progress:
          type: array
          items:
            $ref: './common.yaml#/components/schemas/AnyJsonObject'
        active_slots:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeSlot'
        recent_events:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeEvent'
    RuntimeSnapshot:
      type: object
      additionalProperties: false
      required:
        - core_run_id
        - run_dir_name
        - runtime_values
        - trial_summaries
        - evidence_records
        - omitted
      properties:
        core_run_id:
          type: string
        run_dir_name:
          type: string
          description: Relative Core run directory name, never an absolute worker path.
        runtime_values:
          type: object
          additionalProperties:
            $ref: './common.yaml#/components/schemas/AnyJsonObject'
        trial_summaries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - trial_id
              - summary
            properties:
              trial_id:
                type: string
              summary:
                $ref: './common.yaml#/components/schemas/AnyJsonObject'
              contract_trace:
                $ref: './common.yaml#/components/schemas/AnyJsonObject'
              trial_events:
                type: array
                items:
                  $ref: './common.yaml#/components/schemas/AnyJsonObject'
        evidence_records:
          type: array
          items:
            $ref: './common.yaml#/components/schemas/AnyJsonObject'
        omitted:
          type: array
          items:
            type: string
        seq:
          type: integer
        created_at:
          type: string
          format: date-time
    RuntimeSlot:
      type: object
      additionalProperties: false
      required:
        - core_run_id
        - schedule_idx
        - state
        - trial_id
        - attempt
        - worker_id
        - owner_id
        - lease_expires_at
        - slot_commit_id
        - slot_status
        - slot
      properties:
        core_run_id:
          type: string
        schedule_idx:
          type: integer
        state:
          type: string
        trial_id:
          type:
            - string
            - 'null'
        attempt:
          type: integer
        worker_id:
          type:
            - string
            - 'null'
        owner_id:
          type:
            - string
            - 'null'
        lease_expires_at:
          type:
            - string
            - 'null'
        slot_commit_id:
          type:
            - string
            - 'null'
        slot_status:
          type:
            - string
            - 'null'
        slot:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
    RuntimeEvent:
      type: object
      additionalProperties: false
      required:
        - core_run_id
        - trial_id
        - schedule_idx
        - attempt
        - row_seq
        - slot_commit_id
        - variant_id
        - task_id
        - repl_idx
        - seq
        - event_type
        - ts
        - payload
        - row
      properties:
        source:
          type: string
          enum:
            - trial
            - worker
          description: >
            trial rows come from trial trajectories; worker rows are harness
            lifecycle markers (materializing, core starting, ...).
        event_id:
          type: string
          description: Stable unique id for the event within the run stream.
        recorded_at:
          type:
            - string
            - 'null'
          description: Event timestamp when the producer reported one.
        core_run_id:
          type: string
        trial_id:
          type: string
        schedule_idx:
          type: integer
        attempt:
          type: integer
        row_seq:
          type: integer
        slot_commit_id:
          type: string
        variant_id:
          type: string
        task_id:
          type: string
        repl_idx:
          type: integer
        seq:
          type: integer
        event_type:
          type: string
        ts:
          type:
            - string
            - 'null'
        payload:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        row:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
    RuntimeResults:
      type: object
      additionalProperties: false
      required:
        - cloud_run_id
        - core_run_ids
        - trial_results
        - metric_observations
        - contract_stages
        - attempt_objects
      properties:
        cloud_run_id:
          type: string
          format: uuid
        core_run_ids:
          type: array
          items:
            type: string
        trial_results:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeTrialResult'
        metric_observations:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeMetricObservation'
        contract_stages:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeContractStage'
        attempt_objects:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeAttemptObject'
    RuntimeTrialResult:
      type: object
      additionalProperties: false
      required:
        - core_run_id
        - trial_id
        - schedule_idx
        - attempt
        - row_seq
        - variant_id
        - task_id
        - repl_idx
        - outcome
        - primary_metric_name
        - primary_metric_value
        - metrics
        - bindings
        - events_total
        - has_events
        - row
      properties:
        core_run_id:
          type: string
        trial_id:
          type: string
        schedule_idx:
          type: integer
        attempt:
          type: integer
        row_seq:
          type: integer
        variant_id:
          type: string
        task_id:
          type: string
        repl_idx:
          type: integer
        outcome:
          type: string
        primary_metric_name:
          type: string
        primary_metric_value:
          $ref: './common.yaml#/components/schemas/AnyJson'
        metrics:
          $ref: './common.yaml#/components/schemas/AnyJson'
        bindings:
          $ref: './common.yaml#/components/schemas/AnyJson'
        events_total:
          type: integer
        has_events:
          type: boolean
        row:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
    RuntimeMetricObservation:
      type: object
      additionalProperties: false
      required:
        - core_run_id
        - trial_id
        - schedule_idx
        - attempt
        - row_seq
        - variant_id
        - task_id
        - repl_idx
        - outcome
        - metric_name
        - metric_value
        - metric_source
        - row
      properties:
        core_run_id:
          type: string
        trial_id:
          type: string
        schedule_idx:
          type: integer
        attempt:
          type: integer
        row_seq:
          type: integer
        variant_id:
          type: string
        task_id:
          type: string
        repl_idx:
          type: integer
        outcome:
          type: string
        metric_name:
          type: string
        metric_value:
          $ref: './common.yaml#/components/schemas/AnyJson'
        metric_source:
          type:
            - string
            - 'null'
        row:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
    RuntimeContractStage:
      type: object
      additionalProperties: false
      required:
        - core_run_id
        - trial_id
        - schedule_idx
        - attempt
        - row_seq
        - variant_id
        - task_id
        - repl_idx
        - stage
        - status
        - recorded_at
        - detail
        - row
      properties:
        core_run_id:
          type: string
        trial_id:
          type: string
        schedule_idx:
          type: integer
        attempt:
          type: integer
        row_seq:
          type: integer
        variant_id:
          type: string
        task_id:
          type: string
        repl_idx:
          type: integer
        stage:
          type: string
        status:
          type: string
        recorded_at:
          type: string
        detail:
          $ref: './common.yaml#/components/schemas/AnyJson'
        row:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
    RuntimeAttemptObject:
      type: object
      additionalProperties: false
      required:
        - core_run_id
        - trial_id
        - schedule_idx
        - attempt
        - role
        - object_ref
        - metadata
        - recorded_at_ms
      properties:
        core_run_id:
          type: string
        trial_id:
          type: string
        schedule_idx:
          type: integer
        attempt:
          type: integer
        role:
          type: string
        object_ref:
          type: string
        metadata:
          $ref: './common.yaml#/components/schemas/AnyJson'
        recorded_at_ms:
          type: integer
    RunAttempt:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - run_id
        - worker_id
        - runner_instance_id
        - status
        - lease_expires_at
        - heartbeat_at
        - started_at
        - created_at
        - updated_at
      properties:
        attempt_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        worker_id:
          type: string
        runner_instance_id:
          type:
            - string
            - 'null'
          format: uuid
        status:
          type: string
          enum:
            - running
            - completed
            - failed
            - expired
        lease_expires_at:
          type: string
          format: date-time
        heartbeat_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        ended_at:
          type:
            - string
            - 'null'
          format: date-time
        error_message:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attempt_token:
          type: string
          description: Present only in worker claim responses.
    WorkerCapabilities:
      type: object
      additionalProperties: false
      required:
        - executors
        - resources
      properties:
        executors:
          type: array
          items:
            type: string
            enum:
              - runner-docker
              - modal
        resources:
          type: array
          items:
            type: string
          description: >
            VM runner resources available to satisfy run requirements, for
            example core_runner, docker_daemon, registry_pull, modal.
        arch:
          type: string
          enum:
            - x86_64
            - arm64
        cpu_count:
          type: integer
          minimum: 1
        memory_mb:
          type: integer
          minimum: 1
        disk_mb:
          type: integer
          minimum: 1
        isolation:
          type: array
          items:
            type: string
            enum:
              - reusable_vm
              - single_use_vm
    CloudRuntimeOptions:
      type: object
      additionalProperties: false
      properties:
        backend:
          type: string
          enum:
            - runner-docker
            - runner_docker
            - local-docker
            - local_docker
            - modal
        executor:
          type: string
          enum:
            - runner-docker
            - runner_docker
            - local-docker
            - local_docker
            - modal
        arch:
          type: string
          enum:
            - x86_64
            - amd64
            - arm64
            - aarch64
        cpu_count:
          $ref: '#/components/schemas/PositiveIntegerLike'
        cpu:
          $ref: '#/components/schemas/PositiveIntegerLike'
        memory_mb:
          $ref: '#/components/schemas/PositiveIntegerLike'
        disk_mb:
          $ref: '#/components/schemas/PositiveIntegerLike'
        isolation:
          type: string
          enum:
            - reusable_vm
            - single_use_vm
        timeout_ms:
          $ref: '#/components/schemas/PositiveIntegerLike'
        max_parallel_trials:
          $ref: '#/components/schemas/PositiveIntegerLike'
        network:
          type: object
          additionalProperties: false
          properties:
            default:
              type: string
              enum:
                - none
                - allowlist_enforced
            task_sandbox:
              type: string
              enum:
                - none
                - allowlist_enforced
            agent:
              type: string
              enum:
                - none
                - allowlist_enforced
            egress:
              type: array
              items:
                type: string
                minLength: 1
        sidecars:
          type: array
          items:
            type: string
            minLength: 1
        accelerators:
          type: array
          items:
            type: string
            minLength: 1
      description: >
        Hosted Cloud runtime overrides. Unknown keys are rejected by the API so
        typos cannot silently fall back to default runner resources.
    PositiveIntegerLike:
      anyOf:
        - type: integer
          minimum: 1
        - type: string
          pattern: '^[1-9][0-9]*$'
    RunRequirements:
      type: object
      additionalProperties: false
      required:
        - executor
        - requires
        - image_refs
        - secret_ids
        - network_perimeter
        - sidecars
        - accelerators
        - arch
        - cpu_count
        - memory_mb
        - disk_mb
        - isolation
        - timeout_ms
        - max_parallel_trials
      properties:
        executor:
          type: string
          enum:
            - runner-docker
            - modal
        requires:
          type: array
          items:
            type: string
        image_refs:
          type: array
          items:
            type: string
        secret_ids:
          type: array
          items:
            type: string
          description: Secret ids declared for this run. Values are ids only, never secret plaintext.
        network_perimeter:
          type: object
          additionalProperties: false
          required:
            - default
            - task_sandbox
            - agent
            - egress_hosts
          properties:
            default:
              type: string
              enum:
                - none
            task_sandbox:
              type: string
              enum:
                - none
            agent:
              type: string
              enum:
                - none
            egress_hosts:
              type: array
              items:
                type: string
          description: >
            Declared Cloud runtime network perimeter. Cloud runs reject ambient
            network modes; external egress must be listed by hostname.
        sidecars:
          type: array
          items:
            type: string
          description: >
            Declared sidecar ids or services required by the run. Each sidecar
            also becomes a required runner resource named sidecar:<id>.
        accelerators:
          type: array
          items:
            type: string
          description: >
            Declared accelerator requirements such as gpu classes. Each
            accelerator also becomes a required runner resource named
            accelerator:<id>.
        arch:
          type: string
          enum:
            - x86_64
            - arm64
        cpu_count:
          type: integer
          minimum: 1
        memory_mb:
          type: integer
          minimum: 1
        disk_mb:
          type: integer
          minimum: 1
        isolation:
          type: string
          enum:
            - reusable_vm
            - single_use_vm
        timeout_ms:
          type:
            - integer
            - 'null'
          minimum: 1
        max_parallel_trials:
          type: integer
          minimum: 1
    CreateRunnerPoolRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - capabilities
      properties:
        name:
          type: string
          minLength: 1
        capabilities:
          $ref: '#/components/schemas/WorkerCapabilities'
        metadata:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
    RegisterRunnerInstanceRequest:
      type: object
      additionalProperties: false
      required:
        - runner_pool_id
        - instance_name
        - capabilities
      properties:
        runner_pool_id:
          type: string
          format: uuid
        instance_name:
          type: string
          minLength: 1
        capabilities:
          $ref: '#/components/schemas/WorkerCapabilities'
        metadata:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
    RunnerInstanceUnhealthyRequest:
      type: object
