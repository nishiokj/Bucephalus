    RuntimeResource:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - metadata
        - spec
        - status
        - audit
      properties:
        apiVersion:
          type: string
          enum:
            - bucephalus.dev/v1alpha1
        kind:
          type: string
          description: >
            Resource kind such as Run, CoreRun, Package, RunnerShape,
            CapabilityRequirement, ImagePull, SecretBinding, NetworkPerimeter,
            RunnerPool, RunnerInstance, RunnerAttempt, RunnerProvisionRequest,
            Trial, ScheduleSlot, RunManifest, MetricDefinition, SlotCommit,
            PendingTrialCompletion, VariantSnapshot, EvidenceRecord,
            ChainState, TrialConclusion, LineageVersion, LineageHead,
            TrialContainer, TrialStage, RuntimeValue, MetricObservation,
            PerformanceSample, RuntimeOperation, TrialArtifact,
            RuntimeSnapshot, Event, PortForward, or Exec.
        metadata:
          type: object
          additionalProperties: false
          required:
            - name
            - uid
            - generation
            - resourceVersion
            - labels
            - annotations
            - ownerReferences
          properties:
            name:
              type: string
            uid:
              type: string
              minLength: 1
              description: >
                Stable `RuntimeResource.metadata.uid` for this visible runtime
                resource. Generated resources receive a deterministic UID so
                tree views, owner references, selectors, events, and mutation
                preconditions can rely on a Kubernetes-style identity.
            generation:
              type: integer
              minimum: 1
              description: >
                Kubernetes-style desired-state generation for the rendered
                resource. For generated runtime resources this is a deterministic
                integer derived from the resource identity, labels, owner
                references, and spec.
            resourceVersion:
              type: string
              minLength: 1
              description: >
                Opaque Kubernetes-style change token for the rendered runtime
                resource. Changes whenever the visible resource spec, status,
                metadata, or audit payload changes.
            creationTimestamp:
              type: string
              format: date-time
              description: >
                Kubernetes-style creation timestamp for the rendered resource.
                Preserved alongside the compatibility `created_at` field when
                the source runtime row has creation time evidence.
            deletionTimestamp:
              type: string
              format: date-time
              description: >
                Kubernetes-style deletion timestamp. Runtime access resources
                retain this marker after an audited delete/cancel so operators
                can keep inspecting the lifecycle object while wait/delete
                clients observe deletion acknowledgement.
            labels:
              type: object
              additionalProperties:
                type: string
            annotations:
              type: object
              description: >
                Kubernetes-style annotations for operational/audit metadata
                that should travel with the resource manifest without becoming
                label-selector state. Examples include audit source, visible
                phase, access target, access target UID/resourceVersion,
                requester, and request reason.
              additionalProperties:
                type: string
            ownerReferences:
              type: array
              description: >
                Kubernetes-style references to parent or related runtime
                resources, such as the owning Run, RunnerPool, RunnerInstance,
                RunnerAttempt, ScheduleSlot, or runtime access target.
              items:
                type: object
                additionalProperties: false
                required:
                  - apiVersion
                  - kind
                  - name
                properties:
                  apiVersion:
                    type: string
                    enum:
                      - bucephalus.dev/v1alpha1
                  kind:
                    type: string
                  name:
                    type: string
                  uid:
                    type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        spec:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        status:
          allOf:
            - $ref: './common.yaml#/components/schemas/AnyJsonObject'
          description: >
            Resource status. Every runtime resource includes `phase` when known,
            a top-level Kubernetes-style `reason` and `message` summary derived
            from the most operationally relevant condition, an
            `observedGeneration` freshness marker showing which
            `metadata.generation` the status reflects, and a Kubernetes-style
            `conditions[]` array with entries shaped as
            `{type,status,reason,message,lastTransitionTime}`. Resources with
            currently available lifecycle verbs also include `actions[]`, for
            example `cordon`, `drain`, `uncordon`, `cancel`, or `complete`.
            Runtime access target resources also include `status.access`, a
            normalized object with machine-readable reachability and data-plane
            capability fields:
            `reachable`, `reason`, `port_forward`, `exec`,
            `runner_instance_id`, `runner_instance_status`, `attempt_id`, and
            `worker_id`. PortForward and Exec access resources include
            `spec.target_ref` with the persisted target kind/name/uid/resourceVersion
            when known, plus `status.runner_binding` for the runner instance,
            attempt, and worker assigned to the request. Event resources include
            `status.involved`, `status.involved_kind`, `status.involved_name`,
            `status.involved_uid`, and `status.involved_count` so clients can
            list and field-select audit/lifecycle Events by the primary
            involved `Kind/name` object without parsing raw payload JSON.
        audit:
          allOf:
            - $ref: './common.yaml#/components/schemas/AnyJsonObject'
          description: >
            Resource audit payload. PortForward and Exec resources retain the
            persisted target reference, target resourceVersion, requester, and
            runner binding so a later resource read can prove which reviewed
            object and worker-backed runner lifecycle were used without requiring
            a separate event query.
    CreateRuntimeResourcePortForwardRequest:
      type: object
      additionalProperties: false
      required:
        - target_port
        - resource_version
      properties:
        target_port:
          type: integer
          minimum: 1
          maximum: 65535
        local_port:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 65535
          description: Requested local client port for audit and UX; the runner data plane still owns actual tunnel activation.
        protocol:
          type: string
          enum:
            - tcp
          default: tcp
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: >
            Optional audited control-plane lifetime for the live PortForward
            request. The API stores `expires_at` and worker maintenance marks
            non-terminal requests expired after this TTL; client wait timeouts
            are separate.
        reason:
          type:
            - string
            - 'null'
        resource_version:
          type: string
          minLength: 1
          description: Required reviewed precondition from runtime operation review; missing fails with Precondition Required and stale values fail with Conflict.
    UpdateRuntimePortForwardRequest:
      type: object
      additionalProperties: false
      description: >
        Worker-side lifecycle update for a PortForward resource. Active updates
        must include a non-empty connection handle so the audited resource is
        not published as a dead active resource. Completed updates close a
        previously active PortForward without implying cancellation. CLI wait
        treats an active PortForward as locally usable only when the connection also reports a
        client-reachable data plane, for example
        `connection.client_reachable=true`, `connection.client_endpoint`,
        or `connection.client_listen`. Provider tunnel descriptors such as
        `connection.provider_tunnel_url` prove an auditable active resource, not
        a client-reachable local endpoint.
      required:
        - runner_instance_id
      properties:
        runner_instance_id:
          type: string
          format: uuid
        connection:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
          description: >
            Provider-specific connection details. For `active` updates this
            object must include an auditable provider handle. Set
            `client_reachable=true` or a client endpoint/listener field only
            when a user-side client can actually connect to the tunnel; a
            runner-local `local_port` by itself is lifecycle evidence, not a
            successful local port-forward. Provider descriptors such as
            `provider_tunnel_url` and `tunnel` are retained for audit/debugging
            without implying that the user has a reachable local socket.
        error_message:
          type:
            - string
            - 'null'
    CreateRuntimeResourceExecRequest:
      type: object
      additionalProperties: false
      required:
        - command
        - resource_version
      properties:
        command:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: >
            Optional audited control-plane lifetime for the live Exec request.
            The API stores `expires_at` and worker maintenance marks
            non-terminal requests expired after this TTL; client wait timeouts
            are separate.
        reason:
          type:
            - string
            - 'null'
        resource_version:
          type: string
          minLength: 1
          description: Required reviewed precondition from runtime operation review; missing fails with Precondition Required and stale values fail with Conflict.
    UpdateRuntimeExecRequest:
      type: object
      additionalProperties: false
      description: >
        Worker-side lifecycle update for an Exec resource. Completed updates
        must include `connection.exit_code`; otherwise the control plane rejects
        the update instead of publishing a fake successful command result.
      required:
        - runner_instance_id
      properties:
        runner_instance_id:
          type: string
          format: uuid
        connection:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
          description: >
            Provider-specific execution details. For `complete`/`completed`
            updates this object must include numeric `exit_code`; stdout/stderr
            tail fields are optional but recommended for CLI and GUI inspection.
        error_message:
          type:
            - string
            - 'null'
    RuntimeEvent:
      type: object
      additionalProperties: false
      required:
        - source
        - core_run_id
        - trial_id
        - schedule_idx
        - attempt
        - row_seq
        - slot_commit_id
        - variant_id
        - task_id
        - repl_idx
        - seq
        - event_type
        - ts
        - resource_refs
        - payload
        - row
      properties:
        source:
          type: string
          description: Event source, such as cloud.run_events, runtime.event_rows, or worker_runtime_snapshot.
        core_run_id:
          type: string
        trial_id:
          type: string
        schedule_idx:
          type: integer
        attempt:
          type: integer
        row_seq:
          type: integer
        slot_commit_id:
          type: string
        variant_id:
          type: string
        task_id:
          type: string
        repl_idx:
          type: integer
        seq:
          type: integer
        event_type:
          type: string
        ts:
          type:
            - string
            - 'null'
        resource_refs:
          type: array
          description: >
            Kubernetes-style involved-object references for resources affected
            by this event, ordered with the primary involved runtime object
            first. Clients should use this field for audit targets and resource
            correlation instead of parsing event-specific payload fields.
          items:
            $ref: '#/components/schemas/RuntimeResourceWatchRef'
        payload:
          description: >
            Event-specific payload retained for detailed audit evidence.
            Involved runtime objects are normalized in `resource_refs`. Runtime
            access audit events also retain structured refs such as
            `access_resource_ref`, `target_ref`, `resolved_target`,
            `runner_binding`, and `resource_version_precondition` so operators
            can see which target object, runner instance, attempt, worker, and
            reviewed resourceVersion produced the lifecycle transition.
            `runtime.inspect.bundle.read` payloads retain the requester,
            `Run/<run_id>` resource ref, applied resource filters, event limit,
            inventory and event resourceVersion cursors, returned counts,
            health and metrics summaries, and log-reference count for
            support-bundle audit review. Failed inspect-bundle read payloads
            use `runtime.inspect.bundle.read.failed` and retain the same
            `Run/<run_id>` resource ref plus requester, filters, event limit,
            error code, HTTP status, and error message when the runtime audit
            store is reachable.
            `runtime.api_resources.read` payloads retain the requester,
            `Run/<run_id>` resource ref, catalog resource counts, selected kind,
            verbs, categories, subresources, actions, access verbs, and
            represented Core run ids. Failed catalog discovery reads use
            `runtime.api_resources.read.failed` with the selected kind, error
            code, HTTP status, and error message.
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        row:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
    RunAttempt:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - run_id
        - worker_id
        - runner_instance_id
        - status
        - lease_expires_at
        - heartbeat_at
        - started_at
        - created_at
        - updated_at
      properties:
        attempt_id:
          type: string
          format: uuid
        run_id:
          $ref: '#/components/schemas/CloudRunId'
        worker_id:
          type: string
        runner_instance_id:
          type:
            - string
            - 'null'
          format: uuid
        status:
          type: string
          enum:
            - running
            - completed
            - failed
            - expired
        lease_expires_at:
          type: string
          format: date-time
        heartbeat_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        ended_at:
          type:
            - string
            - 'null'
          format: date-time
        error_message:
          type:
            - string
            - 'null'
    WorkerCapabilities:
      type: object
      additionalProperties: false
      required:
        - executors
        - resources
      properties:
        executors:
          type: array
          items:
            type: string
            enum:
              - runner-docker
              - modal
        resources:
          type: array
          items:
            type: string
          description: >
            VM runner resources available to satisfy run requirements, for
            example core_runner, docker_daemon, registry_pull, modal.
        arch:
          type: string
          enum:
            - x86_64
            - arm64
        cpu_count:
          type: integer
          minimum: 1
        memory_mb:
          type: integer
          minimum: 1
        disk_mb:
          type: integer
          minimum: 1
        isolation:
          type: array
          items:
            type: string
            enum:
              - reusable_vm
              - single_use_vm
    CloudRuntimeOptions:
      type: object
      additionalProperties: false
      description: >
        Explicit hosted Cloud runtime knobs. Placement is intentionally
        scheduler-owned, so this schema does not include region, runtime_region,
        placement, or zone. Legacy aliases such as executor and cpu are also
        omitted and rejected by the API. Unknown keys are rejected so typos
        cannot silently fall back to default runner resources.
      properties:
        backend:
          type: string
          enum:
            - runner-docker
            - runner_docker
            - local-docker
            - local_docker
            - modal
        arch:
          type: string
          enum:
            - x86_64
            - amd64
            - arm64
            - aarch64
        cpu_count:
          $ref: '#/components/schemas/PositiveIntegerLike'
        memory_mb:
          $ref: '#/components/schemas/PositiveIntegerLike'
        disk_mb:
          $ref: '#/components/schemas/PositiveIntegerLike'
        isolation:
          type: string
          enum:
            - reusable_vm
            - single_use_vm
        timeout_ms:
          $ref: '#/components/schemas/PositiveIntegerLike'
        max_parallel_trials:
          $ref: '#/components/schemas/PositiveIntegerLike'
        network:
          type: object
          additionalProperties: false
          properties:
            default:
              type: string
              enum:
                - none
                - allowlist_enforced
            task_sandbox:
              type: string
              enum:
                - none
                - allowlist_enforced
            agent:
              type: string
              enum:
                - none
                - allowlist_enforced
            egress:
              type: array
              items:
                type: string
                minLength: 1
        sidecars:
          type: array
          items:
            type: string
            minLength: 1
        accelerators:
          type: array
          items:
            type: string
            minLength: 1
    PositiveIntegerLike:
      anyOf:
        - type: integer
          minimum: 1
        - type: string
          pattern: '^[1-9][0-9]*$'
    RunRequirements:
      type: object
      additionalProperties: false
      required:
        - executor
        - requires
        - image_refs
        - secret_ids
        - network_perimeter
        - sidecars
        - accelerators
        - arch
        - cpu_count
        - memory_mb
        - disk_mb
        - isolation
        - timeout_ms
        - max_parallel_trials
      properties:
        executor:
          type: string
          enum:
            - runner-docker
            - modal
        requires:
          type: array
          items:
            type: string
        image_refs:
          type: array
          items:
            type: string
        secret_ids:
          type: array
          items:
            type: string
          description: Secret ids declared for this run. Values are ids only, never secret plaintext.
        network_perimeter:
          type: object
          additionalProperties: false
          required:
            - default
            - task_sandbox
            - agent
            - egress_hosts
          properties:
            default:
              type: string
              enum:
                - none
            task_sandbox:
              type: string
              enum:
                - none
            agent:
              type: string
              enum:
                - none
            egress_hosts:
              type: array
              items:
                type: string
          description: >
            Declared Cloud runtime network perimeter. Cloud runs reject ambient
            network modes; external egress must be listed by hostname.
        sidecars:
          type: array
          items:
            type: string
          description: >
            Declared sidecar ids or services required by the run. Each sidecar
            also becomes a required runner resource named sidecar:<id>.
        accelerators:
          type: array
          items:
            type: string
          description: >
            Declared accelerator requirements such as gpu classes. Each
            accelerator also becomes a required runner resource named
            accelerator:<id>.
        arch:
          type: string
          enum:
            - x86_64
            - arm64
        cpu_count:
          type: integer
          minimum: 1
        memory_mb:
          type: integer
          minimum: 1
        disk_mb:
          type: integer
          minimum: 1
        isolation:
          type: string
          enum:
            - reusable_vm
            - single_use_vm
        timeout_ms:
          type:
            - integer
            - 'null'
          minimum: 1
        max_parallel_trials:
          type: integer
          minimum: 1
    CreateRunnerPoolRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - capabilities
      properties:
        name:
          type: string
          minLength: 1
        capabilities:
          $ref: '#/components/schemas/WorkerCapabilities'
        metadata:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
    RegisterRunnerInstanceRequest:
      type: object
      additionalProperties: false
      required:
        - runner_pool_id
        - instance_name
        - capabilities
      properties:
        runner_pool_id:
          type: string
          format: uuid
        instance_name:
          type: string
          minLength: 1
        capabilities:
          $ref: '#/components/schemas/WorkerCapabilities'
        metadata:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
    RunnerInstanceUnhealthyRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
        details:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
    RunnerInstanceOfflineRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
    RunnerPool:
      type: object
      additionalProperties: false
      required:
        - runner_pool_id
        - name
        - status
        - capabilities
        - metadata
        - created_at
        - updated_at
      properties:
        runner_pool_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - draining
            - disabled
        capabilities:
          $ref: '#/components/schemas/WorkerCapabilities'
        metadata:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RunnerInstance:
      type: object
      additionalProperties: false
      required:
        - runner_instance_id
        - runner_pool_id
        - instance_name
        - status
        - capabilities
        - metadata
        - last_heartbeat_at
        - created_at
        - updated_at
      properties:
        runner_instance_id:
          type: string
          format: uuid
        runner_pool_id:
          type: string
          format: uuid
        instance_name:
          type: string
        status:
          type: string
          enum:
            - online
            - draining
            - offline
            - unhealthy
        capabilities:
          $ref: '#/components/schemas/WorkerCapabilities'
        metadata:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        last_heartbeat_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RunnerProvisionRequest:
      type: object
      additionalProperties: false
      required:
        - provision_request_id
        - runner_pool_id
        - status
        - provider
        - requirements
        - metadata
        - created_at
        - updated_at
      properties:
        provision_request_id:
          type: string
          format: uuid
        runner_pool_id:
          type: string
          format: uuid
        run_id:
          oneOf:
            - $ref: '#/components/schemas/CloudRunId'
            - type: 'null'
        status:
          type: string
          enum:
            - requested
            - provisioning
            - active
            - failed
            - reaped
        provider:
          type: string
        provider_instance_id:
          type:
            - string
            - 'null'
        instance_name:
          type:
            - string
            - 'null'
        runner_instance_id:
          type:
            - string
            - 'null'
          format: uuid
        requirements:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        metadata:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        error_message:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RunEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - run_id
        - seq
        - event_type
        - payload
        - created_at
      properties:
        event_id:
          type: string
          format: uuid
        run_id:
          $ref: '#/components/schemas/CloudRunId'
        attempt_id:
          type:
            - string
            - 'null'
          format: uuid
        seq:
          type: integer
          minimum: 1
        event_type:
          type: string
          minLength: 1
        payload:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        created_at:
          type: string
          format: date-time
