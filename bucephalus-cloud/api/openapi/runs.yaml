  /v1/runner-instances/{runner_instance_id}/drain:
    post:
      operationId: drainRunnerInstance
      summary: Mark a runner instance draining.
      security:
        - runnerAdminBearerAuth: []
        - runnerAdminTokenHeader: []
      description: Requires the runner admin token, either as a bearer token or X-Bucephalus-Runner-Admin-Token.
      parameters:
        - $ref: '#/components/parameters/RunnerInstanceId'
      responses:
        '200':
          description: Updated runner instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerInstance'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-instances/{runner_instance_id}/unhealthy:
    post:
      operationId: markRunnerInstanceUnhealthy
      summary: Mark a runner instance unhealthy after a host or cleanup failure.
      security:
        - workerBearerAuth: []
        - workerTokenHeader: []
      description: Requires the Cloud worker service token, either as a bearer token or X-Bucephalus-Worker-Token.
      parameters:
        - $ref: '#/components/parameters/RunnerInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerInstanceUnhealthyRequest'
      responses:
        '200':
          description: Updated runner instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerInstance'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /v1/runner-instances/{runner_instance_id}/offline:
    post:
      operationId: markRunnerInstanceOffline
      summary: Mark a runner instance offline after daemon shutdown.
      security:
        - workerBearerAuth: []
        - workerTokenHeader: []
      description: Requires the Cloud worker service token, either as a bearer token or X-Bucephalus-Worker-Token.
      parameters:
        - $ref: '#/components/parameters/RunnerInstanceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerInstanceOfflineRequest'
      responses:
        '200':
          description: Updated runner instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerInstance'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
    workerAttemptBearerAuth:
      $ref: './common.yaml#/components/securitySchemes/workerAttemptBearerAuth'
    workerBearerAuth:
      $ref: './common.yaml#/components/securitySchemes/workerBearerAuth'
    workerTokenHeader:
      $ref: './common.yaml#/components/securitySchemes/workerTokenHeader'
    runnerAdminBearerAuth:
      $ref: './common.yaml#/components/securitySchemes/runnerAdminBearerAuth'
    runnerAdminTokenHeader:
      $ref: './common.yaml#/components/securitySchemes/runnerAdminTokenHeader'
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      description: Opaque Cloud run identifier assigned by the control plane. This is not a UUID.
      schema:
        $ref: '#/components/schemas/CloudRunId'
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunnerPoolId:
      name: runner_pool_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunnerInstanceId:
      name: runner_instance_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CloudRunId:
      type: string
      description: Opaque Cloud run identifier assigned by the control plane. Clients must treat it as a string, not as a UUID.
      minLength: 1
      examples:
        - run_00sonnet46
        - run-1
    WorkerLeaseRequest:
      type: object
      additionalProperties: false
      required:
        - runner_instance_id
      properties:
        runner_instance_id:
          type: string
          format: uuid
          minLength: 1
        lease_seconds:
          type: integer
          minimum: 5
          maximum: 3600
          default: 30
    RuntimeResourceMutationRequest:
      type: object
      additionalProperties: false
      properties:
        resource_version:
          type:
            - string
            - 'null'
          description: Resource version precondition from a prior describe/can-i response.
        reason:
          type:
            - string
            - 'null'
          description: Human-readable reason recorded in runtime audit events.
    WorkerRuntimeAccessUpdate:
      type: object
      additionalProperties: false
      required:
        - runner_instance_id
      properties:
        runner_instance_id:
          type: string
          minLength: 1
        connection:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        error_message:
          type:
            - string
            - 'null'
    RunClaim:
      type: object
      additionalProperties: false
      required:
        - claimed
        - run
        - attempt
      properties:
        claimed:
          const: true
        run:
          $ref: '#/components/schemas/CloudRun'
        attempt:
          $ref: '#/components/schemas/RunAttempt'
    PackageArtifact:
      type: object
      additionalProperties: false
      required:
        - package_digest
        - status
        - created_at
        - updated_at
      properties:
        package_digest:
          $ref: './common.yaml#/components/schemas/Digest'
        name:
          type:
            - string
            - 'null'
          description: >
            Human-readable package identity, taken from the resolved
            experiment's name sealed inside the package.
        description:
          type:
            - string
            - 'null'
          description: Short package summary when available.
        tags:
          type: array
          items:
            type: string
          description: Package tags from manifest or resolved experiment metadata.
        owner:
          type:
            - string
            - 'null'
          description: Owning principal or manifest-declared owner when available.
        upload_id:
          type:
            - string
            - 'null'
          format: uuid
        byte_size:
          type:
            - integer
            - 'null'
          minimum: 0
        media_type:
          type:
            - string
            - 'null'
        manifest_json:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        resolved_experiment_json:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        target:
          oneOf:
            - $ref: './common.yaml#/components/schemas/BuildTarget'
            - type: 'null'
        diagnostics:
          type: array
          items:
            $ref: './imports.yaml#/components/schemas/ImportDiagnostic'
        image_refs:
          type: array
          items:
            type: string
          description: Task/runtime container image references discovered in the sealed package.
        package_provenance:
          $ref: '#/components/schemas/CloudPackageProvenance'
        secret_requirements:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - target
              - required_for_variants
            properties:
              id:
                type: string
              target:
                type: string
              required_for_variants:
                type: array
                items:
                  type: string
        status:
          type: string
          enum:
            - accepted
            - rejected
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CloudRun:
      type: object
      additionalProperties: false
      required:
        - run_id
        - package_digest
        - experiment_name
        - variant
        - runtime
        - status
        - created_at
        - updated_at
      properties:
        run_id:
          $ref: '#/components/schemas/CloudRunId'
        package_digest:
          $ref: './common.yaml#/components/schemas/Digest'
        experiment_name:
          type:
            - string
            - 'null'
          description: >
            Stable human-readable experiment grouping key sealed in the
            package's resolved experiment. Null when the package artifact is no
            longer visible to the caller.
        run_label:
          type:
            - string
            - 'null'
        variant:
          type:
            - string
            - 'null'
          description: Lightweight display variant extracted from runtime options when available.
        runtime:
          type:
            - string
            - 'null'
          description: Lightweight display runtime executor extracted from run requirements when available.
        status:
          type: string
          enum:
            - created
            - waiting_for_runner
            - running
            - completed
            - failed
            - cancelled
        pending_reason:
          type:
            - string
            - 'null'
          enum:
            - no_matching_runner
            - waiting_for_capacity
            - null
          description: >
            Queue diagnosis for created or waiting_for_runner runs. Null for
            non-queued runs. Omitted when include_runtime is false.
        trials_completed:
          type:
            - integer
            - 'null'
          minimum: 0
          description: >
            Count of completed trial schedule slots observed in runtime
            conclusion rows. Null when runtime progress is not yet known.
            Omitted when include_runtime is false.
        trials_total:
          type:
            - integer
            - 'null'
          minimum: 0
          description: >
            Total trial schedule slots observed from runtime
            schedule_progress_v2.total_slots. Null before the run emits its
            first schedule progress snapshot. Omitted when include_runtime is
            false.
        env_keys:
          type: array
          items:
            type: string
          description: >
            Plain non-secret environment keys supplied for this run. Present
            only when include_config is true; values are never exposed.
        secret_ids:
          type: array
          items:
            type: string
          description: >
            Attempt-scoped secret ids supplied for this run. Present only when
            include_config is true; provider refs are never exposed in public
            run responses.
        runtime_options:
          $ref: '#/components/schemas/CloudRuntimeOptions'
        run_requirements:
          $ref: '#/components/schemas/RunRequirements'
        package_provenance:
          $ref: '#/components/schemas/CloudPackageProvenance'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
        error_message:
          type:
            - string
            - 'null'
        attempts:
          type: array
          description: >
            Attempt history for the run, oldest first. Present on run detail
            responses; each failed attempt carries the worker's error message
            so failures are diagnosable without database access.
          items:
            $ref: '#/components/schemas/RunAttempt'
    CloudPackageProvenance:
      type: object
      additionalProperties: true
      required:
        - schema_version
        - status
        - source
        - message
      properties:
        schema_version:
          type: string
          enum:
            - cloud_package_provenance_v1
        status:
          type: string
          enum:
            - hosted_attested
            - external_unattested
            - unknown_legacy
        source:
          type: string
          enum:
            - hosted_core
            - sealed_package_manifest
            - sealed_package_import
            - pre_provenance_package_artifact
            - pre_provenance_package_owner
            - pre_provenance_run
        message:
          type: string
        input_kind:
          type: string
          enum:
            - authoring_context
            - sealed_package
        source_upload_id:
          type: string
        source_content_digest:
          $ref: './common.yaml#/components/schemas/Digest'
    RuntimeResourceList:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - metadata
        - cloud_run_id
        - core_run_ids
        - resources
      properties:
        apiVersion:
          type: string
          enum:
            - bucephalus.dev/v1alpha1
        kind:
          type: string
          enum:
            - RuntimeResourceList
        metadata:
          $ref: '#/components/schemas/RuntimeResourceListMeta'
        cloud_run_id:
          $ref: '#/components/schemas/CloudRunId'
        core_run_ids:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeResource'
    RuntimeResourceListMeta:
      type: object
      additionalProperties: false
      required:
        - resourceVersion
        - continue
        - remainingItemCount
        - total
        - returned
      properties:
        resourceVersion:
          type: string
          description: Deterministic collection resource version for the full filtered runtime resource list.
        continue:
          type:
            - string
            - 'null'
          description: Opaque pagination continuation token when more filtered resources remain.
        remainingItemCount:
          type: integer
          minimum: 0
          description: Number of additional filtered resources after the current page.
        total:
          type: integer
          minimum: 0
          description: Total number of resources in the filtered collection before pagination.
        returned:
          type: integer
          minimum: 0
          description: Number of resources returned in this page.
    RuntimeResourceWatchList:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - cloud_run_id
        - generated_at
        - core_run_ids
        - resource_versions
        - events
        - resource_inventory
      properties:
        apiVersion:
          type: string
          enum:
            - bucephalus.dev/v1alpha1
        kind:
          type: string
          enum:
            - RuntimeResourceWatchList
        cloud_run_id:
          $ref: '#/components/schemas/CloudRunId'
        generated_at:
          type: string
          format: date-time
        core_run_ids:
          type: array
          items:
            type: string
        resource_versions:
          type: object
          additionalProperties:
            type: string
          description: Current watch cursor map keyed by lowercase `kind/name`.
        events:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeResourceWatchEvent'
        resource_inventory:
          $ref: '#/components/schemas/RuntimeResourceList'
    RuntimeResourceWatchEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - resource_ref
      properties:
        type:
          type: string
          enum:
            - ADDED
            - MODIFIED
            - DELETED
            - BOOKMARK
        resource_ref:
          $ref: '#/components/schemas/RuntimeResourceWatchRef'
        resource_version:
          type: string
        previous_resource_version:
          type: string
        resource:
          $ref: '#/components/schemas/RuntimeResource'
    RuntimeResourceWatchRef:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - name
      properties:
        apiVersion:
          type: string
          enum:
            - bucephalus.dev/v1alpha1
        kind:
          type: string
        name:
          type: string
        uid:
          type: string
    RuntimeResourceHealth:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - cloud_run_id
        - generated_at
        - core_run_ids
        - summary
        - resources
      properties:
        apiVersion:
          type: string
          enum:
            - bucephalus.dev/v1alpha1
        kind:
          type: string
          enum:
            - RuntimeResourceHealth
        cloud_run_id:
          $ref: '#/components/schemas/CloudRunId'
        generated_at:
          type: string
          format: date-time
        core_run_ids:
          type: array
          items:
            type: string
        summary:
          $ref: '#/components/schemas/RuntimeResourceHealthSummary'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeResourceHealthRow'
    RuntimeResourceHealthSummary:
      type: object
      additionalProperties: false
      required:
        - total
        - ready
        - degraded
        - problem
        - unknown
        - access_targets
        - reachable_access_targets
        - port_forward_ready
        - exec_ready
        - actions_available
        - observed_resources
        - observed_current
        - observed_stale
        - observed_unknown
      properties:
        total:
          type: integer
          minimum: 0
        ready:
          type: integer
          minimum: 0
        degraded:
          type: integer
          minimum: 0
        problem:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
        access_targets:
          type: integer
          minimum: 0
          description: Resources with a `status.access` object.
        reachable_access_targets:
          type: integer
          minimum: 0
          description: Resources whose `status.access.reachable` is true.
        port_forward_ready:
          type: integer
          minimum: 0
          description: Resources whose `status.access.port_forward` is true.
        exec_ready:
          type: integer
          minimum: 0
          description: Resources whose `status.access.exec` is true.
        actions_available:
          type: integer
          minimum: 0
          description: Resources with advertised `status.actions[]`.
        observed_resources:
          type: integer
          minimum: 0
          description: Resources with comparable `metadata.generation` and `status.observedGeneration`.
        observed_current:
          type: integer
          minimum: 0
          description: Resources whose `status.observedGeneration` has caught up to `metadata.generation`.
        observed_stale:
          type: integer
          minimum: 0
          description: Resources whose `status.observedGeneration` is behind `metadata.generation`.
        observed_unknown:
          type: integer
          minimum: 0
          description: Resources without enough generation data to determine observed status freshness.
    RuntimeResourceAccessStatus:
      type: object
      additionalProperties: true
      description: >
        Normalized low-level access status derived from a runtime resource's
        target binding and runner capabilities. Access target resources expose
        this object under `status.access`; runtime health rows return the same
        shape as `access` so CLI and GUI clients can filter, summarize, and
        explain low-level access readiness without parsing arbitrary status
        payloads.
      properties:
        reachable:
          type: boolean
          description: Whether the resource is currently reachable for low-level runtime access.
        reason:
          type: string
          description: Machine-readable reachability reason, or `reachable` when the target is usable.
        port_forward:
          type: boolean
          description: Whether the resource can be targeted by a port-forward request.
        exec:
          type: boolean
          description: Whether the resource can be targeted by a runtime exec request.
        runner_instance_id:
          type: string
          description: Runner instance currently backing this access target.
        runner_instance_status:
          type: string
          description: Status of the runner instance currently backing this access target.
        attempt_id:
          type: string
          description: Runner attempt currently backing this access target.
        worker_id:
          type: string
          description: Worker id currently backing this access target.
    RuntimeResourceHealthRow:
      type: object
      additionalProperties: false
      required:
        - resource
        - resource_ref
        - health
        - observed
        - phase
        - ready
        - reason
        - message
        - condition_summary
        - degraded_conditions
        - actions
        - access
        - access_summary
        - source
        - updated_at
        - resource_version
      properties:
        resource:
          type: string
          description: Canonical `Kind/name` resource identity.
        resource_ref:
          $ref: '#/components/schemas/RuntimeResourceWatchRef'
        health:
          type: string
          enum:
            - ready
            - degraded
            - problem
            - unknown
        observed:
          type: string
          enum:
            - current
            - stale
            - unknown
          description: Freshness state derived from `metadata.generation` and `status.observedGeneration`.
        phase:
          type:
            - string
            - 'null'
        ready:
          anyOf:
            - $ref: '#/components/schemas/RuntimeResourceCondition'
            - type: 'null'
        reason:
          type:
            - string
            - 'null'
        message:
          type:
            - string
            - 'null'
        condition_summary:
          type:
            - string
            - 'null'
        degraded_conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeResourceCondition'
        actions:
          type: array
          items:
            type: string
        access:
          $ref: '#/components/schemas/RuntimeResourceAccessStatus'
        access_summary:
          type:
            - string
            - 'null'
        source:
          type:
            - string
            - 'null'
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
        resource_version:
          type:
            - string
            - 'null'
    RuntimeResourceCondition:
      type: object
      additionalProperties: true
      required:
        - type
        - status
        - reason
        - message
      properties:
        type:
          type: string
        status:
          type: string
          enum:
            - 'True'
            - 'False'
            - Unknown
        reason:
          type: string
        message:
          type: string
        lastTransitionTime:
          type: string
          format: date-time
    RuntimeApiResourceList:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - cloud_run_id
        - generated_at
        - core_run_ids
        - resources
      properties:
        apiVersion:
          type: string
          enum:
            - bucephalus.dev/v1alpha1
        kind:
          type: string
          enum:
            - RuntimeApiResourceList
        cloud_run_id:
          $ref: '#/components/schemas/CloudRunId'
        generated_at:
          type: string
          format: date-time
          description: Server time when this runtime API discovery snapshot was generated.
        core_run_ids:
          type: array
          description: Core run ids represented by the resource inventory used to compute live discovery counts.
          items:
            type: string
        resources:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeApiResource'
    RuntimeApiResource:
      type: object
      additionalProperties: false
      required:
        - cloud_run_id
        - generated_at
        - core_run_ids
        - group
        - version
        - name
        - singularName
        - namespaced
        - scope
        - kind
        - shortNames
        - categories
        - verbs
        - subresources
        - actions
        - access
        - supports
        - pathTemplates
        - exampleCommands
        - printerColumns
        - fieldSelectors
        - labelSelectors
        - labelSelector
        - count
        - description
      properties:
        cloud_run_id:
          $ref: '#/components/schemas/CloudRunId'
        generated_at:
          type: string
          format: date-time
          description: Server time when this runtime API resource discovery snapshot was generated.
        core_run_ids:
          type: array
          description: Core run ids represented by the resource inventory used to compute this kind's live count.
          items:
            type: string
        group:
          type: string
          enum:
            - bucephalus.dev
          description: Runtime API group for this resource kind.
        version:
          type: string
          enum:
            - v1alpha1
          description: Runtime API version for this resource kind.
        name:
          type: string
          description: Lowercase plural resource name, similar to Kubernetes APIResource.name. Accepted anywhere a runtime resource kind is requested.
        singularName:
          type: string
          description: Lowercase singular resource name accepted as a kind alias.
        namespaced:
          type: boolean
          enum:
            - false
        scope:
          type: string
          enum:
            - run
          description: Runtime resources are scoped to one Cloud run.
        kind:
          type: string
          description: Canonical PascalCase runtime resource kind.
        shortNames:
          type: array
          items:
            type: string
          description: Short aliases accepted anywhere a runtime resource kind is requested.
        categories:
          type: array
          items:
            type: string
        verbs:
          type: array
          description: Supported collection/resource verbs such as list, get, watch, describe, create, and delete.
          items:
            type: string
        subresources:
          type: array
          description: >
            Supported subresources such as logs, actions/cordon,
            actions/cancel, or actions/complete.
          items:
            type: string
        actions:
          type: array
          description: Supported lifecycle actions exposed through resource action subresources.
          items:
            type: string
        access:
          type: array
          description: Low-level runtime access and observability operations this kind can target, such as logs, port-forward, or exec.
          items:
            type: string
        supports:
          $ref: '#/components/schemas/RuntimeApiResourceSupports'
        pathTemplates:
          $ref: '#/components/schemas/RuntimeApiResourcePathTemplates'
        exampleCommands:
          type: array
          description: CLI command templates for common operator workflows, using `{run_id}` and `{name}` placeholders.
          items:
            $ref: '#/components/schemas/RuntimeApiResourceExampleCommand'
        printerColumns:
          type: array
          description: Kubernetes-style printer column hints for list/watch/resource tables.
          items:
            $ref: '#/components/schemas/RuntimeApiResourcePrinterColumn'
        fieldSelectors:
          type: array
          description: >
            Concrete field selector paths supported by the runtime resource
            list/watch/inspect endpoints for this kind. Clients should use the
            advertised paths instead of parsing payload JSON; for example Event
            resources advertise involved-object selectors such as
            `spec.involved_object.kind`, `spec.involved_object.name`,
            `status.involved`, and `status.involved_uid`.
          items:
            type: string
        labelSelectors:
          type: array
          description: Label selector keys stamped on this resource kind and supported by the runtime resource list endpoint.
          items:
            type: string
        labelSelector:
          type: boolean
          enum:
            - true
        count:
          type: integer
          minimum: 0
          description: Current number of visible resources of this kind in the run inventory.
        description:
          type: string
    RuntimeApiResourceSupports:
      type: object
      additionalProperties: false
      required:
        - list
        - get
        - watch
        - describe
        - create
        - delete
        - actions
        - access
        - labelSelector
        - fieldSelector
      properties:
        list:
          type: boolean
        get:
          type: boolean
        watch:
          type: boolean
        describe:
          type: boolean
        create:
          type: boolean
