            - active
            - failed
            - reaped
        provider:
          type: string
        provider_instance_id:
          type:
            - string
            - 'null'
        instance_name:
          type:
            - string
            - 'null'
        runner_instance_id:
          type:
            - string
            - 'null'
          format: uuid
        requirements:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        metadata:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        error_message:
          type:
