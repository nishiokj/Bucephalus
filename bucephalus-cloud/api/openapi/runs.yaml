    get:
      operationId: listRunRuntimeResourceEvents
      summary: List lifecycle and audit events for one runtime resource.
      description: >
        Returns the resource-scoped event stream for a Kubernetes-shaped runtime
        resource, similar to looking up Events involved with an object in
        Kubernetes or OpenShift. This subresource preserves the same event
        filters as the run-level runtime event stream while resolving involved
        object references from the selected resource.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/RunId'
        - name: kind
          in: path
          required: true
          description: Canonical runtime kind, lowercase singular/plural resource name, or short name from runtime API discovery.
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: after_row_seq
          in: query
          required: false
          description: >
            Numeric event row cursor for manual debugging/backfill. Prefer
            `continue` for paged clients and `metadata.resourceVersion` for
            follow/watch cursors. The server rejects requests that provide both
            `after_row_seq` and `continue`.
          schema:
            type: integer
            minimum: 0
        - name: continue
          in: query
          required: false
          description: >
            Event-list cursor returned as `metadata.continue` or
            `metadata.resourceVersion`. Current cursors use
            `event-row-seq:<row_seq>`; clients should still treat the value as
            opaque and pass it back unchanged.
          schema:
            type: string
        - name: event_type
          in: query
          required: false
          description: >
            Filter by event type. May be repeated or comma-separated. Runtime
            audit event types include low-level access lifecycle rows,
            operation reviews, raw log/content reads, and
            `runtime.api_resources.read` / `runtime.api_resources.read.failed`
            catalog discovery reads, plus
            `runtime.inspect.bundle.read` / `runtime.inspect.bundle.read.failed`
            support-bundle reads.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: source
          in: query
          required: false
          description: Filter by normalized event source.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: resource_kind
          in: query
          required: false
          description: Additional involved-resource kind filter.
          schema:
            type: string
        - name: resource_name
          in: query
          required: false
          description: Additional involved-resource name filter.
          schema:
            type: string
        - name: trial_id
          in: query
          required: false
          description: Filter by trial id.
          schema:
            type: string
        - name: task_id
          in: query
          required: false
          description: Filter by task id.
          schema:
            type: string
      responses:
        '200':
          description: Runtime resource event stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceEventList'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
