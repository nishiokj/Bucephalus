        - created_at
        - updated_at
      properties:
        runner_instance_id:
          type: string
          format: uuid
        runner_pool_id:
          type: string
          format: uuid
        instance_name:
          type: string
        status:
          type: string
          enum:
            - online
            - draining
            - offline
            - unhealthy
        capabilities:
          $ref: '#/components/schemas/WorkerCapabilities'
        metadata:
          $ref: './common.yaml#/components/schemas/AnyJsonObject'
        last_heartbeat_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
