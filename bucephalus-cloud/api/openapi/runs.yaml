      responses:
        '200':
          description: Expired attempts and runtime access resources.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - expired
                  - expired_access_resources
                properties:
                  expired:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunClaim'
                  expired_access_resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/RuntimeResource'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
