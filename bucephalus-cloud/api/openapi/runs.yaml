  /v1/worker/run-attempts/{attempt_id}/runtime/resources/PortForward/{access_request_id}/{action}:
    post:
      operationId: updateWorkerRunAttemptPortForwardResource
      summary: Advance port-forward lifecycle from a worker attempt.
      description: >
        Worker-authenticated lifecycle update for an assigned PortForward
        resource. The control plane enforces ordered transitions: a request
        must be accepted before it can become active; completed is allowed only
        from active; failed and expired updates are allowed from any live phase;
        terminal or out-of-order updates return a conflict and do not write audit
        events.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AttemptId'
        - name: access_request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - accept
              - accepted
              - active
              - complete
              - completed
              - fail
              - failed
              - expire
              - expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRuntimePortForwardRequest'
      responses:
        '200':
          description: Updated PortForward runtime resource.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - resource
                properties:
                  resource:
                    $ref: '#/components/schemas/RuntimeResource'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
