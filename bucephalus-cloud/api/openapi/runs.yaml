  /v1/worker/run-attempts/{attempt_id}/runtime/resources/Exec/{access_request_id}/{action}:
    post:
      operationId: updateWorkerRunAttemptExecResource
      summary: Advance runtime exec lifecycle from a worker attempt.
      description: >
        Worker-authenticated lifecycle update for an assigned Exec resource. The
        control plane enforces ordered transitions: a request must be accepted
        before it can become active or completed; failed and expired updates are
        allowed from any live phase; terminal or out-of-order updates return a
        conflict and do not write audit events.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AttemptId'
        - name: access_request_id
          in: path
          required: true
          schema:
