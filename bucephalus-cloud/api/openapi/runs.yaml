openapi: 3.1.0
info:
  title: Bucephalus Cloud Runs API
  version: 0.1.0
  description: >
    Cloud run request primitives. A run references an accepted sealed package
    artifact and supplies only the environment values or secret references that
    are not already provided by the target runtime environment.
servers:
  - url: https://api.bucephalus.dev
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/packages:
    get:
      operationId: listPackageArtifacts
      summary: List recent package artifacts.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: './common.yaml#/components/parameters/Limit'
        - name: include_config
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Include full manifest, resolved experiment, diagnostics, provenance, and image metadata.
      responses:
        '200':
          description: Package artifacts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - packages
                properties:
                  packages:
                    type: array
                    items:
                      $ref: '#/components/schemas/PackageArtifact'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
  /v1/packages/{package_digest}:
    get:
      operationId: getPackageArtifact
      summary: Fetch an accepted sealed package artifact by digest.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - name: package_digest
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Digest'
      responses:
        '200':
          description: Package artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageArtifact'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/packages/{package_digest}/content:
    get:
      operationId: downloadPackageArtifact
      summary: Download sealed package artifact bytes by digest.
      security:
        - workerAttemptBearerAuth: []
      description: >
        Workers use this endpoint to materialize package content. The request
        must present the worker attempt bearer token and X-Bucephalus-Attempt-Id
        for a running attempt whose run uses this package digest. The API
        resolves package storage metadata through the run owner's package association
        so same-digest uploads from another owner cannot redirect a
        worker onto another storage object. Workers must not read API-local
        storage paths from the database.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - name: package_digest
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Digest'
        - name: X-Bucephalus-Attempt-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Running attempt id bound to the bearer attempt token.
      responses:
        '200':
          description: Package archive bytes.
          headers:
            X-Bucephalus-Package-Digest:
              schema:
                $ref: './common.yaml#/components/schemas/Digest'
          content:
            application/gzip:
              schema:
                type: string
                format: binary
            application/x-tar:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
  /v1/runs:
    get:
      operationId: listRuns
      summary: List recent Cloud run records.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: './common.yaml#/components/parameters/Limit'
        - name: package_digest
          in: query
          required: false
          schema:
            $ref: './common.yaml#/components/schemas/Digest'
          description: Restrict results to runs created from a specific package artifact.
        - name: include_runtime
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Include runtime progress and queued pending-reason enrichment.
        - name: include_config
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Include run config blobs such as runtime options, requirements, provenance, and env/secret key summaries.
      responses:
        '200':
          description: Run records.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - runs
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudRun'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
    post:
      operationId: createRun
      summary: Create a Cloud run request for an accepted sealed package.
      description: >
        This creates a run record. It does not build, rewrite, register, or
        launch a different artifact. Runtime execution can be attached later by
        a managed runner.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - package_digest
              properties:
                package_digest:
                  $ref: './common.yaml#/components/schemas/Digest'
                run_label:
                  type:
                    - string
                    - 'null'
                env:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 32768
                  description: >
                    Plain non-secret environment values supplied for this run.
                    Keys must be uppercase shell identifiers matching
                    [A-Z_][A-Z0-9_]*, must not collide with secret_refs keys,
                    and must not use reserved Cloud runtime/control-plane names
                    such as DATABASE_URL, BUCEPHALUS_CLOUD_WORKER_TOKEN, or
                    provider credential variables. Values must not contain NUL
                    bytes and are limited to 32768 UTF-8 bytes.
                secret_refs:
                  type: object
                  additionalProperties:
                    type: string
                  description: >
                    Environment variable names mapped to secret references.
                    bucephalus://<name> references a hosted secret previously
                    uploaded via PUT /v1/secrets/<name> and is translated to a
                    backing provider ref at run creation. Direct provider refs
                    are also accepted:
                    gcp-secret-manager://projects/<project>/secrets/<secret>/versions/<version>
                    and aws-secrets-manager://<secret-id>.
                runtime_options:
                  $ref: '#/components/schemas/CloudRuntimeOptions'
                  description: >
                    Hosted Cloud runtime options accepted by the scheduler.
                    Placement is Cloud-owned: clients must not send region,
                    runtime_region, placement, or zone. Legacy local/TUI aliases
                    such as executor and cpu are also rejected; use backend and
                    cpu_count when those knobs are explicitly supported.
      responses:
        '201':
          description: Run record created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudRun'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
  /v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Fetch a Cloud run record.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudRun'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/runtime/events:
    get:
      operationId: listRunRuntimeEvents
      summary: List runtime lifecycle, audit, and trace events for a Cloud run.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/RunId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: after_row_seq
          in: query
          required: false
          description: >
            Numeric event row cursor for manual debugging/backfill. Prefer
            `continue` for paged clients and `metadata.resourceVersion` for
            follow/watch cursors. The server rejects requests that provide both
            `after_row_seq` and `continue`.
          schema:
            type: integer
            minimum: 0
        - name: continue
          in: query
          required: false
          description: >
            Event-list cursor returned as `metadata.continue` or
            `metadata.resourceVersion`. Current cursors use
            `event-row-seq:<row_seq>`; clients should still treat the value as
            opaque and pass it back unchanged.
          schema:
            type: string
        - name: event_type
          in: query
          required: false
          description: >
            Filter by event type. May be repeated or comma-separated, for
            example `event_type=runtime.access.exec.requested,trial.observed`.
            Runtime audit event types include low-level access lifecycle rows,
            operation reviews, raw log/content reads, and
            `runtime.api_resources.read` / `runtime.api_resources.read.failed`
            catalog discovery reads, plus
            `runtime.inspect.bundle.read` / `runtime.inspect.bundle.read.failed`
            support-bundle reads.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: source
          in: query
          required: false
          description: >
            Filter by normalized event source, such as `cloud.run_events`,
            `runtime.event_rows`, or `worker_runtime_snapshot`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: resource_kind
          in: query
          required: false
          description: Filter events by involved runtime resource kind when the event declares one.
          schema:
            type: string
        - name: resource_name
          in: query
          required: false
          description: Filter events by involved runtime resource name when the event declares one.
          schema:
            type: string
        - name: trial_id
          in: query
          required: false
          description: Filter events by trial id across Core, worker snapshot, and Cloud control-plane event rows.
          schema:
            type: string
        - name: task_id
          in: query
          required: false
          description: Filter events by task id across Core, worker snapshot, and Cloud control-plane event rows.
          schema:
            type: string
      responses:
        '200':
          description: Runtime event rows from the Cloud control plane, worker snapshots, and Core runtime store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeEventList'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/runtime/api-resources:
    get:
      operationId: listRunRuntimeApiResources
      summary: Discover runtime resource kinds and supported operations for a Cloud run.
      description: >
        Returns a Kubernetes-style API resource catalog for the runtime control
        plane of one Cloud run. Each entry describes the kind, short names,
        supported verbs, subresources, lifecycle actions, access operations,
        selector support, and the current number of visible resources of that
        kind in the run inventory.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Runtime API resource discovery catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeApiResourceList'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/runtime/api-resources/{kind}:
    get:
      operationId: getRunRuntimeApiResource
      summary: Explain one runtime resource kind and its supported operations.
      description: >
        Resolves a canonical Kind, lowercase plural name, singular name, short
        name, or hyphen/case variant against the runtime API discovery catalog
        for one Cloud run and returns the authoritative resource-kind contract.
        This is the server-side equivalent of `kubectl explain` for Cloud
        runtime resources, including selector contracts, path templates,
        subresources, lifecycle actions, access operations, printer columns,
        example commands, and the live visible resource count for the run.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/RunId'
        - name: kind
          in: path
          required: true
          schema:
            type: string
          description: Canonical Kind, plural, singular, short name, or hyphen/case alias to explain.
      responses:
        '200':
          description: Runtime API resource kind contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeApiResource'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/runtime/inspect:
    get:
      operationId: inspectRunRuntime
      summary: Build a runtime inspect bundle for one Cloud run.
      description: >
        Returns a bounded Kubernetes/OpenShift-style inspect bundle containing
        runtime API resource discovery, the visible resource inventory, resource
        health, bounded resource metrics, recent lifecycle/audit events, and log
        subresource references for resources that support logs. The same
        resource selectors as list/health/top can narrow the exported inventory
        for support handoff and offline operator inspection without embedding
        large log payloads.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/RunId'
        - name: event_limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 250
        - name: kind
          in: query
          required: false
          description: >
            Filter by resource kind before the inspect bundle is built. May be
            repeated or comma-separated, and accepts canonical kinds,
            lowercase singular/plural resource names, or short names from
            `runtime/api-resources`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: category
          in: query
          required: false
          description: >
            Filter by server-advertised runtime API resource category before
            the inspect bundle is built. May be repeated or comma-separated,
            and values come from `runtime/api-resources[].categories`, such as
            `runner`, `trial`, `access`, or `access-target`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: label_selector
          in: query
          required: false
          description: Kubernetes-style label selector applied before the inspect bundle is built.
          schema:
            type: string
        - name: field_selector
          in: query
          required: false
          description: >
            Kubernetes-style field selector applied before the inspect bundle is
            built. Supports the same paths as runtime resource listing.
          schema:
            type: string
      responses:
        '200':
          description: Runtime inspect bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeInspectBundle'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/runtime/resources:
    get:
      operationId: listRunRuntimeResources
      summary: List low-level runtime resources for a Cloud run.
      description: >
        Returns Kubernetes-shaped runtime resources backed by Cloud control
        plane rows, declared run requirements, runner pools, worker attempts,
        runner provision requests, normalized Core schedule/container tables,
        worker runtime snapshots, and runtime lifecycle/audit events projected as
        Event resources. Secret refs and environment values are not included;
        only secret ids and environment key names are exposed.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/RunId'
        - name: kind
          in: query
          required: false
          description: >
            Filter by resource kind. May be repeated or comma-separated, and
            accepts canonical kinds, lowercase singular/plural resource names,
            or short names from `runtime/api-resources`; for example
            `kind=RunnerAttempt,PortForward&kind=Exec`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: category
          in: query
          required: false
          description: >
            Filter by server-advertised runtime API resource category. May be
            repeated or comma-separated, and values come from
            `runtime/api-resources[].categories`, such as `runner`, `trial`,
            `access`, or `access-target`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: label_selector
          in: query
          required: false
          description: >
            Kubernetes-style label selector. Supports `key`, `!key`,
            `key=value`, `key==value`, `key!=value`, `key in (a,b)`,
            and `key notin (a,b)` expressions separated by commas. Commas
            inside set expressions are parsed as set values.
          schema:
            type: string
        - name: field_selector
          in: query
          required: false
          description: >
            Kubernetes-style field selector. Supports `path=value` and
            `path!=value` over `kind`, `metadata.name`, `metadata.uid`,
            `metadata.generation`, `metadata.resourceVersion`,
            `metadata.creationTimestamp`, `metadata.deletionTimestamp`,
            `metadata.labels.<key>`, `metadata.ownerReferences`,
            `metadata.ownerReferences.apiVersion`,
            `metadata.ownerReferences.kind`, `metadata.ownerReferences.name`,
            `metadata.ownerReferences.uid`, `spec.<path>`,
            operational access paths such as `status.access.reachable`,
            `status.access.port_forward`, `status.access.exec`,
            `status.access.runner_instance_id`,
            `status.access.runner_instance_status`,
            `status.access.attempt_id`, `status.access.worker_id`,
            condition paths such as `status.conditions.Ready`,
            `status.conditions.ClientReachable`,
            `status.conditions.ClientReachable.reason`, generic `status.<path>`,
            and `audit.<path>`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: >
            Maximum number of resources to return from the filtered collection.
            When more resources remain, the response metadata includes an opaque
            `continue` token and `remainingItemCount`.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: continue
          in: query
          required: false
          description: >
            Opaque pagination token from a previous RuntimeResourceList
            `metadata.continue` value. Tokens are tied to the filtered
            collection resourceVersion; restart the list if the token expires.
          schema:
            type: string
      responses:
        '200':
          description: Runtime resource inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceList'
        '410':
          description: Continue token expired because the filtered resource collection changed.
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/runtime/resources/health:
    get:
      operationId: getRunRuntimeResourceHealth
      summary: Summarize runtime resource health for a Cloud run.
      description: >
        Returns an operator-oriented health rollup derived from runtime resource
        conditions, phases, access readiness, and advertised lifecycle actions.
        Supports the same kind, label, and field selectors as runtime resource
        listing so CLI and GUI clients can summarize a filtered inventory.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/RunId'
        - name: kind
          in: query
          required: false
          description: >
            Filter by resource kind. May be repeated or comma-separated, and
            accepts canonical kinds, lowercase singular/plural resource names,
            or short names from `runtime/api-resources`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: category
          in: query
          required: false
          description: >
            Filter by server-advertised runtime API resource category. May be
            repeated or comma-separated, and values come from
            `runtime/api-resources[].categories`, such as `runner`, `trial`,
            `access`, or `access-target`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: label_selector
          in: query
          required: false
          description: Kubernetes-style label selector applied before health is calculated.
          schema:
            type: string
        - name: field_selector
          in: query
          required: false
          description: >
            Kubernetes-style field selector applied before health is calculated.
            Supports the same paths as runtime resource listing, including
            `status.access.reachable`, `status.access.port_forward`,
            `status.access.exec`, `status.access.runner_instance_id`,
            `status.access.runner_instance_status`,
            `status.access.attempt_id`, `status.access.worker_id`, and
            condition paths such as `status.conditions.Ready` or
            `status.conditions.ClientReachable.reason`.
          schema:
            type: string
      responses:
        '200':
          description: Runtime resource health summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceHealth'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/runtime/resources/metrics:
    get:
      operationId: listRunRuntimeResourceMetrics
      summary: List metrics for runtime resources in a Cloud run.
      description: >
        Returns a bounded, operator-oriented metrics view across the filtered
        runtime resource inventory, similar to a Kubernetes `top`-style scan.
        Supports the same kind, label, and field selectors as runtime resource
        listing so CLI and GUI clients can inspect infrastructure state without
        fetching each resource metrics subresource one at a time.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/RunId'
        - name: kind
          in: query
          required: false
          description: >
            Filter by resource kind. May be repeated or comma-separated, and
            accepts canonical kinds, lowercase singular/plural resource names,
            or short names from `runtime/api-resources`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: category
          in: query
          required: false
          description: >
            Filter by server-advertised runtime API resource category. May be
            repeated or comma-separated, and values come from
            `runtime/api-resources[].categories`, such as `runner`, `trial`,
            `access`, or `access-target`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: label_selector
          in: query
          required: false
          description: Kubernetes-style label selector applied before metrics are calculated.
          schema:
            type: string
        - name: field_selector
          in: query
          required: false
          description: >
            Kubernetes-style field selector applied before metrics are calculated.
            Supports the same paths as runtime resource listing, including
            `status.access.reachable`, `status.access.port_forward`,
            `status.access.exec`, and condition paths such as
            `status.conditions.Ready`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of resource metric rows to return for this page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: continue
          in: query
          required: false
          description: >
            Opaque pagination cursor from metadata.continue on a previous
            runtime resource metrics list response. Restart the list without
            continue when the cursor expires.
          schema:
            type: string
      responses:
        '200':
          description: Runtime resource collection metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceMetricsList'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/runtime/resources/watch:
    get:
      operationId: watchRunRuntimeResources
      summary: Watch low-level runtime resource changes for a Cloud run.
      description: >
        Returns a Kubernetes-style watch snapshot for runtime resources. Clients
        can pass the last list `metadata.resourceVersion` as `resource_version`
        to get an empty event list when the filtered collection is unchanged,
        or pass previously observed resource versions with repeated
        `known_resource=Kind/name=resourceVersion` query parameters for
        per-resource ADDED, MODIFIED, and DELETED comparisons. Pass
        `allow_bookmarks=true` to receive a BOOKMARK event when the filtered
        collection has no changes but the watch cursor is still valid. The API
        returns the current resource-version map to use on the next watch
        request.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/RunId'
        - name: kind
          in: query
          required: false
          description: >
            Filter by resource kind. May be repeated or comma-separated, and
            accepts canonical kinds, lowercase singular/plural resource names,
            or short names from `runtime/api-resources`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: category
          in: query
          required: false
          description: >
            Filter by server-advertised runtime API resource category. May be
            repeated or comma-separated, and values come from
            `runtime/api-resources[].categories`, such as `runner`, `trial`,
            `access`, or `access-target`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: label_selector
          in: query
          required: false
          description: Kubernetes-style label selector applied before watch events are calculated.
          schema:
            type: string
        - name: field_selector
          in: query
          required: false
          description: >
            Kubernetes-style field selector applied before watch events are
            calculated. Supports the same paths as runtime resource listing,
            including operational access paths such as
            `status.access.reachable`, `status.access.port_forward`,
            `status.access.exec`, `status.access.runner_instance_id`,
            `status.access.runner_instance_status`,
            `status.access.attempt_id`, `status.access.worker_id`, and
            condition paths such as `status.conditions.Ready` or
            `status.conditions.ClientReachable.reason`.
          schema:
            type: string
        - name: known_resource
          in: query
          required: false
          description: >
            Previously observed resource cursor in `Kind/name=resourceVersion`
            form. Repeat once per known resource.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: resource_version
