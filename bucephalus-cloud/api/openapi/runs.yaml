  /v1/runs/{run_id}/runtime/resources/{kind}/{name}/operations/{operation}:
    get:
      operationId: reviewRunRuntimeResourceOperation
      summary: Review whether one runtime resource operation is currently supported.
      description: >
        Returns the server-derived yes/no review for a selected runtime resource
        operation, using the same object-scoped operation contract exposed by
        resource describe. Unsupported operations remain explicit with a
        machine-readable reason and human-readable message so CLI and GUI
        clients do not need to infer why a low-level action is unavailable.
        Operation review also covers status-subresource wait checks, so clients
        can confirm a `buc runs wait` command before polling the status
        subresource.
        Slash-qualified operation labels such as `logs/stdout` or
        `watch/not-ready` are one operation name and must be percent-encoded in
        this path segment, for example `logs%2Fstdout`.
      parameters:
        - $ref: './common.yaml#/components/parameters/OrgId'
        - $ref: '#/components/parameters/RunId'
        - name: kind
          in: path
          required: true
          description: Canonical runtime kind, lowercase singular/plural resource name, or short name from runtime API discovery.
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: operation
          in: path
          required: true
          description: Operation label such as describe, list/name, wait, top, metrics, events, audit, logs, logs/stdout, watch/not-ready, port-forward, exec, delete, cancel, cordon, drain, or uncordon. Slash-qualified labels must be percent-encoded as one path segment.
