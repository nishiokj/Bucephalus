experiment:
  id: gpt55_high_swebench_one_trial
  name: GPT-5.5 High One SWE-bench Trial
  workload_type: agent_runtime

baseline:
  variant_id: gpt_55_high
  bindings:
    model_provider: codex
    model: gpt-5.5
    reasoning: high

variant_plan: []

dataset:
  suite_id: swebench_lite_curated
  provider: local_jsonl
  path: /Users/jevinnishioka/Desktop/Experiments/.lab/experiments/data/swebench_lite_curated.task_spec.jsonl
  split_id: test
  limit: 1

design:
  replications: 1
  max_concurrency: 1

trial_runtime:
  task:
    interface: writable_workspace
    workspace:
      source: container_image
      image:
        from: task_row
      workdir:
        from: task_row
  agent:
    artifact: /Users/jevinnishioka/Desktop/agent/.lab/agents/rex-gpt55-applypatch-providerfix2.linux-x64.tar.gz
    command:
      - /opt/agent/bin/bun
      - /opt/agent/bin/rex
      - run
      - --config
      - /opt/agent/config/defaults.json
      - --working-dir
      - $WORKSPACE
      - --provider
      - $model_provider
      - --model
      - $model
      - --reasoning
      - $reasoning
      - --timeout-ms
      - "540000"
      - --dangerous
      - --events
      - __AGENTLAB_EVENT_PATH_rex_hooks__
    integration_level: cli_events
    events:
      - id: rex_hooks
        format: hook_events_v1
        path: /agentlab/out/rex-events.jsonl
        mode: jsonl
        persist: true
        ingest: true
    output_mounts:
      - id: session_context
        kind: directory
        path: session-context
        env: AGENTLAB_SESSION_CONTEXT_ROOT
        persist: true
    secret_files:
      - id: codex_oauth
        target: /root/.codex/auth.json
        required_for_variants: [gpt_55_high]
        credential_cache:
          kind: run_scoped
          target: /agentlab/credentials/codex_oauth/auth.json
          env: CODEX_AUTH_CACHE_FILE
    network: full
  execution:
    agent_site: task_runtime
  outputs:
    result:
      path: /agentlab/out/result.json
    patch:
      mode: workspace_diff
  grader:
    strategy: host
    host:
      capability: swebench_official
    command:
      - python3
      - __AGENTLAB_HOST_GRADER_CAPABILITY__/swebench_official/run_official_swebench_eval_from_agentlab.py
      - --grader-input
    conclusion:
      mode: direct

benchmark:
  policy:
    evaluator_mode: official
    scoring_lifecycle: predict_then_score

metrics:
  - id: resolved
    source:
      type: agent_response
      pointer: /metrics/resolved
    direction: maximize
    primary: true
    weight: 1

policy:
  timeout_ms: 600000
  task_sandbox:
    network: full
