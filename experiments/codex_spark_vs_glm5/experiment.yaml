experiment:
  id: codex_spark_vs_glm5_swebench
  name: Codex Spark (medium reasoning) vs GLM-5 (reasoning on)
  workload_type: agent_runtime

baseline:
  variant_id: codex_spark1
  bindings:
    model_provider: codex
    model: gpt-5.3-codex-spark
    reasoning: medium

variant_plan:
  - variant_id: glm_5
    bindings:
      model_provider: z.ai-coder
      model: glm-5
      reasoning: "on"

dataset:
  suite_id: swebench_lite_curated
  provider: local_jsonl
  path: ../../.lab/experiments/data/swebench_lite_curated.task_spec.jsonl
  split_id: test
  limit: 3

design:
  replications: 1
  max_concurrency: 2

trial_runtime:
  task:
    interface: writable_workspace
    workspace:
      source: container_image
      image:
        from: task_row
      workdir:
        from: task_row
  agent:
    artifact: /Users/jevinnishioka/Desktop/Experiments/.lab/agents/rex-current-rebuilt.linux-x64.tar.gz
    command:
      [
        /opt/agent/bin/rex,
        run,
        --config,
        /opt/agent/config/defaults.json,
        --working-dir,
        $WORKSPACE,
        --input-file,
        /agentlab/in/trial_input.json,
        --output,
        /agentlab/out/result.json,
        --provider,
        $model_provider,
        --model,
        $model,
        --reasoning,
        $reasoning,
      ]
    output_mounts:
      - id: session_context
        kind: directory
        path: session-context
        env: AGENTLAB_SESSION_CONTEXT_ROOT
        persist: true
    network: full
  execution:
    agent_site: task_runtime
  outputs:
    result:
      path: /agentlab/out/result.json
    patch:
      mode: workspace_diff
  grader:
    strategy: host
    host:
      capability: swebench_official
    command:
      - python3
      - __AGENTLAB_HOST_GRADER_CAPABILITY__/swebench_official/run_official_swebench_eval_from_agentlab.py
      - --grader-input
    conclusion:
      mode: direct

benchmark:
  policy:
    evaluator_mode: official
    scoring_lifecycle: predict_then_score

metrics:
  - id: resolved
    source:
      type: agent_response
      pointer: /metrics/resolved
    direction: maximize
    primary: true
    weight: 1

policy:
  timeout_ms: 600000
  task_sandbox:
    network: full
