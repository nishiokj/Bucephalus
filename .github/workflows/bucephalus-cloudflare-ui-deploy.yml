name: Bucephalus Cloudflare UI Deploy

on:
  workflow_dispatch:
    inputs:
      github_environment:
        description: "Deployment environment"
        required: true
        default: "bucephalus"
        type: choice
        options:
          - bucephalus
      release_version_override:
        description: "Advanced override; defaults to latest Cloud UI assets"
        required: false
        default: ""
        type: string

run-name: Cloudflare UI deploy

permissions:
  contents: read
  actions: read
  id-token: none

jobs:
  deploy-cloudflare-ui:
    name: Deploy UI to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve Cloud UI assets
        id: resolved_ui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            --need ui
            --workflow bucephalus-cloud-ui-assets.yml
            --github-output "${GITHUB_OUTPUT}"
          )
          if [[ -n "${{ inputs.release_version_override }}" ]]; then
            args+=(--version "${{ inputs.release_version_override }}")
          else
            args+=(--latest)
          fi
          scripts/release/resolve-cloud-release-artifacts.sh "${args[@]}"

      - name: Resolve configured Cloud API base
        id: configured_api_base
        env:
          CONFIGURED_API_BASE: ${{ vars.BUCEPHALUS_CLOUD_API_BASE || secrets.BUCEPHALUS_CLOUD_API_BASE }}
        run: |
          if [[ -z "${CONFIGURED_API_BASE}" ]]; then
            echo "needs_gcp=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${CONFIGURED_API_BASE}" != http*://* ]]; then
            echo "BUCEPHALUS_CLOUD_API_BASE must be an http(s) URL" >&2
            exit 1
          fi
          {
            echo "needs_gcp=false"
            echo "api_base=${CONFIGURED_API_BASE}"
          } >> "${GITHUB_OUTPUT}"
          echo "BUCEPHALUS_CLOUD_API_BASE=${CONFIGURED_API_BASE}" >> "${GITHUB_ENV}"

      - name: Resolve GCP CI/CD auth secret for API discovery
        id: gcp_deploy_auth
        if: ${{ steps.configured_api_base.outputs.needs_gcp == 'true' }}
        env:
          BUC_CI_CD: ${{ secrets.BUC_CI_CD }}
          BUCEPHALUS_GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.BUCEPHALUS_GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          BUCEPHALUS_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.BUCEPHALUS_GCP_DEPLOY_SERVICE_ACCOUNT }}
          BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          BUCEPHALUS_GCP_SERVICE_ACCOUNT: ${{ secrets.BUCEPHALUS_GCP_SERVICE_ACCOUNT }}
        run: scripts/deploy/resolve-gcp-cicd-secret.sh --mode deploy

      - name: Authenticate to Google Cloud for API discovery
        if: ${{ steps.configured_api_base.outputs.needs_gcp == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.gcp_deploy_auth.outputs.workload_identity_provider }}
          service_account: ${{ steps.gcp_deploy_auth.outputs.service_account }}

      - name: Set up gcloud for API discovery
        if: ${{ steps.configured_api_base.outputs.needs_gcp == 'true' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"

      - name: Discover Cloud API base from GCP
        if: ${{ steps.configured_api_base.outputs.needs_gcp == 'true' }}
        env:
          BUCEPHALUS_GCP_PROJECT_ID: ${{ vars.BUCEPHALUS_GCP_PROJECT_ID || 'gen-lang-client-0255842044' }}
          BUCEPHALUS_GCP_REGION: ${{ vars.BUCEPHALUS_GCP_REGION || 'us-central1' }}
          BUCEPHALUS_GCP_RESOURCE_PREFIX: ${{ vars.BUCEPHALUS_GCP_RESOURCE_PREFIX || 'buc' }}
          BUCEPHALUS_DEPLOYMENT_ENVIRONMENT: ${{ vars.BUCEPHALUS_DEPLOYMENT_ENVIRONMENT || inputs.github_environment }}
        run: |
          service="${BUCEPHALUS_GCP_RESOURCE_PREFIX}-${BUCEPHALUS_DEPLOYMENT_ENVIRONMENT}-api"
          api_base="$(
            gcloud run services describe "${service}" \
              --project "${BUCEPHALUS_GCP_PROJECT_ID}" \
              --region "${BUCEPHALUS_GCP_REGION}" \
              --format "value(status.url)"
          )"
          if [[ -z "${api_base}" || "${api_base}" != http*://* ]]; then
            echo "could not discover public API URL for Cloud Run service ${service}" >&2
            exit 1
          fi
          echo "BUCEPHALUS_CLOUD_API_BASE=${api_base}" >> "${GITHUB_ENV}"

      - name: Validate Cloudflare deploy config
        env:
          BUCEPHALUS_CLOUDFLARE_WORKER_NAME: ${{ vars.BUCEPHALUS_CLOUDFLARE_WORKER_NAME || 'bucephalus-cloud-ui' }}
          BUCEPHALUS_CLOUDFLARE_ACCOUNT_ID: ${{ vars.BUCEPHALUS_CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_SECRET_ID }}
          BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID || '380690977483-iekbab1cgtgv3ce1tjclh3bfs8o99rds.apps.googleusercontent.com' }}
        run: |
          if [[ -z "${{ steps.resolved_ui.outputs.ui_run_id }}" || -z "${{ steps.resolved_ui.outputs.ui_artifact_name }}" ]]; then
            echo "Cloud UI assets could not be resolved. Build UI assets first, or set release_version_override." >&2
            exit 1
          fi
          if [[ -z "${BUCEPHALUS_CLOUDFLARE_WORKER_NAME}" ]]; then
            echo "set environment variable BUCEPHALUS_CLOUDFLARE_WORKER_NAME or rely on the default bucephalus-cloud-ui" >&2
            exit 1
          fi
          if [[ -z "${BUCEPHALUS_CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "set BUCEPHALUS_CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_ACCOUNT_ID as a GitHub Environment variable, or CLOUDFLARE_SECRET_ID as a GitHub Environment secret" >&2
            exit 1
          fi
          if [[ -z "${BUCEPHALUS_CLOUD_API_BASE}" || "${BUCEPHALUS_CLOUD_API_BASE}" != http*://* ]]; then
            echo "BUCEPHALUS_CLOUD_API_BASE was not configured or discovered from GCP" >&2
            exit 1
          fi
          if [[ -z "${BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID}" || ! "${BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID}" =~ ^[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "set BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID to a Google OAuth web client ID in the GitHub environment" >&2
            exit 1
          fi
          {
            echo "BUCEPHALUS_CLOUDFLARE_WORKER_NAME=${BUCEPHALUS_CLOUDFLARE_WORKER_NAME}"
            echo "BUCEPHALUS_CLOUDFLARE_ACCOUNT_ID=${BUCEPHALUS_CLOUDFLARE_ACCOUNT_ID}"
            echo "BUCEPHALUS_CLOUD_API_BASE=${BUCEPHALUS_CLOUD_API_BASE}"
            echo "BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID=${BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID}"
          } >> "${GITHUB_ENV}"

      - name: Download Cloud UI assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resolved_ui.outputs.ui_artifact_name }}
          run-id: ${{ steps.resolved_ui.outputs.ui_run_id }}
          github-token: ${{ github.token }}
          path: dist/cloud-ui

      - name: Locate Cloud UI assets
        run: |
          manifest="$(find dist/cloud-ui -type f -name cloud-ui-assets.json | head -n 1)"
          if [[ -z "${manifest}" ]]; then
            echo "Cloud UI artifact is missing cloud-ui-assets.json" >&2
            exit 1
          fi
          echo "CLOUD_UI_ARTIFACT_DIR=$(dirname "${manifest}")" >> "${GITHUB_ENV}"

      - name: Verify Cloud UI assets
        run: scripts/release/verify-cloud-ui-assets.sh "${CLOUD_UI_ARTIFACT_DIR}"

      - name: Deploy Cloud UI to Cloudflare
        env:
          CLOUDFLARE_SECRET_KEY: ${{ secrets.CLOUDFLARE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_SECRET_KEY }}
        run: >-
          scripts/deploy/deploy-cloudflare-ui.sh
          --artifact "${CLOUD_UI_ARTIFACT_DIR}"
          --worker-name "${BUCEPHALUS_CLOUDFLARE_WORKER_NAME}"
          --account-id "${BUCEPHALUS_CLOUDFLARE_ACCOUNT_ID}"
          --api-base "${BUCEPHALUS_CLOUD_API_BASE}"
          --google-oauth-client-id "${BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID}"

      - name: Record Cloud UI deploy summary
        run: |
          {
            echo "### Bucephalus Cloudflare UI deploy"
            echo ""
            echo "- Release version: \`${{ steps.resolved_ui.outputs.release_version }}\`"
            echo "- Release run: \`${{ steps.resolved_ui.outputs.ui_run_id }}\`"
            echo "- UI artifact: \`${{ steps.resolved_ui.outputs.ui_artifact_name }}\`"
            echo "- Worker: \`${BUCEPHALUS_CLOUDFLARE_WORKER_NAME}\`"
            echo "- API base: \`${BUCEPHALUS_CLOUD_API_BASE}\`"
            echo "- Google OAuth client ID: \`${BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
