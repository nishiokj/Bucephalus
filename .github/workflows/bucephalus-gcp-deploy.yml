name: Bucephalus GCP Deploy

on:
  # Scheduled runs are drift checks: plan-only against the latest promotion
  # evidence, failing when live infrastructure no longer matches Terraform —
  # i.e. someone deployed by hand around the pipeline.
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      deployment_stage:
        description: "Deployment stage"
        required: true
        default: "substrate"
        type: choice
        options:
          - substrate
          - api
          - pool
      apply:
        description: "Apply the generated Terraform plan"
        required: true
        default: false
        type: boolean
      github_environment:
        description: "Deployment environment"
        required: true
        default: "bucephalus"
        type: choice
        options:
          - bucephalus
      release_version:
        description: "Optional override; defaults to latest pushed Cloud image promotion evidence"
        required: false
        type: string

run-name: >-
  ${{ github.event_name == 'schedule'
      && 'GCP drift check for bucephalus from release latest'
      || format('GCP {0} {1} for {2} from release {3}', inputs.deployment_stage, inputs.apply && 'apply' || 'plan', inputs.github_environment, inputs.release_version || 'latest') }}

permissions:
  contents: read
  actions: read
  id-token: none

jobs:
  deploy-gcp:
    name: Plan and optionally apply ${{ inputs.deployment_stage || 'drift check' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment || 'bucephalus' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Restore Terraform provider cache
        uses: actions/cache@v4
        with:
          path: .terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-1.7.5-gcp-${{ hashFiles('bucephalus-cloud/infra/gcp/.terraform.lock.hcl') }}

      - name: Prepare Terraform provider cache
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Resolve deployment stage
        env:
          DEPLOYMENT_STAGE: ${{ inputs.deployment_stage || 'pool' }}
          DRIFT_CHECK: ${{ github.event_name == 'schedule' }}
        run: |
          echo "DRIFT_CHECK=${DRIFT_CHECK}" >> "${GITHUB_ENV}"
          case "${DEPLOYMENT_STAGE}" in
            substrate)
              deploy_api_services="false"
              deploy_pool_controller="false"
              needs_api_config="false"
              needs_pool_config="false"
              ;;
            api)
              deploy_api_services="true"
              deploy_pool_controller="true"
              needs_api_config="true"
              needs_pool_config="true"
              ;;
            pool)
              deploy_api_services="true"
              deploy_pool_controller="true"
              needs_api_config="true"
              needs_pool_config="true"
              ;;
            *)
              echo "unsupported deployment_stage: ${DEPLOYMENT_STAGE}" >&2
              exit 2
              ;;
          esac
          {
            echo "DEPLOY_API_SERVICES=${deploy_api_services}"
            echo "DEPLOY_POOL_CONTROLLER=${deploy_pool_controller}"
            echo "NEEDS_API_CONFIG=${needs_api_config}"
            echo "NEEDS_POOL_CONFIG=${needs_pool_config}"
          } >> "${GITHUB_ENV}"

      - name: Resolve GCP deploy config
        env:
          BUCEPHALUS_TERRAFORM_BACKEND_BUCKET: ${{ vars.BUCEPHALUS_TERRAFORM_BACKEND_BUCKET }}
          BUCEPHALUS_TERRAFORM_BACKEND_PREFIX: ${{ vars.BUCEPHALUS_TERRAFORM_BACKEND_PREFIX }}
          BUCEPHALUS_GCP_PROJECT_ID: ${{ vars.BUCEPHALUS_GCP_PROJECT_ID }}
          BUCEPHALUS_GCP_REGION: ${{ vars.BUCEPHALUS_GCP_REGION }}
          BUCEPHALUS_DEPLOYMENT_ENVIRONMENT: ${{ vars.BUCEPHALUS_DEPLOYMENT_ENVIRONMENT || inputs.github_environment || 'bucephalus' }}
          BUCEPHALUS_GCP_RESOURCE_PREFIX: ${{ vars.BUCEPHALUS_GCP_RESOURCE_PREFIX }}
          BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID || vars.BUCEPHALUS_OAUTH_USER_CLIENT_ID }}
          BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID: ${{ vars.BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID || secrets.BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID }}
          BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION: ${{ vars.BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION || secrets.BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION }}
          BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION: ${{ vars.BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION || secrets.BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION }}
          BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION: ${{ vars.BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION || secrets.BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION }}
          BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION: ${{ vars.BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION || secrets.BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION }}
          BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION: ${{ vars.BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION || secrets.BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION }}
          BUCEPHALUS_API_INGRESS: ${{ vars.BUCEPHALUS_API_INGRESS || 'INGRESS_TRAFFIC_ALL' }}
          BUCEPHALUS_MODAL_BACKEND_ENABLED: ${{ vars.BUCEPHALUS_MODAL_BACKEND_ENABLED || 'false' }}
          BUCEPHALUS_MODAL_APP_NAME: ${{ vars.BUCEPHALUS_MODAL_APP_NAME }}
          BUCEPHALUS_MODAL_ENVIRONMENT: ${{ vars.BUCEPHALUS_MODAL_ENVIRONMENT }}
          BUCEPHALUS_MODAL_TOKEN_ID_SECRET_VERSION: ${{ vars.BUCEPHALUS_MODAL_TOKEN_ID_SECRET_VERSION || secrets.BUCEPHALUS_MODAL_TOKEN_ID_SECRET_VERSION }}
          BUCEPHALUS_MODAL_TOKEN_SECRET_SECRET_VERSION: ${{ vars.BUCEPHALUS_MODAL_TOKEN_SECRET_SECRET_VERSION || secrets.BUCEPHALUS_MODAL_TOKEN_SECRET_SECRET_VERSION }}
          BUCEPHALUS_MODAL_S3_BUCKET: ${{ vars.BUCEPHALUS_MODAL_S3_BUCKET }}
          BUCEPHALUS_MODAL_S3_PREFIX: ${{ vars.BUCEPHALUS_MODAL_S3_PREFIX }}
          BUCEPHALUS_MODAL_S3_ENDPOINT_URL: ${{ vars.BUCEPHALUS_MODAL_S3_ENDPOINT_URL }}
          BUCEPHALUS_MODAL_S3_REGION: ${{ vars.BUCEPHALUS_MODAL_S3_REGION }}
          BUCEPHALUS_MODAL_S3_SECRET_NAME: ${{ vars.BUCEPHALUS_MODAL_S3_SECRET_NAME || secrets.BUCEPHALUS_MODAL_S3_SECRET_NAME }}
          BUCEPHALUS_MODAL_S3_ACCESS_KEY_ID_SECRET_VERSION: ${{ vars.BUCEPHALUS_MODAL_S3_ACCESS_KEY_ID_SECRET_VERSION || secrets.BUCEPHALUS_MODAL_S3_ACCESS_KEY_ID_SECRET_VERSION }}
          BUCEPHALUS_MODAL_S3_SECRET_ACCESS_KEY_SECRET_VERSION: ${{ vars.BUCEPHALUS_MODAL_S3_SECRET_ACCESS_KEY_SECRET_VERSION || secrets.BUCEPHALUS_MODAL_S3_SECRET_ACCESS_KEY_SECRET_VERSION }}
          BUCEPHALUS_MODAL_S3_FORCE_PATH_STYLE: ${{ vars.BUCEPHALUS_MODAL_S3_FORCE_PATH_STYLE || 'false' }}
          BUCEPHALUS_MODAL_GCP_ARTIFACT_REGISTRY_SECRET_NAME: ${{ vars.BUCEPHALUS_MODAL_GCP_ARTIFACT_REGISTRY_SECRET_NAME || secrets.BUCEPHALUS_MODAL_GCP_ARTIFACT_REGISTRY_SECRET_NAME }}
          BUCEPHALUS_MODAL_GCP_ARTIFACT_REGISTRY_SERVICE_ACCOUNT_JSON_SECRET_VERSION: ${{ vars.BUCEPHALUS_MODAL_GCP_ARTIFACT_REGISTRY_SERVICE_ACCOUNT_JSON_SECRET_VERSION || secrets.BUCEPHALUS_MODAL_GCP_ARTIFACT_REGISTRY_SERVICE_ACCOUNT_JSON_SECRET_VERSION }}
        run: |
          missing=()
          for name in \
            BUCEPHALUS_TERRAFORM_BACKEND_BUCKET \
            BUCEPHALUS_TERRAFORM_BACKEND_PREFIX \
            BUCEPHALUS_GCP_PROJECT_ID \
            BUCEPHALUS_GCP_REGION \
            BUCEPHALUS_DEPLOYMENT_ENVIRONMENT \
            BUCEPHALUS_GCP_RESOURCE_PREFIX; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if [[ "${NEEDS_API_CONFIG}" == "true" && -z "${BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID}" ]]; then
            missing+=("BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID")
          fi
          if [[ "${NEEDS_POOL_CONFIG}" == "true" && -z "${BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID}" ]]; then
            missing+=("BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID")
          fi
          if (( ${#missing[@]} > 0 )); then
            printf 'missing GitHub Environment deploy config: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          {
            echo "BUCEPHALUS_TERRAFORM_BACKEND_BUCKET=${BUCEPHALUS_TERRAFORM_BACKEND_BUCKET}"
            echo "BUCEPHALUS_TERRAFORM_BACKEND_PREFIX=${BUCEPHALUS_TERRAFORM_BACKEND_PREFIX}"
            echo "BUCEPHALUS_GCP_PROJECT_ID=${BUCEPHALUS_GCP_PROJECT_ID}"
            echo "BUCEPHALUS_GCP_REGION=${BUCEPHALUS_GCP_REGION}"
            echo "BUCEPHALUS_DEPLOYMENT_ENVIRONMENT=${BUCEPHALUS_DEPLOYMENT_ENVIRONMENT}"
            echo "BUCEPHALUS_GCP_RESOURCE_PREFIX=${BUCEPHALUS_GCP_RESOURCE_PREFIX}"
            echo "BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID=${BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID}"
            echo "BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID=${BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID}"
            echo "BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION=${BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION}"
            echo "BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION=${BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION}"
            echo "BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION=${BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION}"
            echo "BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION=${BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION}"
            echo "BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION=${BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION}"
            echo "BUCEPHALUS_API_INGRESS=${BUCEPHALUS_API_INGRESS}"
            echo "BUCEPHALUS_MODAL_BACKEND_ENABLED=${BUCEPHALUS_MODAL_BACKEND_ENABLED}"
            echo "BUCEPHALUS_MODAL_APP_NAME=${BUCEPHALUS_MODAL_APP_NAME}"
            echo "BUCEPHALUS_MODAL_ENVIRONMENT=${BUCEPHALUS_MODAL_ENVIRONMENT}"
            echo "BUCEPHALUS_MODAL_TOKEN_ID_SECRET_VERSION=${BUCEPHALUS_MODAL_TOKEN_ID_SECRET_VERSION}"
            echo "BUCEPHALUS_MODAL_TOKEN_SECRET_SECRET_VERSION=${BUCEPHALUS_MODAL_TOKEN_SECRET_SECRET_VERSION}"
            echo "BUCEPHALUS_MODAL_S3_BUCKET=${BUCEPHALUS_MODAL_S3_BUCKET}"
            echo "BUCEPHALUS_MODAL_S3_PREFIX=${BUCEPHALUS_MODAL_S3_PREFIX}"
            echo "BUCEPHALUS_MODAL_S3_ENDPOINT_URL=${BUCEPHALUS_MODAL_S3_ENDPOINT_URL}"
            echo "BUCEPHALUS_MODAL_S3_REGION=${BUCEPHALUS_MODAL_S3_REGION}"
            echo "BUCEPHALUS_MODAL_S3_SECRET_NAME=${BUCEPHALUS_MODAL_S3_SECRET_NAME}"
            echo "BUCEPHALUS_MODAL_S3_ACCESS_KEY_ID_SECRET_VERSION=${BUCEPHALUS_MODAL_S3_ACCESS_KEY_ID_SECRET_VERSION}"
            echo "BUCEPHALUS_MODAL_S3_SECRET_ACCESS_KEY_SECRET_VERSION=${BUCEPHALUS_MODAL_S3_SECRET_ACCESS_KEY_SECRET_VERSION}"
            echo "BUCEPHALUS_MODAL_S3_FORCE_PATH_STYLE=${BUCEPHALUS_MODAL_S3_FORCE_PATH_STYLE}"
            echo "BUCEPHALUS_MODAL_GCP_ARTIFACT_REGISTRY_SECRET_NAME=${BUCEPHALUS_MODAL_GCP_ARTIFACT_REGISTRY_SECRET_NAME}"
            echo "BUCEPHALUS_MODAL_GCP_ARTIFACT_REGISTRY_SERVICE_ACCOUNT_JSON_SECRET_VERSION=${BUCEPHALUS_MODAL_GCP_ARTIFACT_REGISTRY_SERVICE_ACCOUNT_JSON_SECRET_VERSION}"
          } >> "${GITHUB_ENV}"

      - name: Resolve release promotion evidence
        id: resolved_release
        if: ${{ inputs.deployment_stage != 'substrate' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ -n "${RELEASE_VERSION}" ]]; then
            scripts/release/resolve-cloud-release-artifacts.sh \
              --version "${RELEASE_VERSION}" \
              --need promotion \
              --github-output "${GITHUB_OUTPUT}"
          else
            scripts/release/resolve-cloud-release-artifacts.sh \
              --latest \
              --need promotion \
              --github-output "${GITHUB_OUTPUT}"
          fi

      - name: Download pushed image promotion evidence
        if: ${{ inputs.deployment_stage != 'substrate' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resolved_release.outputs.promotion_artifact_name }}
          run-id: ${{ steps.resolved_release.outputs.promotion_run_id }}
          github-token: ${{ github.token }}
          path: dist/promotion

      - name: Locate and verify promotion evidence
        if: ${{ inputs.deployment_stage != 'substrate' }}
        run: |
          promotion_index="$(find dist/promotion -type f -name cloud-image-promotion-evidence.json | head -n 1)"
          if [[ -z "${promotion_index}" ]]; then
            echo "promotion evidence artifact is missing cloud-image-promotion-evidence.json" >&2
            exit 1
          fi
          promotion_dir="$(dirname "${promotion_index}")"
          for required in cloud-image-build-manifest.json cloud-image-build.provenance.json gcp-image-digests.tfvars; do
            if [[ ! -f "${promotion_dir}/${required}" ]]; then
              echo "promotion evidence artifact is missing ${required}" >&2
              exit 1
            fi
          done
          scripts/release/verify-cloud-image-promotion-evidence-index.sh "${promotion_index}"
          {
            echo "PROMOTION_DIR=${promotion_dir}"
            echo "PROMOTION_INDEX=${promotion_index}"
            echo "IMAGE_TFVARS=${promotion_dir}/gcp-image-digests.tfvars"
          } >> "${GITHUB_ENV}"

      - name: Resolve GCP CI/CD auth secret for deployment
        id: gcp_deploy_auth
        env:
          BUC_CI_CD: ${{ secrets.BUC_CI_CD }}
          BUCEPHALUS_GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.BUCEPHALUS_GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          BUCEPHALUS_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.BUCEPHALUS_GCP_DEPLOY_SERVICE_ACCOUNT }}
          BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          BUCEPHALUS_GCP_SERVICE_ACCOUNT: ${{ secrets.BUCEPHALUS_GCP_SERVICE_ACCOUNT }}
        run: scripts/deploy/resolve-gcp-cicd-secret.sh --mode deploy

      - name: Authenticate to Google Cloud for deployment
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.gcp_deploy_auth.outputs.workload_identity_provider }}
          service_account: ${{ steps.gcp_deploy_auth.outputs.service_account }}

      - name: Set up gcloud for deployment helpers
        if: ${{ inputs.deployment_stage != 'substrate' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"

      - name: Resolve deploy secret versions
        if: ${{ inputs.deployment_stage != 'substrate' }}
        run: |
          resolve_secret_version() {
            local env_name="$1"
            local secret_id="$2"
            local current="${!env_name:-}"
            if [[ -n "${current}" ]]; then
              if [[ ! "${current}" =~ ^[1-9][0-9]*$ ]]; then
                echo "${env_name} must be a numeric Secret Manager version; got '${current}'" >&2
                exit 1
              fi
              printf '%s=%s\n' "${env_name}" "${current}" >> "${GITHUB_ENV}"
              return
            fi
            local version
            version="$(gcloud secrets versions list "${secret_id}" \
              --project "${BUCEPHALUS_GCP_PROJECT_ID}" \
              --filter "state=enabled" \
              --sort-by "~createTime" \
              --limit 1 \
              --format "value(name)")"
            if [[ ! "${version}" =~ ^[1-9][0-9]*$ ]]; then
              echo "could not discover enabled Secret Manager version for ${secret_id}; set ${env_name} in the GitHub Environment" >&2
              exit 1
            fi
            printf '%s=%s\n' "${env_name}" "${version}" >> "${GITHUB_ENV}"
            echo "resolved ${env_name} from ${secret_id} version ${version}"
          }

          name_prefix="${BUCEPHALUS_GCP_RESOURCE_PREFIX}-${BUCEPHALUS_DEPLOYMENT_ENVIRONMENT}"
          resolve_secret_version BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION "${name_prefix}-api-database-url"
          resolve_secret_version BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION "${name_prefix}-migrator-database-url"
          resolve_secret_version BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION "${name_prefix}-worker-token"
          if [[ "${NEEDS_POOL_CONFIG}" == "true" ]]; then
            resolve_secret_version BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION "${name_prefix}-pool-provision-cmd-json"
            resolve_secret_version BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION "${name_prefix}-pool-reap-cmd-json"
          fi

      - name: Render deploy tfvars
        run: |
          scripts/deploy/write-gcp-deploy-tfvars.sh \
            --out "${RUNNER_TEMP}/gcp-deploy.tfvars" \
            --project-id "${BUCEPHALUS_GCP_PROJECT_ID}" \
            --region "${BUCEPHALUS_GCP_REGION}" \
            --environment "${BUCEPHALUS_DEPLOYMENT_ENVIRONMENT}" \
            --resource-prefix "${BUCEPHALUS_GCP_RESOURCE_PREFIX}" \
            --oauth-user-client-id "${BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID}" \
            --pool-controller-runner-pool-id "${BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID}" \
            --api-database-url-secret-version "${BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION}" \
            --migrator-database-url-secret-version "${BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION}" \
            --worker-token-secret-version "${BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION}" \
            --pool-controller-provision-cmd-json-secret-version "${BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION}" \
            --pool-controller-reap-cmd-json-secret-version "${BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION}" \
            --api-ingress "${BUCEPHALUS_API_INGRESS}" \
            --deploy-control-plane-services false \
            --deploy-api-services "${DEPLOY_API_SERVICES}" \
            --deploy-pool-controller "${DEPLOY_POOL_CONTROLLER}" \
            --modal-backend-enabled "${BUCEPHALUS_MODAL_BACKEND_ENABLED}" \
            --modal-app-name "${BUCEPHALUS_MODAL_APP_NAME}" \
            --modal-environment "${BUCEPHALUS_MODAL_ENVIRONMENT}" \
            --modal-token-id-secret-version "${BUCEPHALUS_MODAL_TOKEN_ID_SECRET_VERSION}" \
            --modal-token-secret-secret-version "${BUCEPHALUS_MODAL_TOKEN_SECRET_SECRET_VERSION}" \
            --modal-s3-bucket "${BUCEPHALUS_MODAL_S3_BUCKET}" \
            --modal-s3-prefix "${BUCEPHALUS_MODAL_S3_PREFIX}" \
            --modal-s3-endpoint-url "${BUCEPHALUS_MODAL_S3_ENDPOINT_URL}" \
            --modal-s3-region "${BUCEPHALUS_MODAL_S3_REGION}" \
            --modal-s3-secret-name "${BUCEPHALUS_MODAL_S3_SECRET_NAME}" \
            --modal-s3-access-key-id-secret-version "${BUCEPHALUS_MODAL_S3_ACCESS_KEY_ID_SECRET_VERSION}" \
            --modal-s3-secret-access-key-secret-version "${BUCEPHALUS_MODAL_S3_SECRET_ACCESS_KEY_SECRET_VERSION}" \
            --modal-s3-force-path-style "${BUCEPHALUS_MODAL_S3_FORCE_PATH_STYLE}" \
            --modal-gcp-artifact-registry-secret-name "${BUCEPHALUS_MODAL_GCP_ARTIFACT_REGISTRY_SECRET_NAME}" \
            --modal-gcp-artifact-registry-service-account-json-secret-version "${BUCEPHALUS_MODAL_GCP_ARTIFACT_REGISTRY_SERVICE_ACCOUNT_JSON_SECRET_VERSION}"

      - name: Terraform init
        working-directory: bucephalus-cloud/infra/gcp
        run: >-
          terraform init
          -backend-config="bucket=${BUCEPHALUS_TERRAFORM_BACKEND_BUCKET}"
          -backend-config="prefix=${BUCEPHALUS_TERRAFORM_BACKEND_PREFIX}"

      - name: Terraform validate
        working-directory: bucephalus-cloud/infra/gcp
        run: terraform validate

      - name: Terraform plan
        working-directory: bucephalus-cloud/infra/gcp
        env:
          DEPLOYMENT_STAGE: ${{ inputs.deployment_stage || 'pool' }}
        run: |
          args=(
            -input=false
            -var-file="${RUNNER_TEMP}/gcp-deploy.tfvars"
            -out="${RUNNER_TEMP}/bucephalus-gcp.tfplan"
          )
          if [[ "${DEPLOYMENT_STAGE}" != "substrate" ]]; then
            args+=(-var-file="${GITHUB_WORKSPACE}/${IMAGE_TFVARS}")
          else
            args+=(
              -target=google_project_service.required
              -target=google_service_account.api
              -target=google_service_account.pool_controller
              -target=google_service_account.migrator
              -target=google_service_account.runner
              -target=google_artifact_registry_repository.cloud
              -target=google_compute_network.control_plane
              -target=google_compute_subnetwork.control_plane
              -target=google_compute_subnetwork.serverless_connector
              -target=google_compute_router.control_plane
              -target=google_compute_router_nat.runner_egress
              -target=google_compute_global_address.private_service_range
              -target=google_service_networking_connection.private_services
              -target=google_vpc_access_connector.control_plane
              -target=google_sql_database_instance.primary
              -target=google_sql_database.cloud
              -target=google_secret_manager_secret.control_plane
              -target=google_secret_manager_secret_iam_member.control_plane_access
              -target=google_secret_manager_secret_iam_member.runner_worker_token_access
              -target=google_artifact_registry_repository_iam_member.runner_image_reader
              -target=google_project_iam_member.runner_artifact_registry_reader
              -target=google_project_iam_member.runner_log_writer
              -target=google_project_iam_member.runner_metric_writer
              -target=google_project_iam_member.pool_controller_instance_admin
              -target=google_service_account_iam_member.pool_controller_runner_service_account_user
            )
          fi
          if [[ "${DRIFT_CHECK}" == "true" ]]; then
            set +e
            terraform plan -detailed-exitcode "${args[@]}"
            plan_exit=$?
            set -e
            case "${plan_exit}" in
              0)
                echo "no drift: live infrastructure matches Terraform and the latest promotion evidence"
                ;;
              2)
                echo "DRIFT DETECTED: live infrastructure does not match Terraform + latest promotion evidence." >&2
                echo "Someone deployed around the pipeline (manual gcloud deploy or hand-pushed image)." >&2
                echo "Reconcile by running the GCP deploy workflow with apply, or revert the manual change." >&2
                exit 1
                ;;
              *)
                exit "${plan_exit}"
                ;;
            esac
          else
            terraform plan "${args[@]}"
          fi

      - name: Terraform apply
        if: ${{ inputs.apply }}
        working-directory: bucephalus-cloud/infra/gcp
        run: terraform apply -input=false -auto-approve "${RUNNER_TEMP}/bucephalus-gcp.tfplan"

      - name: Run migration job
        if: ${{ inputs.apply && inputs.deployment_stage == 'api' }}
        run: >-
          gcloud run jobs execute
          "${BUCEPHALUS_GCP_RESOURCE_PREFIX}-${BUCEPHALUS_DEPLOYMENT_ENVIRONMENT}-migrations"
          --project "${BUCEPHALUS_GCP_PROJECT_ID}"
          --region "${BUCEPHALUS_GCP_REGION}"
          --wait

      - name: Prepare worker image promotion
        if: ${{ inputs.apply && inputs.deployment_stage != 'substrate' }}
        env:
          PROMOTION_RUN_ID: ${{ steps.resolved_release.outputs.promotion_run_id }}
          PROMOTION_ARTIFACT_NAME: ${{ steps.resolved_release.outputs.promotion_artifact_name }}
        run: |
          evidence_uri="github-actions://${GITHUB_REPOSITORY}/runs/${PROMOTION_RUN_ID}/artifacts/${PROMOTION_ARTIFACT_NAME}"
          scripts/release/write-worker-image-promotion-env.sh \
            --manifest "${PROMOTION_DIR}/cloud-image-build-manifest.json" \
            --pool-id "${BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID}" \
            --evidence-uri "${evidence_uri}" \
            --github-env "${GITHUB_ENV}"

      - name: Promote active worker image
        if: ${{ inputs.apply && inputs.deployment_stage != 'substrate' }}
        run: |
          env_overrides="^|^BUCEPHALUS_PROMOTE_WORKER_POOL_ID=${BUCEPHALUS_PROMOTE_WORKER_POOL_ID}"
          env_overrides="${env_overrides}|BUCEPHALUS_PROMOTE_WORKER_IMAGE=${BUCEPHALUS_PROMOTE_WORKER_IMAGE}"
          env_overrides="${env_overrides}|BUCEPHALUS_PROMOTE_WORKER_RELEASE_VERSION=${BUCEPHALUS_PROMOTE_WORKER_RELEASE_VERSION}"
          env_overrides="${env_overrides}|BUCEPHALUS_PROMOTE_WORKER_RELEASE_GIT_SHA=${BUCEPHALUS_PROMOTE_WORKER_RELEASE_GIT_SHA}"
          env_overrides="${env_overrides}|BUCEPHALUS_PROMOTE_WORKER_EVIDENCE_URI=${BUCEPHALUS_PROMOTE_WORKER_EVIDENCE_URI}"
          env_overrides="${env_overrides}|BUCEPHALUS_PROMOTE_WORKER_EVIDENCE_SHA256=${BUCEPHALUS_PROMOTE_WORKER_EVIDENCE_SHA256}"
          env_overrides="${env_overrides}|BUCEPHALUS_PROMOTE_WORKER_BOUNDARY_VERIFIED_AT=${BUCEPHALUS_PROMOTE_WORKER_BOUNDARY_VERIFIED_AT}"
          env_overrides="${env_overrides}|BUCEPHALUS_PROMOTE_WORKER_METADATA_JSON=${BUCEPHALUS_PROMOTE_WORKER_METADATA_JSON}"
          gcloud run jobs execute \
            "${BUCEPHALUS_GCP_RESOURCE_PREFIX}-${BUCEPHALUS_DEPLOYMENT_ENVIRONMENT}-worker-image-promotion" \
            --project "${BUCEPHALUS_GCP_PROJECT_ID}" \
            --region "${BUCEPHALUS_GCP_REGION}" \
            --update-env-vars "${env_overrides}" \
            --wait

      - name: Smoke deployed API
        if: ${{ inputs.apply && inputs.deployment_stage != 'substrate' }}
        env:
          BUCEPHALUS_CLOUD_SMOKE_USER_TOKEN: ${{ secrets.BUCEPHALUS_CLOUD_SMOKE_USER_TOKEN }}
          BUCEPHALUS_WORKER_SMOKE: ${{ secrets.BUCEPHALUS_WORKER_SMOKE }}
        run: |
          if [[ -z "${BUCEPHALUS_WORKER_SMOKE}" ]]; then
            echo "apply deployments require BUCEPHALUS_WORKER_SMOKE for worker-route smoke checks" >&2
            exit 1
          fi
          terraform -chdir=bucephalus-cloud/infra/gcp output -json control_plane_services > "${RUNNER_TEMP}/control-plane-services.json"
          api_uri="$(bun -e 'const data = JSON.parse(await Bun.file(process.argv[1]).text()); console.log(data.api?.uri ?? "");' "${RUNNER_TEMP}/control-plane-services.json")"
          if [[ -z "${api_uri}" ]]; then
            echo "Terraform output control_plane_services.api.uri is empty" >&2
            exit 1
          fi
          readyz="$(curl -fsS "${api_uri}/readyz")"
          printf '%s\n' "${readyz}"
          expected_version="$(bun -e 'const m = JSON.parse(await Bun.file(process.argv[1]).text()); console.log(m.release?.version ?? "");' "${PROMOTION_DIR}/cloud-image-build-manifest.json")"
          deployed_version="$(printf '%s' "${readyz}" | bun -e 'const data = JSON.parse(await Bun.stdin.text()); console.log(data.release?.version ?? "");')"
          if [[ -n "${expected_version}" && "${deployed_version}" != "${expected_version}" ]]; then
            echo "deployed API reports release '${deployed_version}' but this deploy promoted '${expected_version}' — version skew" >&2
            exit 1
          fi
          curl -fsS -H "authorization: Bearer ${BUCEPHALUS_WORKER_SMOKE}" "${api_uri}/v1/runner-pools"
          if [[ -n "${BUCEPHALUS_CLOUD_SMOKE_USER_TOKEN}" ]]; then
            curl -fsS -H "authorization: Bearer ${BUCEPHALUS_CLOUD_SMOKE_USER_TOKEN}" "${api_uri}/v1/packages"
          else
            echo "skipping user-route smoke check; BUCEPHALUS_CLOUD_SMOKE_USER_TOKEN is not set"
          fi

      - name: Record deployment summary
        env:
          DEPLOYMENT_STAGE: ${{ inputs.deployment_stage || 'pool (drift check)' }}
          DEPLOY_APPLY: ${{ inputs.apply || false }}
          RELEASE_ARTIFACT: ${{ steps.resolved_release.outputs.promotion_artifact_name }}
          RELEASE_RUN_ID: ${{ steps.resolved_release.outputs.promotion_run_id }}
          RELEASE_VERSION_SUMMARY: ${{ inputs.release_version || 'latest' }}
        run: |
          {
            echo "### Bucephalus GCP deploy"
            echo ""
            echo "- Stage: \`${DEPLOYMENT_STAGE}\`"
            echo "- Applied: \`${DEPLOY_APPLY}\`"
            echo "- Environment: \`${BUCEPHALUS_DEPLOYMENT_ENVIRONMENT}\`"
            echo "- Release version: \`${RELEASE_VERSION_SUMMARY}\`"
            echo "- Promotion artifact: \`${RELEASE_ARTIFACT}\`"
            echo "- Release run: \`${RELEASE_RUN_ID}\`"
            echo "- Promotion evidence: \`${PROMOTION_INDEX}\`"
            echo "- Image tfvars: \`${IMAGE_TFVARS}\`"
            echo "- OAuth client ID: \`${BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
