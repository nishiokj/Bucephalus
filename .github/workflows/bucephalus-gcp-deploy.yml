name: Bucephalus GCP Deploy

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Bootstrap substrate, promote API/migrations, or promote pool-controller"
        required: true
        default: "substrate-plan"
        type: choice
        options:
          - substrate-plan
          - substrate-apply
          - api-plan
          - api-apply
          - pool-plan
          - pool-apply
      github_environment:
        description: "Deployment environment"
        required: true
        default: "bucephalus"
        type: choice
        options:
          - bucephalus
      release_version:
        description: "Advanced override; defaults to latest pushed Cloud image promotion evidence"
        required: false
        type: string
      release_artifact:
        description: "Release artifact to deploy"
        required: true
        default: "cloud-image-promotion-evidence-x86_64-linux"
        type: choice
        options:
          - cloud-image-promotion-evidence-x86_64-linux
          - cloud-image-promotion-evidence-from-release

run-name: >-
  GCP deploy ${{ inputs.terraform_action }} for ${{ inputs.github_environment }}
  from release ${{ inputs.release_version || 'latest' }}

permissions:
  contents: read
  actions: read
  id-token: none

jobs:
  deploy-gcp:
    name: Verify promotion evidence and deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Resolve GCP deploy config
        env:
          BUCEPHALUS_TERRAFORM_BACKEND_BUCKET: ${{ vars.BUCEPHALUS_TERRAFORM_BACKEND_BUCKET || 'gen-lang-client-0255842044-bucephalus-tfstate' }}
          BUCEPHALUS_TERRAFORM_BACKEND_PREFIX: ${{ vars.BUCEPHALUS_TERRAFORM_BACKEND_PREFIX || 'bucephalus/gcp' }}
          BUCEPHALUS_GCP_PROJECT_ID: ${{ vars.BUCEPHALUS_GCP_PROJECT_ID || 'gen-lang-client-0255842044' }}
          BUCEPHALUS_GCP_REGION: ${{ vars.BUCEPHALUS_GCP_REGION || 'us-central1' }}
          BUCEPHALUS_DEPLOYMENT_ENVIRONMENT: ${{ vars.BUCEPHALUS_DEPLOYMENT_ENVIRONMENT || inputs.github_environment }}
          BUCEPHALUS_GCP_RESOURCE_PREFIX: ${{ vars.BUCEPHALUS_GCP_RESOURCE_PREFIX || 'buc' }}
          BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID || vars.BUCEPHALUS_OAUTH_USER_CLIENT_ID || '380690977483-iekbab1cgtgv3ce1tjclh3bfs8o99rds.apps.googleusercontent.com' }}
          BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID: ${{ vars.BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID || secrets.BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID }}
          BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION: ${{ vars.BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION || secrets.BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION }}
          BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION: ${{ vars.BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION || secrets.BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION }}
          BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION: ${{ vars.BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION || secrets.BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION }}
          BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION: ${{ vars.BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION || secrets.BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION }}
          BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION: ${{ vars.BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION || secrets.BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION }}
          BUCEPHALUS_API_INGRESS: ${{ vars.BUCEPHALUS_API_INGRESS || 'INGRESS_TRAFFIC_ALL' }}
        run: |
          case "${{ inputs.terraform_action }}" in
            substrate-plan|substrate-apply) needs_api_config="false"; needs_pool_config="false" ;;
            api-plan|api-apply) needs_api_config="true"; needs_pool_config="false" ;;
            pool-plan|pool-apply) needs_api_config="true"; needs_pool_config="true" ;;
            *)
              echo "unsupported terraform_action: ${{ inputs.terraform_action }}" >&2
              exit 2
              ;;
          esac

          missing=()
          for name in \
            BUCEPHALUS_TERRAFORM_BACKEND_BUCKET \
            BUCEPHALUS_TERRAFORM_BACKEND_PREFIX \
            BUCEPHALUS_GCP_PROJECT_ID \
            BUCEPHALUS_GCP_REGION \
            BUCEPHALUS_DEPLOYMENT_ENVIRONMENT \
            BUCEPHALUS_GCP_RESOURCE_PREFIX; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if [[ "${needs_api_config}" == "true" ]]; then
            for name in \
              BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID; do
              if [[ -z "${!name}" ]]; then
                missing+=("${name}")
              fi
            done
          fi
          if [[ "${needs_pool_config}" == "true" ]]; then
            for name in \
              BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID; do
              if [[ -z "${!name}" ]]; then
                missing+=("${name}")
              fi
            done
          fi
          if (( ${#missing[@]} > 0 )); then
            printf 'missing GitHub Environment deploy config: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          {
            echo "BUCEPHALUS_TERRAFORM_BACKEND_BUCKET=${BUCEPHALUS_TERRAFORM_BACKEND_BUCKET}"
            echo "BUCEPHALUS_TERRAFORM_BACKEND_PREFIX=${BUCEPHALUS_TERRAFORM_BACKEND_PREFIX}"
            echo "BUCEPHALUS_GCP_PROJECT_ID=${BUCEPHALUS_GCP_PROJECT_ID}"
            echo "BUCEPHALUS_GCP_REGION=${BUCEPHALUS_GCP_REGION}"
            echo "BUCEPHALUS_DEPLOYMENT_ENVIRONMENT=${BUCEPHALUS_DEPLOYMENT_ENVIRONMENT}"
            echo "BUCEPHALUS_GCP_RESOURCE_PREFIX=${BUCEPHALUS_GCP_RESOURCE_PREFIX}"
            echo "BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID=${BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID}"
            echo "BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID=${BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID}"
            echo "BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION=${BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION}"
            echo "BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION=${BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION}"
            echo "BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION=${BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION}"
            echo "BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION=${BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION}"
            echo "BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION=${BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION}"
            echo "BUCEPHALUS_API_INGRESS=${BUCEPHALUS_API_INGRESS}"
          } >> "${GITHUB_ENV}"

      - name: Resolve release promotion evidence
        id: resolved_release
        if: ${{ inputs.terraform_action == 'api-plan' || inputs.terraform_action == 'api-apply' || inputs.terraform_action == 'pool-plan' || inputs.terraform_action == 'pool-apply' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ inputs.release_artifact }}" in
            cloud-image-promotion-evidence-x86_64-linux|cloud-image-promotion-evidence-from-release) ;;
            *)
              echo "unsupported deploy artifact: ${{ inputs.release_artifact }}" >&2
              exit 2
              ;;
          esac
          if [[ -n "${{ inputs.release_version }}" ]]; then
            scripts/release/resolve-cloud-release-artifacts.sh \
              --version "${{ inputs.release_version }}" \
              --need promotion \
              --promotion-artifact "${{ inputs.release_artifact }}" \
              --github-output "${GITHUB_OUTPUT}"
          else
            scripts/release/resolve-cloud-release-artifacts.sh \
              --latest \
              --need promotion \
              --promotion-artifact "${{ inputs.release_artifact }}" \
              --github-output "${GITHUB_OUTPUT}"
          fi

      - name: Validate digest promotion inputs
        if: ${{ inputs.terraform_action == 'api-plan' || inputs.terraform_action == 'api-apply' || inputs.terraform_action == 'pool-plan' || inputs.terraform_action == 'pool-apply' }}
        run: |
          if [[ -z "${{ steps.resolved_release.outputs.promotion_run_id }}" ]]; then
            echo "promotion evidence could not be resolved; build and push Cloud images first, or set release_version" >&2
            exit 1
          fi
          if [[ -z "${{ steps.resolved_release.outputs.promotion_artifact_name }}" ]]; then
            echo "promotion artifact could not be resolved for digest promotion" >&2
            exit 1
          fi

      - name: Download pushed image promotion evidence
        if: ${{ inputs.terraform_action == 'api-plan' || inputs.terraform_action == 'api-apply' || inputs.terraform_action == 'pool-plan' || inputs.terraform_action == 'pool-apply' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resolved_release.outputs.promotion_artifact_name }}
          run-id: ${{ steps.resolved_release.outputs.promotion_run_id }}
          github-token: ${{ github.token }}
          path: dist/promotion

      - name: Locate and verify promotion evidence
        if: ${{ inputs.terraform_action == 'api-plan' || inputs.terraform_action == 'api-apply' || inputs.terraform_action == 'pool-plan' || inputs.terraform_action == 'pool-apply' }}
        run: |
          promotion_index="$(find dist/promotion -type f -name cloud-image-promotion-evidence.json | head -n 1)"
          if [[ -z "${promotion_index}" ]]; then
            echo "promotion evidence artifact is missing cloud-image-promotion-evidence.json" >&2
            exit 1
          fi
          promotion_dir="$(dirname "${promotion_index}")"
          for required in cloud-image-build-manifest.json cloud-image-build.provenance.json gcp-image-digests.tfvars; do
            if [[ ! -f "${promotion_dir}/${required}" ]]; then
              echo "promotion evidence artifact is missing ${required}" >&2
              exit 1
            fi
          done
          scripts/release/verify-cloud-image-promotion-evidence-index.sh "${promotion_index}"
          {
            echo "PROMOTION_DIR=${promotion_dir}"
            echo "PROMOTION_INDEX=${promotion_index}"
            echo "IMAGE_TFVARS=${promotion_dir}/gcp-image-digests.tfvars"
          } >> "${GITHUB_ENV}"

      - name: Resolve GCP CI/CD auth secret for deployment
        id: gcp_deploy_auth
        env:
          BUC_CI_CD: ${{ secrets.BUC_CI_CD }}
          BUCEPHALUS_GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.BUCEPHALUS_GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          BUCEPHALUS_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.BUCEPHALUS_GCP_DEPLOY_SERVICE_ACCOUNT }}
          BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          BUCEPHALUS_GCP_SERVICE_ACCOUNT: ${{ secrets.BUCEPHALUS_GCP_SERVICE_ACCOUNT }}
        run: scripts/deploy/resolve-gcp-cicd-secret.sh --mode deploy

      - name: Authenticate to Google Cloud for deployment
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.gcp_deploy_auth.outputs.workload_identity_provider }}
          service_account: ${{ steps.gcp_deploy_auth.outputs.service_account }}

      - name: Set up gcloud for deployment helpers
        if: ${{ inputs.terraform_action == 'api-plan' || inputs.terraform_action == 'api-apply' || inputs.terraform_action == 'pool-plan' || inputs.terraform_action == 'pool-apply' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"

      - name: Resolve deploy secret versions
        if: ${{ inputs.terraform_action == 'api-plan' || inputs.terraform_action == 'api-apply' || inputs.terraform_action == 'pool-plan' || inputs.terraform_action == 'pool-apply' }}
        run: |
          resolve_secret_version() {
            local env_name="$1"
            local secret_id="$2"
            local current="${!env_name:-}"
            if [[ -n "${current}" ]]; then
              if [[ ! "${current}" =~ ^[1-9][0-9]*$ ]]; then
                echo "${env_name} must be a numeric Secret Manager version; got '${current}'" >&2
                exit 1
              fi
              printf '%s=%s\n' "${env_name}" "${current}" >> "${GITHUB_ENV}"
              return
            fi
            local version
            version="$(gcloud secrets versions list "${secret_id}" \
              --project "${BUCEPHALUS_GCP_PROJECT_ID}" \
              --filter "state=enabled" \
              --sort-by "~createTime" \
              --limit 1 \
              --format "value(name)")"
            if [[ ! "${version}" =~ ^[1-9][0-9]*$ ]]; then
              echo "could not discover enabled Secret Manager version for ${secret_id}; set ${env_name} in the GitHub Environment" >&2
              exit 1
            fi
            printf '%s=%s\n' "${env_name}" "${version}" >> "${GITHUB_ENV}"
            echo "resolved ${env_name} from ${secret_id} version ${version}"
          }

          name_prefix="${BUCEPHALUS_GCP_RESOURCE_PREFIX}-${BUCEPHALUS_DEPLOYMENT_ENVIRONMENT}"
          case "${{ inputs.terraform_action }}" in
            api-plan|api-apply|pool-plan|pool-apply)
              resolve_secret_version BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION "${name_prefix}-api-database-url"
              resolve_secret_version BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION "${name_prefix}-migrator-database-url"
              resolve_secret_version BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION "${name_prefix}-worker-token"
              ;;
          esac
          case "${{ inputs.terraform_action }}" in
            pool-plan|pool-apply)
              resolve_secret_version BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION "${name_prefix}-pool-provision-cmd-json"
              resolve_secret_version BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION "${name_prefix}-pool-reap-cmd-json"
              ;;
          esac

      - name: Render deploy tfvars
        run: |
          deploy_control_plane_services="false"
          deploy_api_services="false"
          deploy_pool_controller="false"
          case "${{ inputs.terraform_action }}" in
            substrate-*) ;;
            api-*) deploy_api_services="true" ;;
            pool-*)
              deploy_api_services="true"
              deploy_pool_controller="true"
              ;;
            *)
              echo "unsupported terraform_action: ${{ inputs.terraform_action }}" >&2
              exit 2
              ;;
          esac
          scripts/deploy/write-gcp-deploy-tfvars.sh \
            --out "${RUNNER_TEMP}/gcp-deploy.tfvars" \
            --project-id "${BUCEPHALUS_GCP_PROJECT_ID}" \
            --region "${BUCEPHALUS_GCP_REGION}" \
            --environment "${BUCEPHALUS_DEPLOYMENT_ENVIRONMENT}" \
            --resource-prefix "${BUCEPHALUS_GCP_RESOURCE_PREFIX}" \
            --oauth-user-client-id "${BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID}" \
            --pool-controller-runner-pool-id "${BUCEPHALUS_POOL_CONTROLLER_RUNNER_POOL_ID}" \
            --api-database-url-secret-version "${BUCEPHALUS_API_DATABASE_URL_SECRET_VERSION}" \
            --migrator-database-url-secret-version "${BUCEPHALUS_MIGRATOR_DATABASE_URL_SECRET_VERSION}" \
            --worker-token-secret-version "${BUCEPHALUS_WORKER_TOKEN_SECRET_VERSION}" \
            --pool-controller-provision-cmd-json-secret-version "${BUCEPHALUS_POOL_CONTROLLER_PROVISION_CMD_JSON_SECRET_VERSION}" \
            --pool-controller-reap-cmd-json-secret-version "${BUCEPHALUS_POOL_CONTROLLER_REAP_CMD_JSON_SECRET_VERSION}" \
            --api-ingress "${BUCEPHALUS_API_INGRESS}" \
            --deploy-control-plane-services "${deploy_control_plane_services}" \
            --deploy-api-services "${deploy_api_services}" \
            --deploy-pool-controller "${deploy_pool_controller}"

      - name: Terraform init
        working-directory: bucephalus-cloud/infra/gcp
        run: >-
          terraform init
          -backend-config="bucket=${BUCEPHALUS_TERRAFORM_BACKEND_BUCKET}"
          -backend-config="prefix=${BUCEPHALUS_TERRAFORM_BACKEND_PREFIX}"

      - name: Terraform validate
        working-directory: bucephalus-cloud/infra/gcp
        run: terraform validate

      - name: Terraform plan selected action
        if: ${{ inputs.terraform_action == 'substrate-plan' || inputs.terraform_action == 'substrate-apply' || inputs.terraform_action == 'api-plan' || inputs.terraform_action == 'pool-plan' }}
        working-directory: bucephalus-cloud/infra/gcp
        run: |
          args=(
            -input=false
            -var-file="${RUNNER_TEMP}/gcp-deploy.tfvars"
            -out="${RUNNER_TEMP}/bucephalus-gcp.tfplan"
          )
          if [[ "${{ inputs.terraform_action }}" == "api-plan" || "${{ inputs.terraform_action }}" == "api-apply" || "${{ inputs.terraform_action }}" == "pool-plan" || "${{ inputs.terraform_action }}" == "pool-apply" ]]; then
            args+=(-var-file="${GITHUB_WORKSPACE}/${IMAGE_TFVARS}")
          fi
          terraform plan "${args[@]}"

      - name: Terraform apply substrate
        if: ${{ inputs.terraform_action == 'substrate-apply' }}
        working-directory: bucephalus-cloud/infra/gcp
        run: terraform apply -input=false -auto-approve "${RUNNER_TEMP}/bucephalus-gcp.tfplan"

      - name: Terraform apply migration job revision
        if: ${{ inputs.terraform_action == 'api-apply' }}
        working-directory: bucephalus-cloud/infra/gcp
        run: >-
          terraform apply
          -input=false
          -auto-approve
          -target=google_cloud_run_v2_job.migrations
          -var-file="${RUNNER_TEMP}/gcp-deploy.tfvars"
          -var-file="${GITHUB_WORKSPACE}/${IMAGE_TFVARS}"

      - name: Run migration job
        if: ${{ inputs.terraform_action == 'api-apply' }}
        run: >-
          gcloud run jobs execute
          "${BUCEPHALUS_GCP_RESOURCE_PREFIX}-${BUCEPHALUS_DEPLOYMENT_ENVIRONMENT}-migrations"
          --project "${BUCEPHALUS_GCP_PROJECT_ID}"
          --region "${BUCEPHALUS_GCP_REGION}"
          --wait

      - name: Terraform apply selected digest promotion
        if: ${{ inputs.terraform_action == 'api-apply' || inputs.terraform_action == 'pool-apply' }}
        working-directory: bucephalus-cloud/infra/gcp
        run: >-
          terraform apply
          -input=false
          -auto-approve
          -var-file="${RUNNER_TEMP}/gcp-deploy.tfvars"
          -var-file="${GITHUB_WORKSPACE}/${IMAGE_TFVARS}"

      - name: Smoke deployed API
        if: ${{ inputs.terraform_action == 'api-apply' || inputs.terraform_action == 'pool-apply' }}
        env:
          BUCEPHALUS_CLOUD_SMOKE_USER_TOKEN: ${{ secrets.BUCEPHALUS_CLOUD_SMOKE_USER_TOKEN }}
          BUCEPHALUS_WORKER_SMOKE: ${{ secrets.BUCEPHALUS_WORKER_SMOKE }}
        run: |
          if [[ -z "${BUCEPHALUS_WORKER_SMOKE}" ]]; then
            echo "apply deployments require BUCEPHALUS_WORKER_SMOKE for worker-route smoke checks" >&2
            exit 1
          fi
          terraform -chdir=bucephalus-cloud/infra/gcp output -json control_plane_services > "${RUNNER_TEMP}/control-plane-services.json"
          api_uri="$(bun -e 'const data = JSON.parse(await Bun.file(process.argv[1]).text()); console.log(data.api.uri);' "${RUNNER_TEMP}/control-plane-services.json")"
          curl -fsS "${api_uri}/readyz"
          curl -fsS -H "authorization: Bearer ${BUCEPHALUS_WORKER_SMOKE}" "${api_uri}/v1/runner-pools"
          if [[ -n "${BUCEPHALUS_CLOUD_SMOKE_USER_TOKEN}" ]]; then
            curl -fsS -H "authorization: Bearer ${BUCEPHALUS_CLOUD_SMOKE_USER_TOKEN}" "${api_uri}/v1/packages"
          else
            echo "skipping user-route smoke check; BUCEPHALUS_CLOUD_SMOKE_USER_TOKEN is not set"
          fi

      - name: Record promotion summary
        run: |
          {
            echo "### Bucephalus GCP deploy"
            echo ""
            echo "- Terraform action: \`${{ inputs.terraform_action }}\`"
            echo "- Environment: \`${BUCEPHALUS_DEPLOYMENT_ENVIRONMENT}\`"
            echo "- Release version: \`${{ inputs.release_version || 'advanced override' }}\`"
            echo "- Release artifact: \`${{ inputs.release_artifact }}\`"
            echo "- Release run: \`${{ steps.resolved_release.outputs.promotion_run_id }}\`"
            echo "- Promotion evidence: \`${PROMOTION_INDEX}\`"
            echo "- Image tfvars: \`${IMAGE_TFVARS}\`"
            echo "- OAuth client ID: \`${BUCEPHALUS_GOOGLE_OAUTH_CLIENT_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
