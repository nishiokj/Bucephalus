name: Bucephalus Cloud UI Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Cloud UI asset version, for example 0.3.1 or 0.3.1-ui.1"
        required: true
        type: string

run-name: Cloud UI assets ${{ inputs.version }}

permissions:
  contents: read
  id-token: none

jobs:
  build-cloud-ui-assets:
    name: Build Cloud UI assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Cloud dependencies
        working-directory: bucephalus-cloud
        run: bun install --frozen-lockfile

      - name: Build Cloud UI assets
        run: >-
          scripts/release/build-cloud-ui-assets.sh
          --version "${{ inputs.version }}"
          --out "dist/releases/cloud-ui-${{ inputs.version }}"

      - name: Verify Cloud UI assets
        run: scripts/release/verify-cloud-ui-assets.sh "dist/releases/cloud-ui-${{ inputs.version }}"

      - name: Upload Cloud UI assets
        uses: actions/upload-artifact@v4
        with:
          name: cloud-ui-assets-${{ inputs.version }}
          path: dist/releases/cloud-ui-${{ inputs.version }}
          if-no-files-found: error
          retention-days: 30
