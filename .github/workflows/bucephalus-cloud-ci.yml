      - ".github/workflows/bucephalus-gcp-cleanup.yml"
      - ".github/workflows/bucephalus-gcp-deploy.yml"
      - ".github/workflows/bucephalus-cloud-candidate.yml"
      - ".github/workflows/bucephalus-cloud-promote.yml"
      - ".github/workflows/bucephalus-release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "docs/specs/CLOUD_DEPLOYMENT_GOAL_STATE.md"
      - "docs/specs/CLOUD_PATH2_ARTIFACT_IMAGE_CI_READINESS.md"
      - "docs/specs/CLOUD_PATH2_SIGNING_POLICY.json"
      - "modal-launcher/**"
      - "rust/**"
      - "schemas/**"
      - "bucephalus-cloud/**"
      - "bucephalus-cloud/infra/gcp/**"
      - "scripts/ci/cloud-gates.sh"
      - "scripts/ci/classify-cloud-candidate-change.sh"
      - "scripts/ci/smoke-buc-hosted-workflow.sh"
      - "scripts/ci/smoke-hosted-authoring-real-core.sh"
      - "scripts/ci/verify-cloud-release-boundary.sh"
      - "scripts/deploy/**"
      - "scripts/release/build-buc-release.sh"
      - "scripts/release/build-cloud-images.sh"
      - "scripts/release/build-core-release.sh"
      - "scripts/release/configure-gcp-artifact-registry-auth.sh"
      - "scripts/release/verify-core-release.sh"
      - "scripts/release/verify-core-release-provenance.sh"
      - "scripts/release/verify-release-asset-index.sh"
      - "scripts/release/verify-buc-release.sh"
      - "scripts/release/verify-cloud-base-image-policy.sh"
      - "scripts/release/verify-cloud-image-build-manifest.sh"
      - "scripts/release/verify-cloud-image-boundary.sh"
      - "scripts/release/verify-cloud-image-publish-inputs.sh"
      - "scripts/release/verify-cloud-image-promotion-evidence-index.sh"
      - "scripts/release/verify-cloud-release-provenance.sh"
      - "scripts/release/verify-cloud-registry-auth-boundary.sh"
      - "scripts/release/verify-cloud-signing-policy.sh"
      - "scripts/release/verify-gcp-image-promotion-evidence.sh"
      - "scripts/release/verify-gcp-image-tfvars.sh"
      - "scripts/release/write-cloud-image-promotion-evidence-index.sh"
      - "scripts/release/write-cloud-release-provenance.sh"
      - "scripts/release/write-core-release-provenance.sh"
      - "scripts/release/write-release-asset-index.sh"
      - "scripts/release/write-gcp-image-tfvars.sh"
      - "scripts/install.sh"
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/bucephalus-cloud-ci.yml"
      - ".github/workflows/bucephalus-gcp-cleanup.yml"
      - ".github/workflows/bucephalus-gcp-deploy.yml"
      - ".github/workflows/bucephalus-cloud-candidate.yml"
      - ".github/workflows/bucephalus-cloud-promote.yml"
      - ".github/workflows/bucephalus-release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "docs/specs/CLOUD_DEPLOYMENT_GOAL_STATE.md"
      - "docs/specs/CLOUD_PATH2_ARTIFACT_IMAGE_CI_READINESS.md"
      - "docs/specs/CLOUD_PATH2_SIGNING_POLICY.json"
      - "modal-launcher/**"
      - "rust/**"
      - "schemas/**"
      - "bucephalus-cloud/**"
      - "bucephalus-cloud/infra/gcp/**"
      - "scripts/ci/cloud-gates.sh"
      - "scripts/ci/classify-cloud-candidate-change.sh"
      - "scripts/ci/smoke-buc-hosted-workflow.sh"
      - "scripts/ci/smoke-hosted-authoring-real-core.sh"
      - "scripts/ci/verify-cloud-release-boundary.sh"
      - "scripts/deploy/**"
      - "scripts/release/build-buc-release.sh"
      - "scripts/release/build-cloud-images.sh"
      - "scripts/release/build-core-release.sh"
      - "scripts/release/configure-gcp-artifact-registry-auth.sh"
      - "scripts/release/verify-core-release.sh"
      - "scripts/release/verify-core-release-provenance.sh"
      - "scripts/release/verify-release-asset-index.sh"
      - "scripts/release/verify-buc-release.sh"
      - "scripts/release/verify-cloud-base-image-policy.sh"
      - "scripts/release/verify-cloud-image-build-manifest.sh"
      - "scripts/release/verify-cloud-image-boundary.sh"
      - "scripts/release/verify-cloud-image-publish-inputs.sh"
      - "scripts/release/verify-cloud-image-promotion-evidence-index.sh"
      - "scripts/release/verify-cloud-release-provenance.sh"
      - "scripts/release/verify-cloud-registry-auth-boundary.sh"
      - "scripts/release/verify-cloud-signing-policy.sh"
      - "scripts/release/verify-gcp-image-promotion-evidence.sh"
      - "scripts/release/verify-gcp-image-tfvars.sh"
      - "scripts/release/write-cloud-image-promotion-evidence-index.sh"
      - "scripts/release/write-cloud-release-provenance.sh"
      - "scripts/release/write-core-release-provenance.sh"
      - "scripts/release/write-release-asset-index.sh"
      - "scripts/release/write-gcp-image-tfvars.sh"
      - "scripts/install.sh"
  workflow_dispatch:

jobs:
  cloud-candidate-source:
    name: Cloud candidate source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write Cloud candidate source metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          candidate_sha="${GITHUB_SHA_VALUE}"
          base_sha=""

          case "${EVENT_NAME}" in
            push)
              if [[ -n "${PUSH_BEFORE_SHA}" && ! "${PUSH_BEFORE_SHA}" =~ ^0{40}$ ]]; then
                base_sha="${PUSH_BEFORE_SHA}"
              fi
              ;;
            pull_request)
              candidate_sha="${PR_HEAD_SHA:-${GITHUB_SHA_VALUE}}"
              base_sha="${PR_BASE_SHA}"
              ;;
          esac

          if [[ ! "${candidate_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha is not a full git SHA: ${candidate_sha}" >&2
            exit 2
          fi
          if [[ -n "${base_sha}" && ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "base_sha is not a full git SHA: ${base_sha}" >&2
            exit 2
          fi

          mkdir -p dist/cloud-candidate-source
          {
            echo "event_name=${EVENT_NAME}"
            echo "candidate_sha=${candidate_sha}"
            echo "base_sha=${base_sha}"
          } > dist/cloud-candidate-source/cloud-candidate-source.txt

      - name: Upload Cloud candidate source metadata
        uses: actions/upload-artifact@v4
        with:
          name: cloud-candidate-source
          path: dist/cloud-candidate-source/cloud-candidate-source.txt
          if-no-files-found: error
          retention-days: 7

  release-boundary-policy:
    name: Release boundary policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Cloud dependencies
        run: bun install --frozen-lockfile
        working-directory: bucephalus-cloud

      - name: Verify release boundary policy
        run: scripts/ci/verify-cloud-release-boundary.sh

      - name: Verify signing policy
        run: scripts/release/verify-cloud-signing-policy.sh

  cloud-gates:
    name: Cloud/Core gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bucephalus
          POSTGRES_PASSWORD: bucephalus_dev
          POSTGRES_DB: bucephalus_cloud
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U bucephalus -d bucephalus_cloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://bucephalus:bucephalus_dev@127.0.0.1:55432/bucephalus_cloud
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Run Cloud/Core gates
        run: scripts/ci/cloud-gates.sh
