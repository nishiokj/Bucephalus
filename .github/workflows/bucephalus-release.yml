name: Bucephalus Release Artifact

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Advanced override; defaults to the pushed v* tag or Cargo.toml package version"
        required: false
        default: ""
        type: string
      build_images:
        description: "Also build and inspect Cloud images from the verified Linux x86_64 release bundle"
        required: false
        default: false
        type: boolean
      push_images:
        description: "Push Cloud images and record immutable digest refs; requires build_images and registry auth"
        required: false
        default: false
        type: boolean
      build_public_core_artifacts:
        description: "Also build macOS public core release artifacts during a manual run"
        required: false
        default: false
        type: boolean
      ui_only:
        description: "Only build Cloud UI assets; deploy through the standalone Cloudflare UI deploy workflow"
        required: false
        default: false
        type: boolean
      source_release_version:
        description: "Release version to republish images from"
        required: false
        default: ""
        type: string
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read
  actions: read
  id-token: none

env:
  BUCEPHALUS_IMAGE_REPOSITORY: ${{ vars.BUCEPHALUS_IMAGE_REPOSITORY || 'us-central1-docker.pkg.dev/gen-lang-client-0255842044/buc-bucephalus-cloud/bucephalus-cloud' }}
  BUCEPHALUS_BUN_BASE_IMAGE: ${{ vars.BUCEPHALUS_BUN_BASE_IMAGE || 'oven/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4' }}

jobs:
  release-gates:
    name: Release gates
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.ui_only && inputs.source_release_version == '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bucephalus
          POSTGRES_PASSWORD: bucephalus_dev
          POSTGRES_DB: bucephalus_cloud
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U bucephalus -d bucephalus_cloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://bucephalus:bucephalus_dev@localhost:55432/bucephalus_cloud
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve GCP CI/CD auth secret
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_images }}
        env:
          BUC_CI_CD: ${{ secrets.BUC_CI_CD }}
          BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          BUCEPHALUS_GCP_SERVICE_ACCOUNT: ${{ secrets.BUCEPHALUS_GCP_SERVICE_ACCOUNT }}
        run: scripts/deploy/resolve-gcp-cicd-secret.sh --mode publish

      - name: Validate image build inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "${{ inputs.push_images }}" == "true" && "${{ inputs.build_images }}" != "true" ]]; then
            echo "push_images requires build_images=true" >&2
            exit 1
          fi
          if [[ "${{ inputs.build_images }}" == "true" && -z "${BUCEPHALUS_BUN_BASE_IMAGE}" ]]; then
            echo "build_images requires BUCEPHALUS_BUN_BASE_IMAGE" >&2
            exit 1
          fi
          if [[ "${{ inputs.build_images }}" == "true" && "${BUCEPHALUS_BUN_BASE_IMAGE}" != *@sha256:* ]]; then
            echo "BUCEPHALUS_BUN_BASE_IMAGE must be digest-addressed" >&2
            exit 1
          fi
          args=(
            --repository "${BUCEPHALUS_IMAGE_REPOSITORY}"
            --base-image "${BUCEPHALUS_BUN_BASE_IMAGE}"
          )
          if [[ "${{ inputs.push_images }}" == "true" ]]; then
            args+=(--push)
          fi
          if [[ "${{ inputs.build_images }}" == "true" ]]; then
            scripts/release/verify-cloud-image-publish-inputs.sh "${args[@]}"
            base_policy_args=(--base-image "${BUCEPHALUS_BUN_BASE_IMAGE}")
            if [[ "${{ inputs.push_images }}" == "true" ]]; then
              base_policy_args+=(--push)
            fi
            scripts/release/verify-cloud-base-image-policy.sh "${base_policy_args[@]}"
            registry_auth_args=(--repository "${BUCEPHALUS_IMAGE_REPOSITORY}")
            if [[ "${{ inputs.push_images }}" == "true" ]]; then
              registry_auth_args+=(--push)
            fi
            scripts/release/verify-cloud-registry-auth-boundary.sh "${registry_auth_args[@]}"
          fi

      - name: Run release gates
        run: scripts/ci/cloud-gates.sh

  build-cloud-ui-assets:
    name: Build Cloud UI assets
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_release_version == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Cloud dependencies
        working-directory: bucephalus-cloud
        run: bun install --frozen-lockfile

      - name: Restore Cloud UI dist cache
        id: cloud_ui_dist_cache
        uses: actions/cache@v4
        with:
          path: bucephalus-cloud/web/dist
          key: ${{ runner.os }}-bun-1.3.14-cloud-ui-dist-${{ hashFiles('scripts/release/build-cloud-ui-assets.sh', 'bucephalus-cloud/package.json', 'bucephalus-cloud/bun.lock', 'bucephalus-cloud/tsconfig*.json', 'bucephalus-cloud/web/**') }}

      - name: Resolve version
        id: version
        run: |
          scripts/release/resolve-release-version.sh \
            --override "${{ inputs.version_override }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build Cloud UI assets
        run: |
          args=(
            --version "${{ steps.version.outputs.version }}"
            --out "dist/releases/cloud-ui-${{ steps.version.outputs.version }}"
          )
          if [[ "${{ steps.cloud_ui_dist_cache.outputs.cache-hit }}" == "true" ]]; then
            args+=(--skip-build)
          fi
          scripts/release/build-cloud-ui-assets.sh "${args[@]}"

      - name: Verify Cloud UI assets
        run: scripts/release/verify-cloud-ui-assets.sh "dist/releases/cloud-ui-${{ steps.version.outputs.version }}"

      - name: Upload Cloud UI assets
        uses: actions/upload-artifact@v4
        with:
          name: cloud-ui-assets-${{ steps.version.outputs.version }}
          path: dist/releases/cloud-ui-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 30

  build-linux-release:
    name: Build Linux core and Cloud release (${{ matrix.target }})
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.ui_only && inputs.source_release_version == '') }}
    needs: release-gates
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            apt_packages: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            apt_packages: "gcc-aarch64-linux-gnu"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve Rust compiler cache key
        id: rustc
        run: |
          echo "version=$(rustc -Vv | sed -n 's/^release: //p')" >> "${GITHUB_OUTPUT}"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: modal-launcher/go.sum

      - name: Clean restored Rust target artifacts
        run: cargo clean --manifest-path Cargo.toml

      - name: Install cross linker
        if: ${{ matrix.apt_packages != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Resolve version
        id: version
        run: |
          scripts/release/resolve-release-version.sh \
            --override "${{ inputs.version_override }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Restore worker runner binary cache
        id: worker_runner_cache
        uses: actions/cache@v4
        with:
          path: target/${{ matrix.target }}/release/bucephalus-worker-runner
          key: ${{ runner.os }}-${{ steps.rustc.outputs.version }}-worker-runner-${{ matrix.target }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust/.cargo/config.toml', 'rust/crates/**/Cargo.toml', 'rust/crates/**/*.rs', 'rust/crates/**/*.sql', 'schemas/**') }}

      - name: Build Rust release binaries for Cloud bundle
        if: ${{ steps.worker_runner_cache.outputs.cache-hit != 'true' }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          AR_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-ar' || '' }}
        run: >-
          cargo build
          --manifest-path Cargo.toml
          --release
          --bin bucephalus
          --bin bucephalus-worker-runner
          --target "${{ matrix.target }}"

      - name: Verify worker runner binary
        run: test -x "target/${{ matrix.target }}/release/bucephalus-worker-runner"

      - name: Build core release archive
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          AR_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-ar' || '' }}
        run: |
          args=(
            --version "${{ steps.version.outputs.version }}"
            --target "${{ matrix.target }}"
          )
          if [[ "${{ steps.worker_runner_cache.outputs.cache-hit }}" != "true" ]]; then
            args+=(--core-bin "target/${{ matrix.target }}/release/bucephalus")
          fi
          scripts/release/build-core-release.sh "${args[@]}"

      - name: Verify core release archive
        run: scripts/release/verify-core-release.sh "dist/releases/bucephalus-${{ matrix.target }}.tar.gz"

      - name: Write core release provenance
        run: >-
          scripts/release/write-core-release-provenance.sh
          --release "dist/releases/bucephalus-${{ matrix.target }}.tar.gz"
          --out "dist/releases/bucephalus-${{ matrix.target }}.provenance.json"

      - name: Upload core release archive
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target }}
          path: |
            dist/releases/bucephalus-${{ matrix.target }}.tar.gz
            dist/releases/bucephalus-${{ matrix.target }}.tar.gz.sha256
            dist/releases/bucephalus-${{ matrix.target }}.provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Extract verified core binary for Cloud bundle
        run: |
          mkdir -p "dist/core-input/${{ matrix.target }}/extracted"
          tar -xzf "dist/releases/bucephalus-${{ matrix.target }}.tar.gz" -C "dist/core-input/${{ matrix.target }}/extracted"
          test -x "dist/core-input/${{ matrix.target }}/extracted/bucephalus"

      - name: Restore Cloud runtime dist cache
        id: cloud_runtime_dist_cache
        uses: actions/cache@v4
        with:
          path: dist/release-cache/cloud-runtime-dist
          key: ${{ runner.os }}-bun-1.3.14-cloud-runtime-dist-${{ hashFiles('scripts/release/build-buc-release.sh', 'bucephalus-cloud/package.runtime.json', 'bucephalus-cloud/bun.runtime.lock', 'bucephalus-cloud/tsconfig.json', 'bucephalus-cloud/src/**') }}

      - name: Build release bundle
        env:
          BUCEPHALUS_RELEASE_SKIP_CLOUD_CHECKS: "true"
        run: >-
          scripts/release/build-buc-release.sh
          --version "${{ steps.version.outputs.version }}"
          --target "${{ matrix.target }}"
          --core-bin "dist/core-input/${{ matrix.target }}/extracted/bucephalus"
          --worker-runner-bin "target/${{ matrix.target }}/release/bucephalus-worker-runner"
          --runtime-dist-cache "dist/release-cache/cloud-runtime-dist"

      - name: Verify release bundle
        run: scripts/release/verify-buc-release.sh "dist/releases/bucephalus-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"

      - name: Write release provenance
        run: >-
          scripts/release/write-cloud-release-provenance.sh
          --release "dist/releases/bucephalus-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          --out "dist/releases/bucephalus-${{ steps.version.outputs.version }}-${{ matrix.target }}.provenance.json"

      - name: Resolve GCP CI/CD auth secret for image publication
        id: gcp_publish_auth
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && inputs.push_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        env:
          BUC_CI_CD: ${{ secrets.BUC_CI_CD }}
          BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          BUCEPHALUS_GCP_SERVICE_ACCOUNT: ${{ secrets.BUCEPHALUS_GCP_SERVICE_ACCOUNT }}
        run: scripts/deploy/resolve-gcp-cicd-secret.sh --mode publish

      - name: Authenticate to Google Cloud for image publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && inputs.push_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.gcp_publish_auth.outputs.workload_identity_provider }}
          service_account: ${{ steps.gcp_publish_auth.outputs.service_account }}

      - name: Set up gcloud for image publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && inputs.push_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"

      - name: Configure Artifact Registry Docker auth
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && inputs.push_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        env:
          BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ steps.gcp_publish_auth.outputs.workload_identity_provider }}
          BUCEPHALUS_GCP_SERVICE_ACCOUNT: ${{ steps.gcp_publish_auth.outputs.service_account }}
        run: >-
          scripts/release/configure-gcp-artifact-registry-auth.sh
          --repository "${BUCEPHALUS_IMAGE_REPOSITORY}"

      - name: Set up Docker Buildx for image cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and inspect Cloud images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          args=(
            --release "dist/releases/bucephalus-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
            --repository "${BUCEPHALUS_IMAGE_REPOSITORY}"
            --base-image "${BUCEPHALUS_BUN_BASE_IMAGE}"
            --out "dist/releases/cloud-image-build-${{ matrix.target }}"
          )
          if [[ "${{ inputs.push_images }}" == "true" ]]; then
            args+=(--push)
          fi
          scripts/release/build-cloud-images.sh "${args[@]}"

      - name: Write image build provenance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: >-
          scripts/release/write-cloud-release-provenance.sh
          --release "dist/releases/bucephalus-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          --image-manifest "dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-build-manifest.json"
          --out "dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-build.provenance.json"

      - name: Write GCP image tfvars
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && inputs.push_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: >-
          scripts/release/write-gcp-image-tfvars.sh
          --image-manifest "dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-build-manifest.json"
          --out "dist/releases/cloud-image-build-${{ matrix.target }}/gcp-image-digests.tfvars"

      - name: Verify GCP image promotion evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && inputs.push_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: >-
          scripts/release/verify-gcp-image-promotion-evidence.sh
          --image-manifest "dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-build-manifest.json"
          --image-provenance "dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-build.provenance.json"
          --tfvars "dist/releases/cloud-image-build-${{ matrix.target }}/gcp-image-digests.tfvars"

      - name: Write Cloud image promotion evidence index
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && inputs.push_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: >-
          scripts/release/write-cloud-image-promotion-evidence-index.sh
          --image-manifest "dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-build-manifest.json"
          --image-provenance "dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-build.provenance.json"
          --tfvars "dist/releases/cloud-image-build-${{ matrix.target }}/gcp-image-digests.tfvars"
          --out "dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-promotion-evidence.json"

      - name: Verify Cloud image promotion evidence index
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && inputs.push_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: >-
          scripts/release/verify-cloud-image-promotion-evidence-index.sh
          "dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-promotion-evidence.json"

      - name: Upload Cloud image build manifest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: actions/upload-artifact@v4
        with:
          name: cloud-image-build-${{ matrix.target }}
          path: |
            dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-build-manifest.json
            dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-build.provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Cloud image promotion evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_images && inputs.push_images && matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: actions/upload-artifact@v4
        with:
          name: cloud-image-promotion-evidence-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-build-manifest.json
            dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-build.provenance.json
            dist/releases/cloud-image-build-${{ matrix.target }}/gcp-image-digests.tfvars
            dist/releases/cloud-image-build-${{ matrix.target }}/cloud-image-promotion-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: bucephalus-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/releases/bucephalus-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/releases/bucephalus-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
            dist/releases/bucephalus-${{ steps.version.outputs.version }}-${{ matrix.target }}.provenance.json
          if-no-files-found: error
          retention-days: 30

  publish-cloud-images-from-release:
    name: Publish Cloud images from release artifact
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_release_version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve source release
        id: resolved_source_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/release/resolve-cloud-release-artifacts.sh
          --version "${{ inputs.source_release_version }}"
          --need release
          --github-output "${GITHUB_OUTPUT}"

      - name: Validate source release image publication inputs
        run: |
          if [[ "${{ inputs.build_images }}" != "true" ]]; then
            echo "source release republish requires build_images=true" >&2
            exit 1
          fi
          source_run_id="${{ steps.resolved_source_release.outputs.release_run_id }}"
          source_artifact_name="${{ steps.resolved_source_release.outputs.release_artifact_name }}"
          if [[ -z "${source_run_id}" ]]; then
            echo "source release could not be resolved from source_release_version" >&2
            exit 1
          fi
          if [[ -z "${source_artifact_name}" ]]; then
            echo "source release artifact name could not be resolved" >&2
            exit 1
          fi
          if [[ -z "${BUCEPHALUS_BUN_BASE_IMAGE}" || "${BUCEPHALUS_BUN_BASE_IMAGE}" != *@sha256:* ]]; then
            echo "BUCEPHALUS_BUN_BASE_IMAGE must be digest-addressed" >&2
            exit 1
          fi
          args=(
            --repository "${BUCEPHALUS_IMAGE_REPOSITORY}"
            --base-image "${BUCEPHALUS_BUN_BASE_IMAGE}"
          )
          base_policy_args=(--base-image "${BUCEPHALUS_BUN_BASE_IMAGE}")
          registry_auth_args=(--repository "${BUCEPHALUS_IMAGE_REPOSITORY}")
          if [[ "${{ inputs.push_images }}" == "true" ]]; then
            args+=(--push)
            base_policy_args+=(--push)
          fi
          scripts/release/verify-cloud-image-publish-inputs.sh "${args[@]}"
          scripts/release/verify-cloud-base-image-policy.sh "${base_policy_args[@]}"
          scripts/release/verify-cloud-registry-auth-boundary.sh "${registry_auth_args[@]}"

      - name: Download verified Cloud release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resolved_source_release.outputs.release_artifact_name }}
          run-id: ${{ steps.resolved_source_release.outputs.release_run_id }}
          path: dist/source-release
          github-token: ${{ github.token }}

      - name: Verify source release artifact
        id: source_release
        run: |
          shopt -s nullglob
          archives=(dist/source-release/*.tar.gz)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "expected exactly one Cloud release archive in source artifact" >&2
            exit 1
          fi
          release_archive="${archives[0]}"
          release_sha="${release_archive}.sha256"
          release_provenance="${release_archive%.tar.gz}.provenance.json"
          if [[ ! -f "${release_sha}" ]]; then
            echo "source artifact is missing ${release_sha}" >&2
            exit 1
          fi
          if [[ ! -f "${release_provenance}" ]]; then
            echo "source artifact is missing ${release_provenance}" >&2
            exit 1
          fi
          scripts/release/verify-buc-release.sh "${release_archive}"
          scripts/release/verify-cloud-release-provenance.sh "${release_provenance}" --release "${release_archive}"
          mkdir -p dist/source-release/extracted
          tar -xzf "${release_archive}" -C dist/source-release/extracted
          mapfile -t release_dirs < <(find dist/source-release/extracted -mindepth 1 -maxdepth 1 -type d | sort)
          if [[ "${#release_dirs[@]}" -ne 1 ]]; then
            echo "source release archive must expand to exactly one release directory" >&2
            exit 1
          fi
          target="$(bun -e 'const data = JSON.parse(await Bun.file(process.argv[1]).text()); console.log(data.target);' "${release_dirs[0]}/release-manifest.json")"
          if [[ "${target}" != "x86_64-unknown-linux-gnu" ]]; then
            echo "Cloud image publication requires x86_64-unknown-linux-gnu release artifact, got ${target}" >&2
            exit 1
          fi
          version="$(bun -e 'const data = JSON.parse(await Bun.file(process.argv[1]).text()); console.log(data.version);' "${release_dirs[0]}/release-manifest.json")"
          {
            echo "release_archive=${release_archive}"
            echo "release_provenance=${release_provenance}"
            echo "target=${target}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve GCP CI/CD auth secret for image publication
        id: gcp_publish_auth
        if: ${{ inputs.push_images }}
        env:
          BUC_CI_CD: ${{ secrets.BUC_CI_CD }}
          BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          BUCEPHALUS_GCP_SERVICE_ACCOUNT: ${{ secrets.BUCEPHALUS_GCP_SERVICE_ACCOUNT }}
        run: scripts/deploy/resolve-gcp-cicd-secret.sh --mode publish

      - name: Authenticate to Google Cloud for image publication
        if: ${{ inputs.push_images }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.gcp_publish_auth.outputs.workload_identity_provider }}
          service_account: ${{ steps.gcp_publish_auth.outputs.service_account }}

      - name: Set up gcloud for image publication
        if: ${{ inputs.push_images }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"

      - name: Configure Artifact Registry Docker auth
        if: ${{ inputs.push_images }}
        env:
          BUCEPHALUS_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ steps.gcp_publish_auth.outputs.workload_identity_provider }}
          BUCEPHALUS_GCP_SERVICE_ACCOUNT: ${{ steps.gcp_publish_auth.outputs.service_account }}
        run: >-
          scripts/release/configure-gcp-artifact-registry-auth.sh
          --repository "${BUCEPHALUS_IMAGE_REPOSITORY}"

      - name: Set up Docker Buildx for image cache
        uses: docker/setup-buildx-action@v3

      - name: Build and inspect Cloud images
        env:
          BUCEPHALUS_SOURCE_RELEASE_RUN_ID: ${{ steps.resolved_source_release.outputs.release_run_id }}
          BUCEPHALUS_SOURCE_RELEASE_ARTIFACT_NAME: ${{ steps.resolved_source_release.outputs.release_artifact_name }}
        run: |
          args=(
            --release "${{ steps.source_release.outputs.release_archive }}"
            --repository "${BUCEPHALUS_IMAGE_REPOSITORY}"
            --base-image "${BUCEPHALUS_BUN_BASE_IMAGE}"
            --out "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}"
          )
          if [[ "${{ inputs.push_images }}" == "true" ]]; then
            args+=(--push)
          fi
          scripts/release/build-cloud-images.sh "${args[@]}"

      - name: Write image build provenance
        run: >-
          scripts/release/write-cloud-release-provenance.sh
          --release "${{ steps.source_release.outputs.release_archive }}"
          --image-manifest "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-build-manifest.json"
          --out "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-build.provenance.json"

      - name: Write GCP image tfvars
        if: ${{ inputs.push_images }}
        run: >-
          scripts/release/write-gcp-image-tfvars.sh
          --image-manifest "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-build-manifest.json"
          --out "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/gcp-image-digests.tfvars"

      - name: Verify GCP image promotion evidence
        if: ${{ inputs.push_images }}
        run: >-
          scripts/release/verify-gcp-image-promotion-evidence.sh
          --image-manifest "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-build-manifest.json"
          --image-provenance "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-build.provenance.json"
          --tfvars "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/gcp-image-digests.tfvars"

      - name: Write Cloud image promotion evidence index
        if: ${{ inputs.push_images }}
        run: >-
          scripts/release/write-cloud-image-promotion-evidence-index.sh
          --image-manifest "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-build-manifest.json"
          --image-provenance "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-build.provenance.json"
          --tfvars "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/gcp-image-digests.tfvars"
          --out "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-promotion-evidence.json"

      - name: Verify Cloud image promotion evidence index
        if: ${{ inputs.push_images }}
        run: >-
          scripts/release/verify-cloud-image-promotion-evidence-index.sh
          "dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-promotion-evidence.json"

      - name: Upload Cloud image build manifest
        uses: actions/upload-artifact@v4
        with:
          name: cloud-image-build-from-release
          path: |
            dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-build-manifest.json
            dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-build.provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Cloud image promotion evidence
        if: ${{ inputs.push_images }}
        uses: actions/upload-artifact@v4
        with:
          name: cloud-image-promotion-evidence-${{ steps.source_release.outputs.version }}-from-release
          path: |
            dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-build-manifest.json
            dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-build.provenance.json
            dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/gcp-image-digests.tfvars
            dist/releases/cloud-image-build-${{ steps.source_release.outputs.target }}/cloud-image-promotion-evidence.json
          if-no-files-found: error
          retention-days: 30

  build-macos-core-release:
    name: Build core CLI (${{ matrix.target }})
    if: ${{ (github.ref_type == 'tag' || inputs.build_public_core_artifacts) && (github.event_name != 'workflow_dispatch' || (!inputs.ui_only && inputs.source_release_version == '')) }}
    needs: release-gates
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: modal-launcher/go.sum

      - name: Resolve version
        id: version
        run: |
          scripts/release/resolve-release-version.sh \
            --override "${{ inputs.version_override }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build core release archive
        run: scripts/release/build-core-release.sh --version "${{ steps.version.outputs.version }}" --target "${{ matrix.target }}"

      - name: Verify core release archive
        run: scripts/release/verify-core-release.sh "dist/releases/bucephalus-${{ matrix.target }}.tar.gz"

      - name: Write core release provenance
        run: >-
          scripts/release/write-core-release-provenance.sh
          --release "dist/releases/bucephalus-${{ matrix.target }}.tar.gz"
          --out "dist/releases/bucephalus-${{ matrix.target }}.provenance.json"

      - name: Upload core release archive
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target }}
          path: |
            dist/releases/bucephalus-${{ matrix.target }}.tar.gz
            dist/releases/bucephalus-${{ matrix.target }}.tar.gz.sha256
            dist/releases/bucephalus-${{ matrix.target }}.provenance.json
          if-no-files-found: error
          retention-days: 30


  publish-github-release:
    name: Publish GitHub release assets
    if: ${{ github.ref_type == 'tag' }}
    needs:
      - build-linux-release
      - build-macos-core-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download core release archives
        uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: dist/core-assets
          merge-multiple: true

      - name: Download Linux cloud release bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bucephalus-*
          path: dist/cloud-assets
          merge-multiple: true

      - name: Write release asset index
        run: >-
          scripts/release/write-release-asset-index.sh
          --assets-dir dist/core-assets
          --assets-dir dist/cloud-assets
          --required-core-target x86_64-unknown-linux-gnu
          --required-core-target aarch64-unknown-linux-gnu
          --required-core-target aarch64-apple-darwin
          --required-core-target x86_64-apple-darwin
          --required-cloud-target x86_64-unknown-linux-gnu
          --required-cloud-target aarch64-unknown-linux-gnu
          --out dist/release-assets.json

      - name: Verify release asset index
        run: scripts/release/verify-release-asset-index.sh dist/release-assets.json

      - name: Attach release archives to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release-assets.json
            dist/core-assets/bucephalus-*.tar.gz
            dist/core-assets/bucephalus-*.tar.gz.sha256
            dist/core-assets/bucephalus-*.provenance.json
            dist/cloud-assets/bucephalus-*.tar.gz
            dist/cloud-assets/bucephalus-*.tar.gz.sha256
            dist/cloud-assets/bucephalus-*.provenance.json
          generate_release_notes: true
