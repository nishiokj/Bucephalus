name: Bucephalus Control Plane Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub environment that owns the control-plane VM secrets"
        required: true
        default: "local-control-plane"
        type: string
      release_url:
        description: "HTTPS URL for bucephalus-<version>-<target>.tar.gz"
        required: true
        type: string
      release_sha256:
        description: "Expected archive SHA256. Leave empty only for trusted smoke deploys."
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Linux control plane
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Download release archive
        run: |
          set -euo pipefail
          mkdir -p dist/deploy
          curl -fsSL --proto =https --tlsv1.2 "${{ inputs.release_url }}" -o dist/deploy/bucephalus-release.tar.gz

      - name: Verify release archive
        if: ${{ inputs.release_sha256 != '' }}
        run: |
          set -euo pipefail
          printf "%s  %s\n" "${{ inputs.release_sha256 }}" dist/deploy/bucephalus-release.tar.gz | sha256sum -c -

      - name: Configure SSH
        env:
          CONTROL_PLANE_SSH_KEY: ${{ secrets.BUCEPHALUS_CONTROL_PLANE_SSH_KEY }}
          CONTROL_PLANE_HOST: ${{ secrets.BUCEPHALUS_CONTROL_PLANE_HOST }}
          CONTROL_PLANE_SSH_PORT: ${{ secrets.BUCEPHALUS_CONTROL_PLANE_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "${CONTROL_PLANE_SSH_KEY}"
          test -n "${CONTROL_PLANE_HOST}"
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf "%s\n" "${CONTROL_PLANE_SSH_KEY}" > "${HOME}/.ssh/bucephalus-control-plane"
          chmod 600 "${HOME}/.ssh/bucephalus-control-plane"
          ssh-keyscan -p "${CONTROL_PLANE_SSH_PORT:-22}" "${CONTROL_PLANE_HOST}" >> "${HOME}/.ssh/known_hosts"

      - name: Upload release archive
        env:
          CONTROL_PLANE_USER: ${{ secrets.BUCEPHALUS_CONTROL_PLANE_USER }}
          CONTROL_PLANE_HOST: ${{ secrets.BUCEPHALUS_CONTROL_PLANE_HOST }}
          CONTROL_PLANE_SSH_PORT: ${{ secrets.BUCEPHALUS_CONTROL_PLANE_SSH_PORT }}
        run: |
          set -euo pipefail
          scp -P "${CONTROL_PLANE_SSH_PORT:-22}" \
            -i "${HOME}/.ssh/bucephalus-control-plane" \
            dist/deploy/bucephalus-release.tar.gz \
            "${CONTROL_PLANE_USER}@${CONTROL_PLANE_HOST}:/tmp/bucephalus-release.tar.gz"

      - name: Install and restart control plane
        env:
          CONTROL_PLANE_USER: ${{ secrets.BUCEPHALUS_CONTROL_PLANE_USER }}
          CONTROL_PLANE_HOST: ${{ secrets.BUCEPHALUS_CONTROL_PLANE_HOST }}
          CONTROL_PLANE_SSH_PORT: ${{ secrets.BUCEPHALUS_CONTROL_PLANE_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -p "${CONTROL_PLANE_SSH_PORT:-22}" \
            -i "${HOME}/.ssh/bucephalus-control-plane" \
            "${CONTROL_PLANE_USER}@${CONTROL_PLANE_HOST}" \
            'set -euo pipefail
             rm -rf /tmp/bucephalus-release
             mkdir -p /tmp/bucephalus-release
             tar -xzf /tmp/bucephalus-release.tar.gz -C /tmp/bucephalus-release
             release_dir="$(find /tmp/bucephalus-release -mindepth 1 -maxdepth 1 -type d | head -n 1)"
             sudo "${release_dir}/bucephalus-cloud/deploy/control-plane/install-control-plane.sh" --release-dir "${release_dir}" --migrate --start
             /opt/bucephalus/current/bucephalus-cloud/deploy/control-plane/smoke-control-plane.sh'
