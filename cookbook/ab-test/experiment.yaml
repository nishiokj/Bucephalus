experiment:
  id: cookbook_ab_test
  name: Cookbook A/B Test
  mode: answer
  description: Baseline versus treatment template over paired cases.
  tags: [cookbook, ab-test]

matrix:
  variants:
    - id: baseline
      baseline: true
      config:
        profile: baseline
    - id: treatment
      config:
        profile: treatment
  cases:
    source: file
    path: cases.jsonl
  repeats: 2

scheduling:
  max_concurrency: 2
  comparison: paired

stages:
  case:
    interface: writable_workspace
    workspace:
      source: container_image
      image: { from: case_row }
      workdir: { from: case_row }
  agent:
    image: node:20-alpine
    mount:
      source: ./agent
      mount:
        path: /opt/agent
        read_only: true
    command: ["node", "/opt/agent/run.js", "--profile", "$profile"]
  grader:
    strategy: none

metrics:
  - id: resolved
    from: result.metrics.resolved
    direction: maximize
    primary: true
  - id: keyword_hits
    from: result.metrics.keyword_hits
    direction: maximize

policy:
  timeout_ms: 120000
  sanitization_profile: hermetic_functional
