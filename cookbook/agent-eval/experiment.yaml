experiment:
  id: cookbook_agent_eval
  name: Cookbook Agent Eval
  description: Smallest no-key agent evaluation template.
  tags: [cookbook, starter]

runtime:
  compute: { backend: local-docker }
  storage: { backend: local-fs, config: { root: .lab/runs/ } }
  traces: { backend: local-stdout }
  network:
    task_sandbox: none
    agent: none

matrix:
  variants:
    - id: balanced
      baseline: true
      config:
        mode: balanced
  cases:
    source: file
    path: cases.jsonl
  repeats: 1
  seeds: [1]

scheduling:
  max_concurrency: 1
  shuffle_tasks: false
  random_seed: 1
  comparison: none

stages:
  case:
    interface: writable_workspace
    workspace:
      source: container_image
      image: { from: case_row }
      workdir: { from: case_row }
  agent:
    image: node:20-alpine
    mount:
      source: ./agent
      mount:
        path: /opt/agent
        read_only: true
    command: ["node", "/opt/agent/run.js", "--mode", "$mode"]
    integration_level: cli_basic
    outputs:
      result:
        capture:
          type: file
          path: /bucephalus/out/result.json
          format: json
          required: true
  execution:
    agent_site: agent_container
  grader:
    strategy: none

metrics:
  - id: resolved
    source:
      type: agent_response
      pointer: /metrics/resolved
    direction: maximize
    primary: true
  - id: keyword_hits
    source:
      type: agent_response
      pointer: /metrics/keyword_hits
    direction: maximize

policy:
  timeout_ms: 120000
  sanitization_profile: hermetic_functional
  task_sandbox: {}
