experiment:
  id: cookbook_agent_eval
  name: Cookbook Agent Eval
  mode: answer
  description: Smallest no-key agent evaluation template.
  tags: [cookbook, starter]

matrix:
  variants:
    - id: balanced
      baseline: true
      config:
        profile: balanced
  cases:
    source: file
    path: cases.jsonl

stages:
  case:
    interface: writable_workspace
    workspace:
      source: container_image
      image: { from: case_row }
      workdir: { from: case_row }
  agent:
    image: node:20-alpine
    mount:
      source: ./agent
      mount:
        path: /opt/agent
        read_only: true
    command: ["node", "/opt/agent/run.js", "--profile", "$profile"]
  grader:
    strategy: none

metrics:
  - id: resolved
    from: result.metrics.resolved
    direction: maximize
    primary: true
  - id: keyword_hits
    from: result.metrics.keyword_hits
    direction: maximize

policy:
  timeout_ms: 120000
  sanitization_profile: hermetic_functional
