experiment:
  id: cookbook_parameter_sweep
  name: Cookbook Parameter Sweep
  mode: answer
  description: Multi-variant sweep template for agent configuration.
  tags: [cookbook, sweep]

matrix:
  variants:
    - id: terse
      baseline: true
      config:
        tone: terse
    - id: balanced
      config:
        tone: balanced
    - id: expansive
      config:
        tone: expansive
  cases:
    source: file
    path: cases.jsonl

scheduling:
  max_concurrency: 3

stages:
  case:
    interface: writable_workspace
    workspace:
      source: container_image
      image: { from: case_row }
      workdir: { from: case_row }
  agent:
    image: node:20-alpine
    mount:
      source: ./agent
      mount:
        path: /opt/agent
        read_only: true
    command: ["node", "/opt/agent/run.js", "--tone", "$tone"]
  grader:
    strategy: none

metrics:
  - id: score
    from: result.metrics.score
    direction: maximize
    primary: true
  - id: prompt_chars
    from: result.metrics.prompt_chars
    direction: minimize

policy:
  timeout_ms: 120000
  sanitization_profile: hermetic_functional
