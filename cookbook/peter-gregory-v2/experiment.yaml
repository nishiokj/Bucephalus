experiment:
  id: peter_gregory
  name: Peter Gregory — Latent Exposure Detection
  description: >-
    Each case hands the agent a daily external event feed (news / earnings /
    regulations / social) plus full read access to an enterprise ontology, and
    asks it to identify any latent exposure on open sales orders. Four cases
    contain a true positive at hop-4 in the ontology graph; four are
    false-positive traps where the headline looks load-bearing but does not
    actually thread through to any order.
  tags: [latent-edge, supply-chain, blog-bench]

runtime:
  compute: { backend: local-docker }
  storage: { backend: local-fs }
  traces: { backend: local-stdout }
  secrets:
    - name: codex_oauth
      from: file
      mount:
        target: /root/.config/nova/codex-auth.json
  network:
    task_sandbox: full   # agent makes outbound model API calls
    agent: full

externals:
  apis: [chatgpt.com, auth.openai.com]
  credentials: [codex_oauth]

matrix:
  variants:
    - id: gpt_5_5_codex_a
      baseline: true
      config: { provider: codex, model: gpt-5.5 }
    - id: gpt_5_5_codex_b
      config: { provider: codex, model: gpt-5.5 }
  cases:
    source: file
    path: cases.jsonl
  repeats: 1
  seeds: [1]

scheduling:
  max_concurrency: 2
  shuffle_tasks: false
  random_seed: 1
  comparison: none

ephemerals: {}

stages:
  case:
    interface: writable_workspace
    workspace:
      source: container_image
      image: { from: case_row }
      workdir: { from: case_row }
  agent:
    mount:
      source: agent
      mount:
        path: /opt/peter-gregory/agent
        read_only: true
    command:
      - /opt/peter-gregory/agent/run_nova_pg.js
    env:
      PROVIDER: "$provider"
      MODEL: "$model"
      RESPONSE_TIMEOUT_MS: "540000"
    integration_level: cli_basic
    outputs:
      result:
        capture:
          type: file
          path: /bucephalus/out/result.json
          format: json
          required: true
      nova_events:
        capture:
          type: file
          path: /bucephalus/out/nova/events.jsonl
          format: text
          required: false
      nova_stdout:
        capture:
          type: file
          path: /bucephalus/out/nova/stdout.log
          format: text
          required: false
      nova_stderr:
        capture:
          type: file
          path: /bucephalus/out/nova/stderr.log
          format: text
          required: false
  execution:
    agent_site: task_runtime
  grader:
    strategy: none

metrics:
  - id: schema_valid
    source: { type: agent_response, pointer: /metrics/schema_valid }
    direction: maximize
    primary: true
    required: true
  - id: submitted_present
    source: { type: agent_response, pointer: /metrics/submitted_present }
    direction: maximize
  - id: json_parse_error
    source: { type: agent_response, pointer: /metrics/json_parse_error }
    direction: minimize
  - id: event_count
    source: { type: agent_response, pointer: /metrics/event_count }
    direction: maximize
  - id: alert_count
    source: { type: agent_response, pointer: /metrics/alert_count }
    direction: maximize
  - id: dismissal_count
    source: { type: agent_response, pointer: /metrics/dismissal_count }
    direction: maximize
  - id: latent_edge_count
    source: { type: agent_response, pointer: /metrics/latent_edge_count }
    direction: maximize
  - id: latent_node_count_total
    source: { type: agent_response, pointer: /metrics/latent_node_count_total }
    direction: maximize
  - id: latent_node_count_max
    source: { type: agent_response, pointer: /metrics/latent_node_count_max }
    direction: maximize
  - id: affected_order_count
    source: { type: agent_response, pointer: /metrics/affected_order_count }
    direction: maximize
  - id: affected_product_count
    source: { type: agent_response, pointer: /metrics/affected_product_count }
    direction: maximize
  - id: supporting_record_count
    source: { type: agent_response, pointer: /metrics/supporting_record_count }
    direction: maximize
  - id: revenue_at_risk_total
    source: { type: agent_response, pointer: /metrics/revenue_at_risk_total }
    direction: maximize
  - id: response_text_bytes
    source: { type: agent_response, pointer: /metrics/response_text_bytes }
    direction: maximize
  - id: elapsed_seconds
    source: { type: agent_response, pointer: /metrics/elapsed_seconds }
    direction: minimize

policy:
  timeout_ms: 600000
  task_sandbox:
    resources:
      cpu_count: 2
      memory_mb: 2048
