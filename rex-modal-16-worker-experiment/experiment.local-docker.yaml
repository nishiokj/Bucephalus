experiment:
  id: rex_local_docker_8_worker_smoke
  name: Rex Local Docker 8 Worker Smoke

runtime:
  compute: { backend: local-docker }
  storage: { backend: local-fs, config: { root: .lab/runs/ } }
  traces: { backend: local-stdout }
  secrets:
    - { name: OPENAI_API_KEY, from: env }
  network:
    task_sandbox: full
    agent: full

matrix:
  variants:
    - id: rex_standard
      baseline: true
      config:
        model_provider: openai
        model: gpt-5-mini
        agent_type: standard
        provider_env_binding: openai=OPENAI_API_KEY
    - id: rex_coding
      config:
        model_provider: openai
        model: gpt-5-mini
        agent_type: coding
        provider_env_binding: openai=OPENAI_API_KEY
  tasks:
    source: file
    path: cases.jsonl
  repeats: 3
  seeds: [1, 2, 3]

scheduling:
  max_concurrency: 8
  shuffle_tasks: true
  random_seed: 20260521
  comparison: paired

stages:
  case:
    interface: writable_workspace
    workspace:
      source: container_image
      image: { from: case_row }
      workdir: { from: case_row }
  agent:
    image: docker.io/jevnishioka1/agentlab-rex-modal@sha256:056337363994a9a9c8cff4a0655bdd1da7ed9c64ff8944f38265c0724c8424d7
    command:
      - sh
      - -lc
      - |
        set +e
        bun /opt/agent/packages/infra/harness-daemon/bin/rex.ts run \
          --input "Read the JSON file pointed to by the AGENTLAB_TRIAL_INPUT_PATH environment variable, find the task or case prompt inside it, and answer that prompt. If the file has no prompt, write a short AgentLab preflight acknowledgment." \
          --output /agentlab/out/result.json \
          --events /agentlab-events/trajectory.jsonl \
          --working-dir /workspace/task \
          --provider "$1" \
          --model "$2" \
          --agent-type "$3" \
          --provider-env "$4" \
          --timeout-ms 90000
        printf '%s\n' $? > /tmp/rex-status
        exit `cat /tmp/rex-status`
      - rex-agent
      - $model_provider
      - $model
      - $agent_type
      - $provider_env_binding
    env:
      OPENAI_API_KEY: "$OPENAI_API_KEY"
      HOME: /root
    integration_level: cli_events
    events:
      - id: rex_events
        format: jsonl
        mode: jsonl
        ingest: true
        retain_raw: true
    outputs:
      result:
        capture:
          type: file
          path: /agentlab/out/result.json
          format: json
          required: true
  execution:
    agent_site: agent_container
  grader:
    strategy: none

metrics:
  - id: latency_ms
    source: { type: agent_response, pointer: /usage/latency_ms }
    direction: minimize
    primary: true
  - id: model_calls
    source: { type: agent_response, pointer: /usage/model_calls }
    direction: minimize
  - id: tool_calls
    source: { type: agent_response, pointer: /usage/tool_calls }
    direction: minimize
  - id: tokens_in
    source: { type: agent_response, pointer: /usage/tokens_in }
    direction: minimize
  - id: tokens_out
    source: { type: agent_response, pointer: /usage/tokens_out }
    direction: minimize

policy:
  timeout_ms: 120000
  sanitization_profile: perf_benchmark
  task_sandbox:
    resources:
      cpu_count: 4
      memory_mb: 4096
