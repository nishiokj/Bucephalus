[package]
name = "bucephalus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust CLI for building, running, and inspecting Bucephalus experiments"
readme = "../../../README.md"
keywords = ["bucephalus", "cli", "experiments", "evaluation"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/Cargo.toml",
  "/src/**",
  "/../../../LICENSE",
  "/../../../README.md",
  "/../lab-analysis/src/**",
  "/../lab-analysis/views/**",
  "/../lab-core/src/**",
  "/../lab-provenance/src/**",
  "/../lab-runner/src/**",
  "/../lab-runner/testdata/**",
  "/../lab-schemas/src/**",
  "/../lab-schemas/build.rs",
  "/../../../schemas/*.jsonschema",
  "/../../../manifests/**",
]

[[bin]]
name = "bucephalus"
path = "src/main.rs"
required-features = ["core-cli"]

[[bin]]
name = "lab"
path = "src/bin/lab.rs"
required-features = ["core-cli"]

[[bin]]
name = "bucephalus-worker-runner"
path = "src/bin/bucephalus-worker-runner.rs"
required-features = ["worker-runner"]

[[bin]]
name = "bucephalus-cloud"
path = "src/bin/bucephalus-cloud.rs"
required-features = ["cloud-operator"]

[[bin]]
name = "buc"
path = "src/bin/buc.rs"
required-features = ["hosted-cli"]

[features]
default = ["core-cli", "worker-runner-postgres", "cloud-operator", "hosted-cli"]
core-cli = [
  "dep:base64",
  "dep:chrono",
  "dep:clap",
  "dep:crossterm",
  "dep:ctrlc",
  "dep:flate2",
  "dep:lab-analysis",
  "dep:lab-core",
  "dep:lab-provenance",
  "dep:lab-runner",
  "dep:lab-schemas",
  "dep:libc",
  "dep:percent-encoding",
  "dep:ratatui",
  "dep:reqwest",
  "dep:rusqlite",
  "dep:serde",
  "dep:serde_yaml",
  "dep:sha2",
  "dep:tar",
  "dep:walkdir",
]
worker-runner = [
  "dep:clap",
  "dep:lab-runner",
]
worker-runner-postgres = [
  "worker-runner",
  "lab-runner/postgres-store",
]
cloud-operator = [
  "dep:flate2",
  "dep:lab-core",
  "dep:percent-encoding",
  "dep:reqwest",
  "dep:serde_yaml",
  "dep:sha2",
  "dep:tar",
]
hosted-cli = [
  "dep:flate2",
  "dep:lab-core",
  "dep:percent-encoding",
  "dep:reqwest",
  "dep:serde_yaml",
  "dep:sha2",
  "dep:tar",
]

[dependencies]
anyhow.workspace = true
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
lab-analysis = { workspace = true, optional = true }
lab-core = { workspace = true, optional = true }
lab-provenance = { workspace = true, optional = true }
lab-runner = { workspace = true, default-features = false, optional = true }
lab-schemas = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
