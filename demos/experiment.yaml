version: '0.3'
experiment:
  id: swebench_mini_harness_eval
  name: SWE-bench Mini Harness Eval
  workload_type: agent_runtime
  description: Small real issue set for testing harness metrics and artifacts.
  owner: demos

dataset:
  suite_id: swebench_mini
  provider: local_jsonl
  path: ./swebench_mini_tasks.jsonl
  schema_version: task_jsonl_v1
  split_id: eval
  limit: 4

design:
  sanitization_profile: hermetic_functional
  comparison: paired
  replications: 1
  random_seed: 42
  shuffle_tasks: true
  max_concurrency: 1

metrics:
  - id: difficulty_match
    source:
      type: grader_output
      output: grade
      pointer: /resolved
    direction: maximize
    weight: 1
    primary: true
  - id: keyword_hits
    source:
      type: agent_response
      pointer: /metrics/keyword_hits
    weight: 0
    primary: false
  - id: response_chars
    source:
      type: agent_response
      pointer: /metrics/response_chars
    weight: 0
    primary: false

artifacts:
  collect:
    - artifacts/**/*.json
    - artifacts/**/*.txt
  diff: true
  base_dir: .

baseline:
  variant_id: control
  bindings:
    difficulty_threshold: 5
    difficulty_bias: 0

variant_plan:
  - variant_id: treatment
    bindings:
      difficulty_threshold: 2
      difficulty_bias: 0

trial_runtime:
  task:
    interface: writable_workspace
    workspace:
      source: container_image
      image:
        from: task_row
      workdir:
        from: task_row
  agent:
    artifact:
      source: .
      mount:
        path: /opt/agent
        read_only: true
    image: node:20-alpine
    command:
      - node
      - /opt/agent/agentlab_demo_harness.js
    integration_level: cli_events
    network: none
    outputs:
      result:
        capture:
          type: file
          path: /agentlab/out/result.json
          format: json
  execution:
    agent_site: agent_container
  grader:
    strategy: in_task_runtime
    command:
      - node
      - ./agentlab_demo_grader.js
    inputs:
      agent_result:
        source:
          output: agent.result
        materialize:
          as: json_file
          path: /agentlab/out/grader_result.json
        required: true
    outputs:
      grade:
        capture:
          type: file
          path: /agentlab/out/demo_grader_report.json
          format: json
          required: true

policy:
  timeout_ms: 600000
  task_sandbox:
    profile: hermetic_functional
    network: none
    allowed_hosts: []

validity:
  fail_on_state_leak: true
  fail_on_profile_invariant_violation: true
