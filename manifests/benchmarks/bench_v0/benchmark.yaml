schema_version: benchmark_manifest_v1
id: bench_v0
dataset:
  path: .lab/experiments/data/bench_v0.task_rows.jsonl
  suite_id: bench_v0
  split_id: test
metrics:
  - id: resolved
    source:
      type: grader_output
      output: mapped_grader_output
      pointer: /payload/resolved
    direction: maximize
    primary: true
  - id: hidden_cases_passed
    source:
      type: grader_output
      output: mapped_grader_output
      pointer: /payload/hidden_cases_passed
    primary: false
  - id: hidden_cases_total
    source:
      type: grader_output
      output: mapped_grader_output
      pointer: /payload/hidden_cases_total
    primary: false
policy:
  task_model: independent
  evaluator_mode: custom
  scoring_lifecycle: predict_then_score
  chain_failure_policy: continue_with_flag
task_sandbox:
  runtime_kind: docker
  profile: default
trial_runtime:
  task:
    interface: writable_workspace
    workspace:
      source: container_image
      image:
        from: task_row
      workdir:
        from: task_row
  execution:
    agent_site: task_runtime
  grader:
    strategy: in_task_runtime
    command:
      - python3
      - __AGENTLAB_TASK_WORKDIR__/.agentlab/support/bench/integration/agentlab/bench_benchmark_adapter.py
    outputs:
      mapped_grader_output:
        capture:
          type: file
          path: /agentlab/out/mapped_grader_output.json
          format: json
          required: true
    _runtime_assets:
      - build_source_path: bench
        runtime_path: __AGENTLAB_TASK_WORKDIR__/.agentlab/support/bench
        required: true
        read_only: true
